                <div x-show="dealerNotifications.length===0" class="text-slate-400 p-2">No updates yet.</div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ============================================ DEALER: TRACKER ============================================ -->
      <template x-if="session.role==='dealer' && view==='d-tracker'">
        <div>
          <div class="flex items-end justify-between mb-5">
            <h1 class="text-2xl font-black tracking-tight">My vehicles</h1>
            <div class="flex gap-2">
              <input class="input max-w-xs" x-model="vehicleSearch" placeholder="Search…" />
              <select class="select" x-model="vehicleStatusFilter">
                <option value="">All</option>
                <template x-for="s in STATUSES" :key="s.code"><option :value="s.code" x-text="s.label"></option></template>
              </select>
            </div>
          </div>
          <div class="card overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 text-xs uppercase tracking-wider text-slate-500">
                <tr>
                  <th class="text-left p-3">Vehicle</th>
                  <th class="text-left p-3">Stock</th>
                  <th class="text-left p-3">Status</th>
                  <th class="text-left p-3">Drop-off</th>
                  <th class="text-left p-3">Promised</th>
                  <th class="text-right p-3">Total</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <template x-for="v in dealerFilteredVehicles" :key="v.id">
                  <tr class="hover:bg-slate-50 cursor-pointer" @click="openVehicle(v.id)">
                    <td class="p-3 font-semibold" x-text="v.year + ' ' + v.make + ' ' + v.model"></td>
                    <td class="p-3 font-mono text-xs" x-text="v.stockNumber"></td>
                    <td class="p-3">
                      <span class="status-chip" :style="`background:${statusMeta(v.status).bg};color:${statusMeta(v.status).fg}`">
                        <span class="dot" :style="`background:${statusMeta(v.status).fg}`"></span>
                        <span x-text="statusMeta(v.status).label"></span>
                      </span>
                    </td>
                    <td class="p-3 text-xs text-slate-500" x-text="formatDate(v.dropOffTime)"></td>
                    <td class="p-3 text-xs" :class="isOverdue(v) ? 'text-rose-600 font-semibold' : 'text-slate-500'" x-text="formatDate(v.promisedTime)"></td>
                    <td class="p-3 text-right font-semibold" x-text="money(vehicleTotal(v))"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div x-show="dealerFilteredVehicles.length===0" class="p-8 text-center text-sm text-slate-400">No vehicles yet.</div>
          </div>
        </div>
      </template>

      <!-- ============================================ DEALER: DROPOFF ============================================ -->
      <template x-if="session.role==='dealer' && view==='d-dropoff'">
        <div class="max-w-2xl">
          <h1 class="text-2xl font-black tracking-tight mb-1">Schedule a drop-off</h1>
          <p class="text-sm text-slate-500 mb-5">Submit a request — Wash Depot will confirm and check in the vehicle on arrival.</p>

          <form @submit.prevent="submitDropoffRequest()" class="card p-5 space-y-4">
            <div class="grid grid-cols-4 gap-3">
              <div><label class="label">Year</label><input class="input" x-model="intake.year" /></div>
              <div><label class="label">Make *</label><input class="input" x-model="intake.make" required /></div>
              <div><label class="label">Model *</label><input class="input" x-model="intake.model" required /></div>
              <div><label class="label">Color</label><input class="input" x-model="intake.color" /></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="label">Stock #</label><input class="input" x-model="intake.stockNumber" /></div>
              <div><label class="label">VIN</label><input class="input font-mono uppercase" x-model="intake.vin" /></div>
            </div>
            <div>
              <label class="label">Services requested</label>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <template x-for="rate in rateSheetFor(currentDealership.id)" :key="rate.serviceId">
                  <label class="flex items-center justify-between gap-2 border border-slate-200 rounded-lg px-3 py-2 cursor-pointer hover:bg-slate-50" :class="{'bg-teal-50 border-teal-300': intake.services.includes(rate.serviceId)}">
                    <div class="flex items-center gap-2">
                      <input type="checkbox" :value="rate.serviceId" x-model="intake.services" />
                      <div class="text-sm font-semibold" x-text="rateLabel(rate)"></div>
                    </div>
                    <span class="text-sm font-bold" x-text="money(rate.price)"></span>
                  </label>
                </template>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="label">Expected drop-off</label><input type="datetime-local" class="input" x-model="intake.dropOffTime" /></div>
              <div><label class="label">Pickup or delivery back</label>
                <select class="select" x-model="intake.deliveryMethod">
                  <option value="pickup">We'll pick up</option>
                  <option value="delivery">Wash Depot delivers</option>
                </select>
              </div>
            </div>
            <div><label class="label">Notes</label><textarea class="textarea" rows="2" x-model="intake.notes"></textarea></div>
            <div class="flex justify-between items-center pt-2 border-t border-slate-100">
              <div><span class="text-slate-500 text-sm">Estimate: </span><span class="font-bold text-lg" x-text="money(intakeEstimate)"></span></div>
              <button type="submit" class="btn btn-primary">Submit drop-off request</button>
            </div>
          </form>
        </div>
      </template>

      <!-- ============================================ DEALER: MY BOOKINGS ============================================ -->
      <template x-if="session.role==='dealer' && view==='d-bookings'">
        <div>
          <div class="flex items-end justify-between mb-5">
            <div>
              <h1 class="text-2xl font-black tracking-tight" x-text="'Hello, ' + currentDealership.contacts[0].name.split(' ')[0]"></h1>
              <p class="text-sm text-slate-500" x-text="currentDealership.name"></p>
            </div>
            <button @click="view='d-schedule'; resetBooking()" class="btn btn-primary">+ Schedule Service</button>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
            <div class="card p-4"><div class="text-xs uppercase font-bold text-slate-500">Upcoming</div><div class="text-2xl font-black mt-1" x-text="dealerBookings.filter(v=>v.status==='scheduled').length"></div></div>
            <div class="card p-4"><div class="text-xs uppercase font-bold text-slate-500">In Service</div><div class="text-2xl font-black mt-1" x-text="dealerBookings.filter(v=>['dropped','queue','service','qc'].includes(v.status)).length"></div></div>
            <div class="card p-4"><div class="text-xs uppercase font-bold text-slate-500">Ready</div><div class="text-2xl font-black mt-1 text-teal-700" x-text="dealerBookings.filter(v=>v.status==='ready').length"></div></div>
            <div class="card p-4"><div class="text-xs uppercase font-bold text-slate-500">Completed (all-time)</div><div class="text-2xl font-black mt-1" x-text="dealerBookings.filter(v=>v.status==='completed').length"></div></div>
          </div>

          <h3 class="font-bold mb-2 mt-5">Upcoming bookings</h3>
          <div class="space-y-2 mb-6">
            <template x-for="v in dealerBookings.filter(x=>x.status==='scheduled')" :key="v.id">
              <div class="card p-4 flex items-center gap-4 border-l-4 border-l-cyan-500">
                <div class="w-12 h-12 rounded-lg bg-cyan-50 text-cyan-700 flex items-center justify-center text-xl"></div>
                <div class="flex-1">
                  <div class="font-bold" x-text="v.year + ' ' + v.make + ' ' + v.model + ' · #' + v.stockNumber"></div>
                  <div class="text-sm text-slate-600" x-text="formatDate(v.dropOffTime,'long') + ' · ' + timeSlotLabel(v.timeSlot)"></div>
                  <div class="text-xs text-slate-500 mt-0.5">
                    <span x-text="(v.deliveryMethod==='pickup' ? 'You drop off' : 'Wash Depot picks up')"></span>
                    <span x-show="v.confirmed" class="ml-2 text-teal-700 font-semibold">Confirmed</span>
                    <span x-show="!v.confirmed" class="ml-2 text-amber-600 font-semibold">⏳ Awaiting confirmation</span>
                  </div>
                </div>
                <button @click="cancelBooking(v.id)" class="text-xs text-rose-600 hover:underline">Cancel</button>
              </div>
            </template>
            <div x-show="!dealerBookings.filter(x=>x.status==='scheduled').length" class="card p-8 text-center text-sm text-slate-400">
              No upcoming bookings. <button @click="view='d-schedule'; resetBooking()" class="text-teal-700 underline">Schedule one →</button>
            </div>
          </div>

          <h3 class="font-bold mb-2 mt-5">In service / ready</h3>
          <div class="space-y-2 mb-6">
            <template x-for="v in dealerBookings.filter(x=>['dropped','queue','service','qc','ready'].includes(x.status))" :key="v.id">
              <div class="card p-4 flex items-center gap-3">
                <div>
                  <div class="font-semibold" x-text="v.year + ' ' + v.make + ' ' + v.model"></div>
                  <div class="text-xs text-slate-500" x-text="'Stock #' + v.stockNumber"></div>
                </div>
                <div class="ml-auto">
                  <span class="status-chip" :style="`background:${statusMeta(v.status).bg};color:${statusMeta(v.status).fg}`">
                    <span class="dot" :style="`background:${statusMeta(v.status).fg}`"></span>
                    <span x-text="statusMeta(v.status).label"></span>
                  </span>
                </div>
              </div>
            </template>
            <div x-show="!dealerBookings.filter(x=>['dropped','queue','service','qc','ready'].includes(x.status)).length" class="text-xs text-slate-400 italic px-2">Nothing in the wash right now.</div>
          </div>
        </div>
      </template>

      <!-- ============================================ DEALER: SCHEDULE SERVICE ============================================ -->
      <template x-if="session.role==='dealer' && view==='d-schedule'">
        <div class="max-w-3xl">
          <h1 class="text-2xl font-black tracking-tight mb-1">Schedule a service</h1>
          <p class="text-sm text-slate-500 mb-5">Pick a date, services, and we'll handle the rest. Wash Depot will confirm via email.</p>

          <form @submit.prevent="submitBooking()" class="card p-6 space-y-5">
            <!-- Vehicle -->
            <div>
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Vehicle</h3>
              <div class="grid grid-cols-4 gap-3">
                <div><label class="label">Year</label><input class="input" x-model="booking.year" placeholder="2024" /></div>
                <div><label class="label">Make *</label><input class="input" x-model="booking.make" required placeholder="Toyota" /></div>
                <div><label class="label">Model *</label><input class="input" x-model="booking.model" required placeholder="RAV4" /></div>
                <div><label class="label">Color</label><input class="input" x-model="booking.color" /></div>
              </div>
              <div class="grid grid-cols-2 gap-3 mt-3">
                <div><label class="label">Stock #</label><input class="input" x-model="booking.stockNumber" /></div>
                <div><label class="label">VIN (optional)</label><input class="input font-mono uppercase" x-model="booking.vin" /></div>
              </div>
            </div>

            <!-- Services -->
            <div>
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Services</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <template x-for="rate in rateSheetFor(currentDealership.id)" :key="rate.serviceId">
                  <label class="flex items-center justify-between gap-2 border border-slate-200 rounded-lg px-3 py-2 cursor-pointer hover:bg-slate-50" :class="{'bg-teal-50 border-teal-300': booking.services.includes(rate.serviceId)}">
                    <div class="flex items-center gap-2">
                      <input type="checkbox" :value="rate.serviceId" x-model="booking.services" />
                      <div class="text-sm font-semibold" x-text="rateLabel(rate)"></div>
                    </div>
                    <span class="text-sm font-bold" x-text="money(rate.price)"></span>
                  </label>
                </template>
              </div>
            </div>

            <!-- Date & time -->
            <div>
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Date &amp; time</h3>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="label">Date *</label>
                  <input type="date" class="input" x-model="booking.date" :min="new Date().toISOString().split('T')[0]" required />
                </div>
                <div>
                  <label class="label">Time slot</label>
                  <select class="select" x-model="booking.timeSlot">
                    <option value="morning">Morning (8am-12pm)</option>
                    <option value="afternoon">Afternoon (12-5pm)</option>
                    <option value="anytime">Anytime that day</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Logistics -->
            <div>
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Logistics</h3>
              <div class="grid grid-cols-1 gap-2">
                <label class="border border-slate-200 rounded-lg p-3 cursor-pointer flex items-center gap-3" :class="{'bg-teal-50 border-teal-300': booking.deliveryMethod==='pickup'}">
                  <input type="radio" name="dm" value="pickup" x-model="booking.deliveryMethod" />
                  <div>
                    <div class="font-semibold text-sm">We'll drop it off at Wash Depot</div>
                    <div class="text-xs text-slate-500">Bring the vehicle to the shop ourselves.</div>
                  </div>
                </label>
                <label class="border border-slate-200 rounded-lg p-3 cursor-pointer flex items-center gap-3" :class="{'bg-teal-50 border-teal-300': booking.deliveryMethod==='delivery'}">
                  <input type="radio" name="dm" value="delivery" x-model="booking.deliveryMethod" />
                  <div>
                    <div class="font-semibold text-sm">Wash Depot picks up &amp; delivers back</div>
                    <div class="text-xs text-slate-500">Vehicle stays at our dealership lot until pickup.</div>
                  </div>
                </label>
              </div>
            </div>

            <!-- Notes -->
            <div>
              <label class="label">Notes / special instructions</label>
              <textarea class="textarea" rows="2" x-model="booking.notes" placeholder="Pet hair on rear seats, requests Carlos, key in lockbox 3, etc."></textarea>
            </div>

            <!-- Estimate -->
            <div class="flex items-center justify-between pt-4 border-t border-slate-100">
              <div class="text-sm">
                <span class="text-slate-500">Estimated total: </span>
                <span class="font-bold text-lg" x-text="money(booking.services.reduce((s, sid) =>s + (rateSheetFor(currentDealership.id).find(r=>r.serviceId===sid)?.price||0), 0))"></span>
              </div>
              <div class="flex gap-2">
                <button type="button" @click="view='d-bookings'" class="btn btn-outline">Cancel</button>
                <button type="submit" class="btn btn-primary">Confirm booking</button>
              </div>
            </div>
          </form>
        </div>
      </template>

      <!-- ============================================ DEALER: INVOICES & PAY ============================================ -->
      <template x-if="session.role==='dealer' && view==='d-invoices'">
        <div>
          <div class="flex items-end justify-between mb-5">
            <div>
              <h1 class="text-2xl font-black tracking-tight" x-text="'Hello, ' + currentDealership.contacts[0].name.split(' ')[0]"></h1>
              <p class="text-sm text-slate-500" x-text="currentDealership.name"></p>
            </div>
            <div class="text-right">
              <div class="text-xs uppercase font-bold tracking-wider text-slate-500">Open balance</div>
              <div class="text-2xl font-black" :class="dealerKpis.openBalance>0?'text-rose-600':'text-teal-700'" x-text="money(dealerKpis.openBalance)"></div>
            </div>
          </div>

          <div class="space-y-3">
            <template x-for="inv in dealerInvoices" :key="inv.id">
              <div class="card p-4">
                <div class="flex items-start gap-4">
                  <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                      <span class="font-mono font-bold text-sm" x-text="inv.number"></span>
                      <span class="status-chip" :style="invoiceChipStyle(inv)" x-text="invoiceStatusLabel(inv)"></span>
                    </div>
                    <div class="text-xs text-slate-500" x-text="'Issued ' + formatDate(inv.issuedAt) + ' · Due ' + formatDate(inv.dueAt) + ' · ' + inv.lineItems.length + ' line items'"></div>
                    <div x-show="inv.paymentMethod" class="text-xs text-teal-700 font-semibold mt-1">
                      <span x-show="inv.status==='paid'">Paid via <span x-text="paymentMethodLabel(inv.paymentMethod)"></span>on <span x-text="formatDate(inv.paidAt)"></span></span>
                      <span x-show="inv.status==='pending_check'">Check mailed — awaiting receipt</span>
                      <span x-show="inv.status==='pending_ach' || inv.status==='pending_zelle'">⏳ <span x-text="paymentMethodLabel(inv.paymentMethod)"></span>payment submitted — pending confirmation</span>
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-2xl font-black" x-text="money(inv.total)"></div>
                  </div>
                </div>
                <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                  <button @click="openInvoice(inv.id)" class="btn btn-outline text-sm">View details</button>
                  <button x-show="inv.status==='sent' || (inv.status==='draft')" @click="openPayModal(inv.id)" class="btn btn-primary text-sm">Pay this invoice</button>
                  <span x-show="inv.status!=='sent' && inv.status!=='draft' && inv.status!=='paid'" class="text-xs text-slate-500 italic self-center">Payment in progress — Wash Depot will confirm</span>
                </div>
              </div>
            </template>
            <div x-show="dealerInvoices.length===0" class="card p-8 text-center text-sm text-slate-400">No invoices yet.</div>
          </div>
        </div>
      </template>

      <!-- ============================================ DEALER: NOTIFICATIONS ============================================ -->
      <template x-if="session.role==='dealer' && view==='d-notifications'">
        <div>
          <h1 class="text-2xl font-black tracking-tight mb-5">Notifications</h1>
          <div class="card divide-y divide-slate-100">
            <template x-for="n in dealerNotifications" :key="n.id">
              <div class="p-4 flex items-start gap-3" :class="!n.readByDealer && 'bg-teal-50/40'">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-lg" :class="channelStyle(n.channel)" x-text="channelIcon(n.channel)"></div>
                <div class="flex-1">
                  <div class="font-semibold text-sm" x-text="n.subject"></div>
                  <p class="text-xs text-slate-600 mt-1" x-text="n.body"></p>
                  <div class="text-[10px] text-slate-400 mt-1" x-text="relativeTime(n.sentAt)"></div>
                </div>
                <button x-show="!n.readByDealer" @click="markRead(n.id)" class="text-xs text-teal-700 hover:underline">Mark read</button>
              </div>
            </template>
            <div x-show="dealerNotifications.length===0" class="p-8 text-center text-sm text-slate-400">No notifications.</div>
          </div>
        </div>
      </template>

      <!-- ============================================ DEALER: SETTINGS ============================================ -->
      <template x-if="session.role==='dealer' && view==='d-settings'">
        <div class="max-w-2xl">
          <h1 class="text-2xl font-black tracking-tight mb-5">Settings</h1>

          <div class="card p-4 mb-4">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold">Your service rates</h3>
              <span class="text-xs text-slate-500" x-text="currentDealership.rateSheet.length + ' line items'"></span>
            </div>
            <p class="text-xs text-slate-500 mb-3">These are your negotiated prices with Wash Depot. Contact your account manager to make changes.</p>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="text-xs uppercase tracking-wider text-slate-500 border-b border-slate-200">
                  <tr>
                    <th class="text-left py-2 pr-3">Service</th>
                    <th class="text-left py-2 px-3">Description</th>
                    <th class="text-right py-2 pl-3 w-24">Price</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <template x-for="rate in currentDealership.rateSheet" :key="rate.serviceId">
                    <tr>
                      <td class="py-2 pr-3 font-semibold" x-text="rateLabel(rate)"></td>
                      <td class="py-2 px-3 text-xs text-slate-500" x-text="rateDescription(rate)"></td>
                      <td class="py-2 pl-3 text-right font-bold" x-text="money(rate.price)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="text-xs text-slate-500 mt-3" x-text="'Payment terms: ' + currentDealership.paymentTerms"></div>
          </div>

          <div class="card p-4 mb-4">
            <h3 class="font-bold mb-3">Notification preferences</h3>
            <div class="space-y-2 text-sm">
              <label class="flex items-center gap-2"><input type="checkbox" x-model="currentDealership.notificationPrefs.email" @change="persist()" />Email — every status change</label>
              <label class="flex items-center gap-2"><input type="checkbox" x-model="currentDealership.notificationPrefs.sms" @change="persist()" />SMS — only when "Ready for Pickup" or "Out for Delivery"</label>
              <label class="flex items-center gap-2"><input type="checkbox" x-model="currentDealership.notificationPrefs.inApp" @change="persist()" />In-app notifications (always on by default)</label>
            </div>
          </div>
          <div class="card p-4">
            <h3 class="font-bold mb-3">Contacts</h3>
            <div class="space-y-2">
              <template x-for="(c, i) in currentDealership.contacts" :key="i">
                <div class="grid grid-cols-3 gap-2">
                  <input class="input" placeholder="Name" x-model="c.name" />
                  <input class="input" placeholder="Email" x-model="c.email" />
                  <input class="input" placeholder="Phone" x-model="c.phone" />
                </div>
              </template>
              <button @click="currentDealership.contacts.push({name:'',email:'',phone:''}); persist()" class="btn btn-outline text-xs">+ Add contact</button>
            </div>
          </div>
        </div>
      </template>

    </div>
  </main>
</div>
</template>

<!-- ============================================ VEHICLE DRAWER ============================================ -->
<template x-if="activeVehicleId">
  <div class="fixed inset-0 z-40 flex" @keydown.escape.window="activeVehicleId=null">
    <div class="absolute inset-0 bg-slate-900/50" @click="activeVehicleId=null"></div>
    <div class="ml-auto bg-white w-full max-w-3xl h-full overflow-y-auto relative shadow-2xl">
      <template x-if="activeVehicle">
        <div>
          <div class="p-5 border-b border-slate-200 flex items-start gap-3">
            <div class="w-12 h-12 rounded-lg flex items-center justify-center text-white font-bold" :style="`background:${dealershipById(activeVehicle.dealershipId)?.brandColor}`">
              <span x-text="activeVehicle.make.slice(0,1)"></span>
            </div>
            <div class="flex-1">
              <div class="text-xs text-slate-500" x-text="dealershipById(activeVehicle.dealershipId)?.name + ' · Stock #' + activeVehicle.stockNumber"></div>
              <h2 class="text-xl font-black" x-text="activeVehicle.year + ' ' + activeVehicle.make + ' ' + activeVehicle.model"></h2>
              <div class="text-xs text-slate-500" x-text="activeVehicle.color + ' · ' + (activeVehicle.vin || 'No VIN') + ' · Plate ' + (activeVehicle.plate || '—')"></div>
              <div class="mt-2 flex items-center gap-2">
                <span class="status-chip" :style="`background:${statusMeta(activeVehicle.status).bg};color:${statusMeta(activeVehicle.status).fg}`">
                  <span class="dot" :style="`background:${statusMeta(activeVehicle.status).fg}`"></span>
                  <span x-text="statusMeta(activeVehicle.status).label"></span>
                </span>
                <span x-show="activeVehicle.priority!=='standard'" class="status-chip" :class="activeVehicle.priority==='rush'?'bg-amber-100 text-amber-800':'bg-rose-100 text-rose-800'" x-text="activeVehicle.priority.toUpperCase()"></span>
                <span class="text-xs text-slate-500" x-text="activeVehicle.deliveryMethod==='delivery' ? 'Delivery to dealer' : 'Customer pickup'"></span>
              </div>
            </div>
            <button @click="activeVehicleId=null" class="text-slate-400 hover:text-slate-700 text-2xl px-1">×</button>
          </div>

          <!-- Status actions (staff only) -->
          <template x-if="session.role==='staff'">
            <div class="p-5 border-b border-slate-200">
              <div class="text-xs uppercase font-bold tracking-wider text-slate-500 mb-2">Advance status</div>
              <div class="flex flex-wrap gap-2">
                <template x-for="s in STATUSES" :key="s.code">
                  <button @click="setStatus(activeVehicle.id, s.code)" class="btn text-xs"
                    :class="activeVehicle.status===s.code ? 'btn-primary' : 'btn-outline'">
                    <span class="dot" :style="`background:${s.fg}`"></span>
                    <span x-text="s.label"></span>
                  </button>
                </template>
              </div>
              <div class="mt-3 flex flex-wrap gap-2">
                <select class="select max-w-xs text-sm" x-model="activeVehicle.assignedDetailer" @change="persist()">
                  <option value="">Unassigned detailer</option>
                  <template x-for="d in detailers" :key="d.id"><option :value="d.id" x-text="d.name"></option></template>
                </select>
                <select class="select max-w-xs text-sm" x-model="activeVehicle.arrivalMethod" @change="persist()" title="How did the vehicle arrive at Wash Depot?">
                  <option value="">— Arrival method —</option>
                  <option value="dropoff">Dealer dropped off</option>
                  <option value="pickup">Wash Depot picked up</option>
                </select>
                <button @click="sendCustomUpdate(activeVehicle.id)" class="btn btn-outline text-sm">Send update</button>
                <button @click="generateInvoiceForVehicle(activeVehicle.id)" class="btn btn-outline text-sm" x-show="canSeePrices && !activeVehicle.invoiceId">Generate invoice</button>
                <button @click="openInvoice(activeVehicle.invoiceId)" class="btn btn-outline text-sm" x-show="canSeePrices && activeVehicle.invoiceId">View invoice</button>
              </div>
            </div>
          </template>

          <div class="grid md:grid-cols-2 gap-5 p-5">
            <!-- Services + total -->
            <div>
              <h4 class="font-bold mb-2 text-sm">Services</h4>
              <div class="space-y-1.5 text-sm">
                <template x-for="rateRow in vehicleServices(activeVehicle)" :key="rateRow.serviceId">
                  <div class="flex justify-between border-b border-slate-100 py-1">
                    <span x-text="rateRow.name"></span>
                    <span class="font-semibold" x-show="canSeePrices" x-text="money(rateRow.price)"></span>
                  </div>
                </template>
              </div>
              <div x-show="canSeePrices" class="mt-3 pt-3 border-t border-slate-200 flex justify-between font-bold">
                <span>Total</span><span x-text="money(vehicleTotal(activeVehicle))"></span>
              </div>
              <div class="mt-3 text-xs text-slate-500" x-show="activeVehicle.notes">
                <div class="font-semibold text-slate-700 mb-1">Notes</div>
                <div x-text="activeVehicle.notes"></div>
              </div>
            </div>

            <!-- Timeline -->
            <div>
              <h4 class="font-bold mb-2 text-sm">Timeline</h4>
              <div class="relative pl-7 timeline-line space-y-3">
                <template x-for="event in [...activeVehicle.statusHistory].reverse()" :key="event.at">
                  <div class="relative">
                    <div class="absolute -left-7 w-5 h-5 rounded-full border-2 border-white shadow" :style="`background:${statusMeta(event.status).fg}`"></div>
                    <div class="text-xs">
                      <div class="font-bold" x-text="statusMeta(event.status).label"></div>
                      <div class="text-slate-500" x-text="formatDate(event.at, 'long')"></div>
                      <div x-show="event.note" class="text-slate-600 italic" x-text="event.note"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>

<!-- ============================================ CUSTOMER DETAIL DRAWER ============================================ -->
<template x-if="activeCustomerId">
  <div class="fixed inset-0 z-40 flex" @keydown.escape.window="activeCustomerId=null">
    <div class="absolute inset-0 bg-slate-900/40 ab-drawer-backdrop" @click="activeCustomerId=null"></div>
    <div class="ab-drawer ml-auto bg-white w-full max-w-2xl h-full overflow-hidden relative shadow-2xl flex flex-col" x-data="{ noteText:'' }">
      <template x-if="activeCustomer">
        <div class="flex flex-col h-full">
          <!-- Header -->
          <div class="px-6 py-5 border-b border-slate-100 flex items-start gap-4 flex-shrink-0">
            <div class="w-14 h-14 rounded-full flex items-center justify-center text-white text-xl font-bold flex-shrink-0"
                 :style="`background:${customerTier(activeCustomer)==='new'?'#06b6d4':customerTier(activeCustomer)==='vip'?'#db2777':customerTier(activeCustomer)==='gold'?'#a855f7':customerTier(activeCustomer)==='member'?'#65a30d':customerTier(activeCustomer)==='silver'?'#3b82f6':'#f59e0b'}`"
                 x-text="(activeCustomer.firstName?.[0]||'?') + (activeCustomer.lastName?.[0]||'')"></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <h2 class="text-xl font-black" x-text="customerName(activeCustomer)"></h2>
                <span class="tier-badge" :class="customerTier(activeCustomer)" x-text="tierLabel(customerTier(activeCustomer))"></span>
              </div>
              <div class="flex flex-wrap gap-1 mt-2">
                <template x-for="tag in (activeCustomer.tags || [])" :key="tag">
                  <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 font-bold cursor-pointer hover:bg-rose-100 hover:text-rose-700" @click="toggleTag(activeCustomer.id, tag)" x-text="tag"></span>
                </template>
              </div>
            </div>
            <button @click="activeCustomerId=null" class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-900 text-xl">×</button>
          </div>

          <div class="flex-1 overflow-y-auto">
            <!-- Stats strip -->
            <div class="grid grid-cols-4 gap-3 px-6 py-4 bg-slate-50 border-b border-slate-100">
              <div><div class="text-[10px] uppercase font-bold text-slate-500">Visits</div><div class="text-xl font-black" x-text="activeCustomer.visitCount"></div></div>
              <div x-show="canSeePrices"><div class="text-[10px] uppercase font-bold text-slate-500">Total spend</div><div class="text-xl font-black" x-text="money(activeCustomer.totalSpend)"></div></div>
              <div x-show="canSeePrices"><div class="text-[10px] uppercase font-bold text-slate-500">Avg ticket</div><div class="text-xl font-black" x-text="money(activeCustomer.visitCount ? activeCustomer.totalSpend/activeCustomer.visitCount : 0)"></div></div>
              <div><div class="text-[10px] uppercase font-bold text-slate-500">Member</div><div class="text-xl font-black" x-text="activeCustomer.membership ? '' : '—'"></div></div>
            </div>

            <!-- Contact info -->
            <div class="px-6 py-5 border-b border-slate-100">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Contact</h3>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="ab-label">First name</label><input class="ab-input" x-model="activeCustomer.firstName" @change="persist()" /></div>
                <div><label class="ab-label">Last name</label><input class="ab-input" x-model="activeCustomer.lastName" @change="persist()" /></div>
                <div><label class="ab-label">Email</label><input class="ab-input" x-model="activeCustomer.email" @change="persist()" /></div>
                <div><label class="ab-label">Phone</label><input class="ab-input" x-model="activeCustomer.phone" @change="persist()" /></div>
              </div>
            </div>

            <!-- Vehicle -->
            <div class="px-6 py-5 border-b border-slate-100">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Vehicle</h3>
              <!-- Vehicle summary (moved out of the title) -->
              <div class="mb-3">
                <div class="font-black text-base leading-tight" x-text="[activeCustomer.vehicleYear, activeCustomer.vehicleMake, activeCustomer.vehicleModel].filter(Boolean).join(' ') || 'Vehicle on file'"></div>
                <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5">
                  <span class="w-3.5 h-3.5 rounded-full border border-slate-300 inline-block flex-shrink-0" :style="`background:${vehicleColorHex(activeCustomer.vehicleColor)}`"></span>
                  <span x-text="activeCustomer.vehicleColor || '—'"></span>
                  <span>·</span>
                  <span class="font-mono font-bold text-slate-700" x-text="activeCustomer.plate || '—'"></span>
                </div>
              </div>
              <!-- Vehicle details -->
              <div class="grid grid-cols-2 gap-3 mb-4">
                <div><label class="ab-label">Year</label><input class="ab-input" x-model="activeCustomer.vehicleYear" @change="persist()" placeholder="—" /></div>
                <div><label class="ab-label">Make</label><input class="ab-input" x-model="activeCustomer.vehicleMake" @change="persist()" /></div>
                <div><label class="ab-label">Model</label><input class="ab-input" x-model="activeCustomer.vehicleModel" @change="persist()" /></div>
                <div>
                  <label class="ab-label">Color</label>
                  <div class="flex items-center gap-2">
                    <span class="w-5 h-5 rounded-full border border-slate-300 flex-shrink-0" :style="`background:${vehicleColorHex(activeCustomer.vehicleColor)}`"></span>
                    <input class="ab-input flex-1" x-model="activeCustomer.vehicleColor" @change="persist()" />
                  </div>
                </div>
                <div class="col-span-2"><label class="ab-label">License plate</label><input class="ab-input font-mono" x-model="activeCustomer.plate" @change="persist()" /></div>
              </div>
              <!-- LPR intake capture -->
              <div class="lpr-capture">
                <template x-if="activeCustomer.photoUrl">
                  <img :src="activeCustomer.photoUrl" class="lpr-photo" alt="Vehicle intake capture" />
                </template>
                <template x-if="!activeCustomer.photoUrl">
                  <div class="lpr-illus" :style="`--car:${vehicleColorHex(activeCustomer.vehicleColor)}`">
                    <svg viewBox="0 0 220 96" class="lpr-car" preserveAspectRatio="xMidYMid meet">
                      <ellipse cx="110" cy="87" rx="90" ry="6" fill="rgba(0,0,0,0.35)"/>
                      <path d="M18 66 Q16 52 30 50 L60 49 Q70 33 92 31 L132 31 Q150 32 162 50 L188 54 Q202 56 202 66 L202 72 Q202 76 196 76 L24 76 Q18 76 18 72 Z" fill="var(--car)"/>
                      <path d="M64 49 Q73 35 92 33 L130 33 Q148 34 158 49 Z" fill="rgba(255,255,255,0.14)"/>
                      <path d="M70 47 Q78 37 92 36 L107 36 L107 47 Z" fill="#0f172a" opacity="0.82"/>
                      <path d="M113 36 L128 36 Q143 37 151 47 L113 47 Z" fill="#0f172a" opacity="0.82"/>
                      <line x1="110" y1="48" x2="110" y2="72" stroke="rgba(0,0,0,0.18)" stroke-width="1.5"/>
                      <circle cx="195" cy="61" r="3.4" fill="#fde68a"/>
                      <circle cx="62" cy="76" r="14" fill="#111827"/><circle cx="62" cy="76" r="6" fill="#374151"/>
                      <circle cx="158" cy="76" r="14" fill="#111827"/><circle cx="158" cy="76" r="6" fill="#374151"/>
                    </svg>
                  </div>
                </template>
                <span class="vf vf-tl"></span><span class="vf vf-tr"></span><span class="vf vf-bl"></span><span class="vf vf-br"></span>
                <div class="lpr-top"><span class="lpr-dot"></span> LPR Capture <span class="lpr-time" x-show="activeCustomer.firstSeenAt" x-text="'· intake ' + formatDate(activeCustomer.firstSeenAt, 'long')"></span></div>
                <div class="lpr-plate" x-text="activeCustomer.plate || '—'"></div>
              </div>
            </div>

            <!-- Upsell suggestion -->
            <div class="px-6 py-4 bg-amber-50 border-b border-amber-100">
              <div class="text-xs font-bold text-amber-800 uppercase tracking-wider mb-1">Suggested play</div>
              <div class="text-sm text-amber-900" x-text="suggestUpsell(activeCustomer)"></div>
            </div>

            <!-- Notes -->
            <div class="px-6 py-5 border-b border-slate-100">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Notes</h3>
              <div class="flex gap-2 mb-3">
                <input class="ab-input flex-1" x-model="noteText" placeholder="Add a note (high tipper, prefers contactless, requests Carlos…)" @keydown.enter="addCustomerNote(activeCustomer.id, noteText); noteText=''" />
                <button @click="addCustomerNote(activeCustomer.id, noteText); noteText=''" class="ab-btn ab-btn-primary">Add</button>
              </div>
              <div class="space-y-2 text-sm">
                <template x-for="(n, i) in (activeCustomer.notes || [])" :key="i">
                  <div class="bg-slate-50 rounded-lg p-3">
                    <div class="text-xs text-slate-500 mb-1" x-text="(n.by || 'Staff') + ' · ' + relativeTime(n.at)"></div>
                    <div x-text="n.text"></div>
                  </div>
                </template>
                <div x-show="!activeCustomer.notes?.length" class="text-xs text-slate-400 italic">No notes yet.</div>
              </div>
            </div>

            <!-- Visit history -->
            <div class="px-6 py-5">
              <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Visit history (<span x-text="activeCustomerVisits.length"></span>)</h3>
              <div class="space-y-1 text-sm max-h-72 overflow-y-auto">
                <template x-for="v in activeCustomerVisits" :key="v.id">
                  <div class="flex items-center justify-between py-2 border-b border-slate-100">
                    <div>
                      <div class="font-semibold" x-text="washPackageById(v.packageId)?.name || 'Wash'"></div>
                      <div class="text-xs text-slate-500" x-text="formatDate(v.at, 'long')"></div>
                    </div>
                    <div class="text-sm font-bold" x-show="canSeePrices" x-text="v.amount >0 ? money(v.amount) : 'Member'"></div>
                  </div>
                </template>
                <div x-show="!activeCustomerVisits.length" class="text-xs text-slate-400 italic">No visits recorded yet.</div>
              </div>
            </div>
          </div>

          <!-- Footer actions -->
          <div class="px-6 py-3 border-t border-slate-100 flex items-center justify-between flex-shrink-0 bg-white">
            <button @click="if(confirm('Delete this customer? This will not delete their visit history.')){ customers = customers.filter(c=>c.id!==activeCustomer.id); activeCustomerId=null; persist(); toast('Customer removed'); }" class="ab-btn ab-btn-danger">Delete</button>
            <div class="flex gap-2 ml-auto">
              <button @click="openGiftModal(activeCustomer.id)" class="ab-btn ab-btn-ghost">Send gift</button>
              <button @click="activeCustomerId=null" class="ab-btn ab-btn-primary">Done</button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>

              </div>
            </template>
            <button type="button" @click="dealershipDrawer.contacts.push({name:'',email:'',phone:''})" class="text-sm font-semibold text-slate-900 underline hover:no-underline">+ Add another contact</button>

        </div>

        <!-- Billing -->
        <div class="ab-section" x-show="canSeePrices">
          <h3>Billing</h3>

            <label class="ab-label">Payment terms</label>

              <option>Net 7</option>
              <option>Net 15</option>
              <option>Net 30</option>
              <option>Net 45</option>
            </select>
            <p class="text-xs text-slate-500 mt-2" x-show="dealershipDrawer.id">To configure rates and line items, use the <button type="button" @click="settingsTab='pricing'; pricingExpanded[dealershipDrawer.id]=true; dealershipDrawer=null;" class="text-slate-900 font-semibold underline">Pricing tab →</button></p>

          </div>
        </div>

        <!-- Notifications -->
        <div class="ab-section">
          <h3>Notification channels</h3>
          <p class="text-sm text-slate-500 mb-2 -mt-3">How this dealership gets status updates from Wash Depot.</p>

          <div class="ab-toggle">
            <div class="flex-1">
              <div class="ab-toggle-title">Email</div>
              <div class="ab-toggle-sub">Status updates and invoice notifications</div>
            </div>
            <div class="ab-switch" :class="dealershipDrawer.notificationPrefs.email && 'on'" @click="dealershipDrawer.notificationPrefs.email = !dealershipDrawer.notificationPrefs.email"></div>
          </div>
          <div class="ab-toggle">
            <div class="flex-1">
              <div class="ab-toggle-title">SMS</div>
              <div class="ab-toggle-sub">Texts for ready &amp; completed only</div>
            </div>
            <div class="ab-switch" :class="dealershipDrawer.notificationPrefs.sms && 'on'" @click="dealershipDrawer.notificationPrefs.sms = !dealershipDrawer.notificationPrefs.sms"></div>
          </div>
          <div class="ab-toggle">
            <div class="flex-1">
              <div class="ab-toggle-title">In-app</div>
              <div class="ab-toggle-sub">Always visible in the dealer portal</div>
            </div>
            <div class="ab-switch" :class="dealershipDrawer.notificationPrefs.inApp && 'on'" @click="dealershipDrawer.notificationPrefs.inApp = !dealershipDrawer.notificationPrefs.inApp"></div>
          </div>
        </div>

      </div>

      <!-- Sticky footer -->
      <div class="px-8 py-4 border-t border-slate-100 flex items-center justify-between flex-shrink-0 bg-white">
        <button x-show="dealershipDrawer.id" type="button" @click="if(confirm('Delete this dealership? This cannot be undone.')){ dealerships = dealerships.filter(d=>d.id!==dealershipDrawer.id); dealershipDrawer=null; persist(); toast('Dealership deleted'); }" class="ab-btn ab-btn-danger">Delete</button>
        <div class="flex items-center gap-2 ml-auto">
          <button type="button" @click="dealershipDrawer=null" class="ab-btn ab-btn-ghost">Cancel</button>
          <button type="button" @click="saveDealership()" class="ab-btn ab-btn-primary" x-text="dealershipDrawer.id ? 'Save changes' : 'Add dealership'"></button>
        </div>
      </div>

    </div>
  </div>
</template>

<!-- ============================================ PAY INVOICE MODAL (DEALER) ============================================ -->
<template x-if="payModal.open">
  <div class="fixed inset-0 z-50 flex items-center justify-center p-6" @keydown.escape.window="payModal.open=false">
    <div class="absolute inset-0 bg-slate-900/60" @click="payModal.open=false"></div>
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full relative">
      <div class="p-5 border-b border-slate-200 flex items-center">
        <div class="flex-1">
          <h3 class="font-black">Pay invoice</h3>
          <p class="text-xs text-slate-500" x-show="payModalInvoice" x-text="payModalInvoice && (payModalInvoice.number + ' · ' + money(payModalInvoice.total))"></p>
        </div>
        <button @click="payModal.open=false" class="text-slate-400 hover:text-slate-700 text-2xl">×</button>
      </div>

      <!-- Step 1: Choose method -->
      <div x-show="payModal.step==='choose'" class="p-5 space-y-3">
        <p class="text-sm text-slate-600 mb-2">Choose your payment method:</p>

        <button @click="payModal.method='ach'; payModal.step='ach'" class="w-full text-left p-4 rounded-lg border border-slate-200 hover:border-teal-500 hover:bg-teal-50/30 flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center text-xl"></div>
          <div class="flex-1">
            <div class="font-bold text-sm">ACH bank transfer</div>
            <div class="text-xs text-slate-500">Direct from your bank account · 1-3 business days</div>
          </div>
          <span class="text-slate-400">→</span>
        </button>

        <button @click="payModal.method='zelle'; payModal.step='zelle'" class="w-full text-left p-4 rounded-lg border border-slate-200 hover:border-teal-500 hover:bg-teal-50/30 flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-700 flex items-center justify-center text-xl"></div>
          <div class="flex-1">
            <div class="font-bold text-sm">Zelle</div>
            <div class="text-xs text-slate-500">Instant transfer from your bank's app · No fees</div>
          </div>
          <span class="text-slate-400">→</span>
        </button>

        <button @click="payModal.method='check'; payModal.step='check'" class="w-full text-left p-4 rounded-lg border border-slate-200 hover:border-teal-500 hover:bg-teal-50/30 flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center text-xl"></div>
          <div class="flex-1">
            <div class="font-bold text-sm">Mail in a check</div>
            <div class="text-xs text-slate-500">Notify Wash Depot you're sending a paper check</div>
          </div>
          <span class="text-slate-400">→</span>
        </button>
      </div>

      <!-- ACH instructions -->
      <div x-show="payModal.step==='ach'" class="p-5">
        <button @click="payModal.step='choose'" class="text-xs text-teal-700 hover:underline mb-3">← Back</button>
        <h4 class="font-bold mb-3">ACH bank transfer</h4>
        <div class="bg-slate-50 rounded-lg p-4 text-sm space-y-1 mb-4">
          <div class="flex justify-between"><span class="text-slate-500">Bank</span><span class="font-mono">First National Bank</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Account name</span><span class="font-mono">Wash Depot LLC</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Routing #</span><span class="font-mono">021000089</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Account #</span><span class="font-mono">••••4172</span></div>
          <div class="flex justify-between border-t border-slate-200 pt-1 mt-1"><span class="text-slate-500">Memo / reference</span><span class="font-mono font-bold" x-text="payModalInvoice?.number"></span></div>
        </div>
        <p class="text-xs text-slate-500 mb-3">After you initiate the transfer, click below to confirm. We'll mark this invoice as pending and confirm receipt within 1-3 business days.</p>
        <div class="flex justify-end gap-2">
          <button @click="payModal.open=false" class="btn btn-outline">Cancel</button>
          <button @click="confirmPayment('ach')" class="btn btn-primary">I've sent the ACH</button>
        </div>
      </div>

      <!-- Zelle instructions -->
      <div x-show="payModal.step==='zelle'" class="p-5">
        <button @click="payModal.step='choose'" class="text-xs text-teal-700 hover:underline mb-3">← Back</button>
        <h4 class="font-bold mb-3">Zelle payment</h4>
        <div class="bg-slate-50 rounded-lg p-4 text-sm space-y-1 mb-4">
          <div class="flex justify-between"><span class="text-slate-500">Send to (email)</span><span class="font-mono">payments@washdepot.com</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Or phone</span><span class="font-mono">(555) 999-WASH</span></div>
          <div class="flex justify-between border-t border-slate-200 pt-1 mt-1"><span class="text-slate-500">Amount</span><span class="font-bold" x-text="money(payModalInvoice?.total || 0)"></span></div>
          <div class="flex justify-between"><span class="text-slate-500">Memo</span><span class="font-mono font-bold" x-text="payModalInvoice?.number"></span></div>
        </div>
        <p class="text-xs text-slate-500 mb-3">Send the Zelle from your bank's app, then confirm here. Zelle payments typically arrive instantly.</p>
        <div class="flex justify-end gap-2">
          <button @click="payModal.open=false" class="btn btn-outline">Cancel</button>
          <button @click="confirmPayment('zelle')" class="btn btn-primary">I've sent the Zelle</button>
        </div>
      </div>

      <!-- Mail check -->
      <div x-show="payModal.step==='check'" class="p-5">
        <button @click="payModal.step='choose'" class="text-xs text-teal-700 hover:underline mb-3">← Back</button>
        <h4 class="font-bold mb-3">Mail a paper check</h4>
        <div class="bg-slate-50 rounded-lg p-4 text-sm mb-4">
          <div class="text-xs uppercase tracking-wider text-slate-500 mb-1">Mail to</div>
          <div class="font-semibold">Wash Depot LLC</div>
          <div class="text-slate-700">Attn: Accounts Receivable</div>
          <div class="text-slate-700">2400 Industrial Way</div>
          <div class="text-slate-700">Suite 12</div>
          <div class="text-slate-700">Northshore, IL 60201</div>
          <div class="border-t border-slate-200 pt-2 mt-2 text-xs flex justify-between"><span class="text-slate-500">Make payable to</span><span class="font-semibold">Wash Depot LLC</span></div>
          <div class="text-xs flex justify-between"><span class="text-slate-500">Memo</span><span class="font-mono font-bold" x-text="payModalInvoice?.number"></span></div>
        </div>
        <label class="block mb-3 text-sm">
          <span class="label">Optional: tracking #, check #, or note</span>
          <input class="input" x-model="payModal.note" placeholder="e.g. Check #2034, dropped at post office today" />
        </label>
        <p class="text-xs text-slate-500 mb-3">Confirming below notifies Wash Depot that a check is in the mail. Your invoice will show as "Check mailed — awaiting receipt" until they confirm.</p>
        <div class="flex justify-end gap-2">
          <button @click="payModal.open=false" class="btn btn-outline">Cancel</button>
          <button @click="confirmPayment('check')" class="btn btn-primary">Confirm — check is in the mail</button>
        </div>
      </div>

      <!-- Confirmation step -->
      <div x-show="payModal.step==='done'" class="p-8 text-center">
        <div class="w-16 h-16 mx-auto rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-3xl mb-3"></div>
        <h4 class="font-black text-lg" x-text="payModal.method==='check' ? 'Check confirmation received' : 'Payment notification sent'"></h4>
        <p class="text-sm text-slate-600 mt-2 mb-5" x-text="payModal.method==='check' ? 'Wash Depot has been notified that your check is on the way. Once they receive and deposit it, your invoice will be marked paid.' : 'Wash Depot has been notified of your ' + paymentMethodLabel(payModal.method) + ' payment. They will confirm receipt and update this invoice shortly.'"></p>
        <button @click="payModal.open=false" class="btn btn-primary">Done</button>
      </div>
    </div>
  </div>
</template>

<!-- ============================================ COMPOSE NOTIFICATION MODAL ============================================ -->

<script>
function app() {
  return {
    /* ========= core state ========= */
    session: null,
    clerkPendingAccess: false,
    view: 'dashboard',
    navOpen: { overview: true, detailing: true, washretail: true, other: false },
    now: new Date(),
    toasts: [],
    commandOpen: false,
    commandQuery: '',
    activeVehicleId: null,

    activeInvoiceId: null,
    composeOpen: false,

    vehicleStatusFilter: '',
    settingsTab: 'pricing',
    pricingExpanded: {},
    payModal: { open:false, invoiceId:null, step:'choose', method:null, note:'' },
    squareModal: false,

    inviteSending: false,
    activeUsers: [],

    services: [],
    dealerships: [],
    detailers: [],
    vehicles: [],
    invoices: [],
    notifications: [],
    washPackages: [],
    washSales: [],
    retailProducts: [],
    retailSales: [],
    squareConfig: { connected: false, locationName:'', lastSyncAt: null, accessTokenMasked:'' },
    customers: [],
    visits: [],
    liveLane: [],
    cameraConfig: { connected:false, name:'', lastDetectionAt:null },
    activeCustomerId: null,
    customerSearch: '',
    customerTierFilter: '',
    autoScan: false,
    autoScanTimer: null,
    giftModal: { open:false, customerId:null, plate:'', email:'', phone:'', promoId:'promo_5off', channel:'email', message:'' },
    promotions: [
      { id:'promo_5off', name:'$5 off any wash', description:'Apply at next visit', code:'WD5', value:5, type:'amount', expiresInDays:30 },
      { id:'promo_upgrade', name:'Free Premium upgrade', description:'Upgrade Express → Premium free', code:'UPGRADE', value:6, type:'upgrade', expiresInDays:30 },
      { id:'promo_20pct', name:'20% off any detail', description:'One-time use on a detail', code:'DETAIL20',value:20, type:'percent', expiresInDays:60 },
      { id:'promo_buy2', name:'Buy 2 washes, get 1 free', description:'On Premium or Ultimate', code:'B2G1', value:0, type:'punch', expiresInDays:90 },
      { id:'promo_member', name:'1 month Unlimited free', description:'Free month of membership', code:'TRYUNL', value:35, type:'membership',expiresInDays:14 },
      { id:'promo_birthday', name:'Birthday wash on us', description:'Free Premium during birthday month', code:'BDAY',value:18, type:'comp', expiresInDays:31 }
    ],
    customerApp: { tab:'home', alertEnabled:false, alertThreshold:3, alertChannel:'sms', selectedCustomerId:null },
    newCustomerDrawer: null,
    booking: { dealershipId:'', year:'', make:'', model:'', color:'', stockNumber:'', vin:'', services:[], date:'', timeSlot:'morning', deliveryMethod:'pickup', notes:'' },
    bookingsFilter: { dealershipId:'', confirm:'all', logistics:'all', timeSlot:'all', priority:'all', date:'all', search:'' },
    reportPeriod: 'thisMonth',
    reportStream: 'all',
    reportCompare: true,
    reportCustomStart: '',
    reportCustomEnd: '',
    retailTab: 'overview', // overview | catalog | receive
    productDrawer: null,
    receiveBatch: [], // [{ productId, qty, sku }]
    receiveSkuInput: '',
    receiveQuickMode: true, // true = each scan +1; false = prompt for qty
    retailReceivings: [], // history of receipts

    intake: {},
    compose: { dealershipId:'', subject:'', body:'', email:true, sms:false, inApp:true },
    newInvoice: { dealershipId:'', vehicleIds: [] },

    STATUSES: [
      { code:'scheduled', label:'Scheduled', bg:'#e2e8f0', fg:'#475569' },
      { code:'dropped', label:'Pickup/Drop Off', bg:'#dbeafe', fg:'#1d4ed8' },
      { code:'queue', label:'In Queue', bg:'#fef3c7', fg:'#b45309' },
      { code:'service', label:'In Service', bg:'#fce7f3', fg:'#9f1239' },
      { code:'qc', label:'Quality Check', bg:'#ede9fe', fg:'#6d28d9' },
      { code:'ready', label:'Ready', bg:'#ccfbf1', fg:'#0f766e' },
      { code:'completed', label:'Completed', bg:'#dcfce7', fg:'#166534' }
    ],

    /* ========= init ========= */
    async init() {
      window.addEventListener('keydown', (e)=>{
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); this.commandOpen=true; this.$nextTick(()=>this.$refs.cmdInput?.focus()); }
      });
      setInterval(()=>{ this.now = new Date(); }, 30000);
      await this.load();
      this.resetIntake();
      // Auto-login if we have a Clerk identity injected by the server
      if (typeof window !== 'undefined' && window.__CLERK_USER__) {
        this.autoLoginFromClerk(window.__CLERK_USER__);
      }
      // Auto-open the sidebar section that contains the active view
      this.$watch('view', (v) =>{
        const s = this.viewToSection(v);
        if (s && this.navOpen && !this.navOpen[s]) this.navOpen[s] = true;
      });
    },
    autoLoginFromClerk(u) {
      if (!u) return;
      if (u.role === 'owner') {
        this.login({ role:'staff', staffRole:'owner', name: u.name || u.email, email: u.email, clerk: true });
        return;
      }
      if (u.role === 'fleet') {
        this.login({ role:'staff', staffRole:'fleet', name: u.name || u.email, email: u.email, clerk: true });
        return;
      }
      if (u.role === 'dealer' && u.dealershipId) {
        const d = this.dealershipById(u.dealershipId);
        if (d) {
          this.login({ role:'dealer', dealershipId: u.dealershipId, name: u.name || u.email, email: u.email, clerk: true });
          return;
        }
      }
      // No valid role assigned — show pending access message instead of demo picker
      this.clerkPendingAccess = true;
    },

    /* ========= persistence ========= */
    applyState(data) {
      this.services = data.services || [];
      this.dealerships = data.dealerships || [];
      this.detailers = data.detailers || [];
      this.vehicles = data.vehicles || [];
      this.invoices = data.invoices || [];
      this.notifications = data.notifications || [];
      this.washPackages = data.washPackages || [];
      this.washSales = data.washSales || [];
      this.retailProducts= data.retailProducts|| [];
      this.retailSales = data.retailSales || [];
      this.squareConfig = data.squareConfig || { connected:false, locationName:'', lastSyncAt:null, accessTokenMasked:'' };
      this.customers = data.customers || [];
      this.visits = data.visits || [];
      this.liveLane = data.liveLane || [];
      this.cameraConfig = data.cameraConfig || { connected:false, name:'', lastDetectionAt:null };
      this.retailReceivings = data.retailReceivings || [];
    },
    async load() {
      // 1. Try Supabase first (server-side via /api/state)
      let cloudData = null;
      try {
        const res = await fetch('/api/state', { credentials:'include' });
        if (res.ok) {
          const json = await res.json();
          if (json.configured && json.state && Object.keys(json.state).length) {
            cloudData = json.state;
          }
        }
      } catch (e) { /* offline or not signed in — fall back */ }

      if (cloudData) {
        this.applyState(cloudData);
        // Mirror to localStorage so subsequent reads are instant
        localStorage.setItem('washdepot_v1', JSON.stringify(cloudData));
        // Migration: seed wash/retail and CRM if missing. Also backfill sales —
        // older cached states have packages/products but empty washSales/retailSales,
        // which left dashboards + revenue showing $0. Regenerate sales when missing.
        let migrated = false;
        if (!this.washPackages.length || !this.retailProducts.length || !(this.washSales||[]).length || !(this.retailSales||[]).length) { this.seedWashAndRetail(); migrated = true; }
        if (!this.customers.length) { this.seedCRM(); migrated = true; }
        if (migrated) this.persist();
        return;
      }

      // 2. Fallback to localStorage cache
      try {
        const raw = localStorage.getItem('washdepot_v1');
        if (raw) {
          const data = JSON.parse(raw);
          this.applyState(data);
          if (!this.washPackages.length || !this.retailProducts.length || !(this.washSales||[]).length || !(this.retailSales||[]).length) this.seedWashAndRetail();
          if (!this.customers.length) this.seedCRM();
          // migration: ensure each retail product has SKU, cost, etc.
          this.retailProducts.forEach((p, i) =>{
            if (!p.sku) p.sku = String(100000000000 + Math.floor(Math.random()*900000000000));
            if (typeof p.cost !== 'number') p.cost = +(p.price * 0.4).toFixed(2);
            if (typeof p.reorderPoint !== 'number') p.reorderPoint = Math.max(8, Math.floor((p.stock||0) * 0.4));
            if (!p.description) p.description = '';
            if (!p.supplier) p.supplier = '';
          });
          // migration: ensure each service has a standard price
          const defaults = { svc_exp:25, svc_full:165, svc_int:110, svc_pol:200, svc_eng:75, svc_lot:65, svc_odor:140, svc_head:90 };
          this.services.forEach(s=>{
            if (typeof s.price !== 'number') {
              const fromRate = this.dealerships.flatMap(d=>d.rateSheet||[]).find(r=>r.serviceId===s.id);
              s.price = defaults[s.id] ?? fromRate?.price ?? 50;
            }
          });
          // migration: assign detailers to vehicles that don't have one
          if (this.detailers.length) {
            const detIds = this.detailers.map(d=>d.id);
            this.vehicles.forEach((v, i)=>{
              if (!v.assignedDetailer) v.assignedDetailer = detIds[i % detIds.length];
            });
          }
          this.persist();
          return;
        }
      } catch(e){ console.warn('load failed', e); }
      this.seed();
    },
    persist() {
      const data = {
        services: this.services, dealerships: this.dealerships, detailers: this.detailers,
        vehicles: this.vehicles, invoices: this.invoices, notifications: this.notifications,
        washPackages: this.washPackages, washSales: this.washSales,
        retailProducts: this.retailProducts, retailSales: this.retailSales,
        squareConfig: this.squareConfig,
        customers: this.customers, visits: this.visits, liveLane: this.liveLane,
        cameraConfig: this.cameraConfig,
        retailReceivings: this.retailReceivings
      };
      // Instant local cache
      localStorage.setItem('washdepot_v1', JSON.stringify(data));
      // Debounced cloud sync (only if signed in via Clerk)
      if (typeof window !== 'undefined' && window.__CLERK_USER__) {
        clearTimeout(this._syncTimer);
        this._syncTimer = setTimeout(()=>{
          fetch('/api/state', {
            method:'POST', credentials:'include',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ state: data })
          }).then(r =>{
            if (!r.ok && r.status !== 503) console.warn('Cloud sync failed:', r.status);
          }).catch(e =>console.warn('Cloud sync error:', e));
        }, 600);
      }
    },
    resetAll() { localStorage.removeItem('washdepot_v1'); this.seed(); this.persist(); this.toast('Reset complete'); },

    /* ========= seed demo data ========= */
    seed() {
      const id = (p)=>p + '_' + Math.random().toString(36).slice(2,9);
      const services = [
        { id:'svc_exp', name:'Express Wash', description:'Exterior wash, vacuum, windows', price: 25 },
        { id:'svc_full', name:'Full Detail', description:'Hand wash, clay bar, interior shampoo', price: 165 },
        { id:'svc_int', name:'Interior Detail', description:'Vacuum, shampoo, leather conditioning', price: 110 },
        { id:'svc_pol', name:'Hand Polish & Wax', description:'Paint correction lite + sealant', price: 200 },
        { id:'svc_eng', name:'Engine Bay Detail', description:'Degrease, dress, protect', price: 75 },
        { id:'svc_lot', name:'Lot Prep', description:'New-arrival prep for showroom', price: 65 },
        { id:'svc_odor', name:'Odor Treatment', description:'Ozone + enzyme deep clean', price: 140 },
        { id:'svc_head', name:'Headlight Restoration',description:'UV haze removal + clear coat', price: 90 }
      ];
      this.services = services;

      this.detailers = [
        { id:'det_1', name:'Carlos R.' },
        { id:'det_2', name:'Devon W.' },
        { id:'det_3', name:'Aliyah K.' },
        { id:'det_4', name:'Tyrell M.' }
      ];

      const mkRate = (overrides={}) =>services.map(s=>({ serviceId: s.id, price: overrides[s.id] ?? defaultPrice(s.id) }));
      function defaultPrice(sid){ return ({svc_exp:18, svc_full:140, svc_int:90, svc_pol:175, svc_eng:60, svc_lot:55, svc_odor:120, svc_head:75})[sid]||50; }

      this.dealerships = [
        {
          id:'d_north', name:'Northshore Auto Group', brandColor:'#1e3a8a', address:'1820 Lakefront Ave, Northshore',
          paymentTerms:'Net 15',
          contacts:[ {name:'Tina Alvarez', email:'tina@northshore-auto.com', phone:'(555) 201-3344'}, {name:'Brian Park', email:'brian@northshore-auto.com', phone:'(555) 201-3345'} ],
          rateSheet: mkRate({ svc_lot: 45, svc_full: 130 }),
          notificationPrefs:{ email:true, sms:true, inApp:true }
        },
        {
          id:'d_apex', name:'Apex Motors', brandColor:'#b91c1c', address:'77 Industrial Pkwy',
          paymentTerms:'Net 30',
          contacts:[ {name:'Jordan Lee', email:'jordan@apexmotors.com', phone:'(555) 412-7700'} ],
          rateSheet: mkRate({ svc_full: 150, svc_pol: 195, svc_lot: 60 }),
          notificationPrefs:{ email:true, sms:false, inApp:true }
        },
        {
          id:'d_grand', name:'Grand Avenue Used Cars', brandColor:'#16a34a', address:'4400 Grand Ave',
          paymentTerms:'Due on receipt',
          contacts:[ {name:'Mike Chen', email:'mike@grand-ave.com', phone:'(555) 998-1010'} ],
          rateSheet: mkRate({ svc_exp: 15, svc_full: 120, svc_lot: 50 }),
          notificationPrefs:{ email:true, sms:true, inApp:true }
        },
        {
          id:'d_summit', name:'Summit BMW & Audi', brandColor:'#0f172a', address:'12 Summit Crossing',
          paymentTerms:'Net 30',
          contacts:[ {name:'Renee Diallo', email:'renee@summitlux.com', phone:'(555) 202-4000'} ],
          rateSheet: mkRate({ svc_full: 175, svc_pol: 225, svc_int: 110, svc_lot: 80 }),
          notificationPrefs:{ email:true, sms:true, inApp:true }
        }
      ];

      // Vehicles spread across statuses, dealerships, and time
      const now = Date.now();
      const v = (overrides) =>({
        id: id('veh'),
        statusHistory: [{ status: overrides.status, at: overrides.dropOffTime, note:'Checked in' }],
        priority:'standard', deliveryMethod:'pickup', notes:'',
        ...overrides
      });
      const vehicleSeed = [
        // Active jobs
        v({ dealershipId:'d_north', year:2023, make:'Toyota', model:'RAV4', color:'Pearl White', stockNumber:'NS-1402', vin:'JTMRWRFV5LD557831', services:['svc_lot','svc_int'], status:'service', dropOffTime: now - 2*3600*1000, promisedTime: now + 3*3600*1000, notes:'Pet hair on rear seats — needs odor pass too' }),
        v({ dealershipId:'d_north', year:2024, make:'Honda', model:'CR-V', color:'Crystal Black', stockNumber:'NS-1407', services:['svc_lot'], status:'queue', dropOffTime: now - 50*60*1000, promisedTime: now + 4*3600*1000 }),
        v({ dealershipId:'d_apex', year:2022, make:'Ford', model:'F-150', color:'Velocity Blue', stockNumber:'AP-9921', services:['svc_full','svc_eng'], status:'qc', dropOffTime: now - 4*3600*1000, promisedTime: now + 1*3600*1000, priority:'rush' }),
        v({ dealershipId:'d_apex', year:2021, make:'Chevy', model:'Tahoe', color:'Onyx Black', stockNumber:'AP-9930', services:['svc_full'], status:'dropped', dropOffTime: now - 20*60*1000, promisedTime: now + 6*3600*1000 }),
        v({ dealershipId:'d_grand', year:2019, make:'Nissan', model:'Altima', color:'Gun Metal', stockNumber:'GA-552', services:['svc_exp','svc_lot'], status:'ready', dropOffTime: now - 5*3600*1000, promisedTime: now - 30*60*1000, deliveryMethod:'delivery' }),
        v({ dealershipId:'d_grand', year:2020, make:'Hyundai', model:'Sonata', color:'Quartz White', stockNumber:'GA-560', services:['svc_full','svc_head'], status:'service', dropOffTime: now - 3*3600*1000, promisedTime: now + 90*60*1000 }),
        v({ dealershipId:'d_summit',year:2024, make:'BMW', model:'X5', color:'Mineral White', stockNumber:'SM-2010', services:['svc_full','svc_pol'], status:'service', dropOffTime: now - 75*60*1000, promisedTime: now + 4*3600*1000, priority:'vip', deliveryMethod:'delivery' }),
        v({ dealershipId:'d_summit',year:2023, make:'Audi', model:'Q5', color:'Glacier White', stockNumber:'SM-2015', services:['svc_int','svc_full'], status:'queue', dropOffTime: now - 30*60*1000, promisedTime: now + 5*3600*1000 }),
        v({ dealershipId:'d_summit',year:2022, make:'BMW', model:'330i', color:'Jet Black', stockNumber:'SM-2018', services:['svc_lot'], status:'scheduled', dropOffTime: now + 90*60*1000, promisedTime: now + 8*3600*1000 }),
        // Recently completed
        v({ dealershipId:'d_north', year:2022, make:'Subaru', model:'Outback', color:'Cinnamon', stockNumber:'NS-1390', services:['svc_full'], status:'completed', dropOffTime: now - 28*3600*1000, promisedTime: now - 24*3600*1000 }),
        v({ dealershipId:'d_apex', year:2020, make:'Ram', model:'1500', color:'Diamond Red', stockNumber:'AP-9890', services:['svc_full','svc_eng','svc_pol'], status:'completed', dropOffTime: now - 30*3600*1000, promisedTime: now - 26*3600*1000 }),
        v({ dealershipId:'d_grand', year:2018, make:'Mazda', model:'CX-5', color:'Soul Red', stockNumber:'GA-540', services:['svc_exp'], status:'completed', dropOffTime: now - 49*3600*1000, promisedTime: now - 45*3600*1000 }),
        v({ dealershipId:'d_summit',year:2023, make:'BMW', model:'X3', color:'Brooklyn Grey', stockNumber:'SM-2002', services:['svc_full','svc_pol','svc_int'], status:'completed', dropOffTime: now - 75*3600*1000, promisedTime: now - 70*3600*1000 }),
        v({ dealershipId:'d_north', year:2021, make:'Toyota', model:'Camry', color:'Ruby Pearl', stockNumber:'NS-1380', services:['svc_lot','svc_full'], status:'completed', dropOffTime: now - 100*3600*1000, promisedTime: now - 95*3600*1000 }),
        v({ dealershipId:'d_apex', year:2019, make:'Jeep', model:'Wrangler', color:'Sting Grey', stockNumber:'AP-9870', services:['svc_full'], status:'completed', dropOffTime: now - 120*3600*1000, promisedTime: now - 115*3600*1000 })
      ];
      // Build rich timelines for completed vehicles + assign detailers
      const detIds = ['det_1','det_2','det_3','det_4'];
      vehicleSeed.forEach((veh, i)=>{
        if (!veh.assignedDetailer) {
          // Spread across detailers, with one being faster (det_1 gets fewer hard jobs)
          veh.assignedDetailer = detIds[i % detIds.length];
        }
      });
      vehicleSeed.forEach(veh=>{
        if (veh.status==='completed') {
          const path = ['dropped','queue','service','qc','ready','completed'];
          let t = veh.dropOffTime;
          veh.statusHistory = path.map((s,i)=>{ const at = t + i*45*60*1000; return { status:s, at, note: i===0?'Checked in':null }; });
        } else {
          const order = this.statusOrder?.bind ? this.statusOrder : null;
          const idx = ['scheduled','dropped','queue','service','qc','ready','completed'].indexOf(veh.status);
          const path = ['dropped','queue','service','qc','ready'].slice(0, Math.max(0, idx));
          let t = veh.dropOffTime;
          veh.statusHistory = [{status:'dropped', at: veh.dropOffTime, note:'Checked in'}];
          path.forEach((s,i)=>{ if (s!=='dropped') veh.statusHistory.push({status:s, at: t + (i+1)*30*60*1000}); });
          if (veh.status!=='dropped' && veh.status!=='scheduled') veh.statusHistory.push({status: veh.status, at: t + (path.length)*40*60*1000});
        }
      });
      this.vehicles = vehicleSeed;

      // Invoices: a few paid, one outstanding, one overdue
      const baseDay = 24*3600*1000;
      this.invoices = [];
      const completedByDealer = {};
      this.vehicles.filter(v=>v.status==='completed').forEach(v=>{
        completedByDealer[v.dealershipId] = completedByDealer[v.dealershipId] || [];
        completedByDealer[v.dealershipId].push(v);
      });
      let invNum = 2410;
      Object.entries(completedByDealer).forEach(([dId, vs])=>{
        const dealer = this.dealerships.find(d=>d.id===dId);
        const issuedAt = now - (10+Math.random()*20)*baseDay;
        const inv = this.buildInvoice(dealer, vs, issuedAt);
        inv.number = 'WD-' + (invNum++);
        // randomize state
        const r = Math.random();
        if (r < 0.5) { inv.status='paid'; inv.paidAt = issuedAt + 7*baseDay; }
        else if (r < 0.85) { inv.status='sent'; }
        else { inv.status='sent'; inv.dueAt = now - 3*baseDay; } // overdue
        vs.forEach(v=>v.invoiceId = inv.id);
        this.invoices.push(inv);
      });

      // Some seed notifications
      this.notifications = [];
      this.vehicles.slice(0,8).forEach((v,i)=>{
        const d = this.dealerships.find(x=>x.id===v.dealershipId);
        this.notifications.push({
          id: id('n'), dealershipId: d.id, vehicleId: v.id, channel: ['email','sms','inApp'][i%3],
          to: d.contacts[0].email, subject: `Status update — ${v.year} ${v.make} ${v.model}`,
          body: `Your vehicle (#${v.stockNumber}) is now ${this.STATUSES.find(s=>s.code===v.status).label}.`,
          sentAt: now - i*30*60*1000, delivered: true, readByDealer: i>2
        });
      });

      this.seedWashAndRetail();
      this.seedCRM();
      this.persist();
    },

    seedCRM() {
      const firstNames = ['James','Mary','Robert','Jennifer','Michael','Linda','David','Patricia','Carlos','Sarah','Tony','Emily','Ravi','Aisha','Brandon','Jasmine','Kenji','Olivia','Marcus','Chloe','Devon','Priya','Tyler','Sofia','Andre','Rachel','Jamal','Beatriz','Kyle','Maya'];
      const lastNames = ['Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Park','Patel','Nguyen','Kim','Cohen','Reyes','Singh','Walker','Diaz','Hayes','Foster','Murphy'];
      const makes = [
        ['Toyota','Camry','Pearl White'], ['Toyota','RAV4','Crystal Silver'], ['Honda','Civic','Sonic Gray'],
        ['Honda','Accord','Modern Steel'], ['Tesla','Model 3','Pearl White'], ['Tesla','Model Y','Solid Black'],
        ['Ford','F-150','Velocity Blue'], ['Ford','Explorer','Magnetic'], ['Chevy','Silverado','Summit White'],
        ['Chevy','Tahoe','Black'], ['BMW','3 Series','Alpine White'], ['BMW','X5','Mineral White'],
        ['Audi','A4','Glacier White'], ['Audi','Q5','Mythos Black'], ['Lexus','RX','Atomic Silver'],
        ['Mercedes','C-Class','Iridium Silver'], ['Hyundai','Sonata','Quartz White'], ['Kia','Sorento','Ebony Black'],
        ['Nissan','Altima','Gun Metal'], ['Subaru','Outback','Cinnamon Brown'], ['Mazda','CX-5','Soul Red'],
        ['Jeep','Wrangler','Sting Grey'], ['Ram','1500','Diamond Red'], ['GMC','Sierra','Onyx Black']
      ];
      const tagPool = ['tipper','tesla-owner','always-premium','membership','referral','loyal','weekend-only','commuter','vip','high-spender'];
      function plate() {
        const letters = 'ABCDEFGHJKLMNPRSTUVWXYZ';
        const nums = '0123456789';
        return Array.from({length:3},()=>letters[Math.floor(Math.random()*letters.length)]).join('') + '-' +
               Array.from({length:4},()=>nums[Math.floor(Math.random()*nums.length)]).join('');
      }

      const customers = [];
      const visits = [];
      const now = Date.now();
      // Generate 30 customers with varied patterns
      const profiles = [
        // Members (active subscriptions)
        ...Array(4).fill('member'),
        // VIPs (high spend, 15+ visits)
        ...Array(3).fill('vip'),
        // Gold (loyal, 10-25 visits)
        ...Array(5).fill('gold'),
        // Silver (regular, 4-9 visits)
        ...Array(8).fill('silver'),

        ...Array(10).fill('bronze')

      profiles.forEach((profile, idx) =>{
        const fn = firstNames[Math.floor(Math.random()*firstNames.length)];
