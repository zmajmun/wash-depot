        : `Peak: ${peakDay}. Workload is fairly balanced across the week.`;

      return {
        totalCompleted: all.length,
        headline, recommendations: rec,
        dealersByRevenue, dealersByVolume,
        detailerStats, stageBottlenecks,
        serviceStats, dayOfWeek, peakDayInsight,
        combos, avgTurnaroundLabel
      };
    },

    /* ========= activeVehicle / Invoice ========= */
    get activeVehicle(){ return this.vehicles.find(v=>v.id===this.activeVehicleId); },
    get activeInvoice(){ return this.invoices.find(i=>i.id===this.activeInvoiceId); },
    get payModalInvoice(){ return this.invoices.find(i=>i.id===this.payModal.invoiceId); },
    paymentMethodLabel(m){ return ({ach:'ACH transfer', zelle:'Zelle', check:'mailed check'})[m] || m; },
    get intakeEstimate(){
      if (!this.intake.dealershipId && !this.currentDealership) return 0;
      const dId = this.intake.dealershipId || this.currentDealership?.id;
      const sheet = this.rateSheetFor(dId);
      return (this.intake.services||[]).reduce((s,sid)=>s+(sheet.find(x=>x.serviceId===sid)?.price||0),0);
    },

    /* ========= command palette ========= */
    get commandResults(){
      const q = this.commandQuery.toLowerCase().trim();
      if (!q) return [];
      const r = [];
      this.vehicles.forEach(v=>{
        const blob = [v.year, v.make, v.model, v.vin, v.stockNumber, v.color].join(' ').toLowerCase();
        if (blob.includes(q)) r.push({
          key:'v_'+v.id, icon:'',
          title: `${v.year} ${v.make} ${v.model}`,
          subtitle: `${this.dealershipById(v.dealershipId)?.name} · #${v.stockNumber} · ${this.statusMeta(v.status).label}`,
          action: ()=>this.openVehicle(v.id)
        });
      });
      this.dealerships.forEach(d=>{
        if (d.name.toLowerCase().includes(q)) r.push({
          key:'d_'+d.id, icon:'', title: d.name, subtitle: d.address,
          action: ()=>{ if(this.session.role==='staff'){ this.view='dealerships'; this.openDealership(d.id); } }
        });
      });
      this.invoices.forEach(i=>{
        if (i.number.toLowerCase().includes(q)) r.push({
          key:'i_'+i.id, title: i.number, subtitle: this.dealershipById(i.dealershipId)?.name + ' · ' + this.money(i.total),
          action: ()=>this.openInvoice(i.id)
        });
      });
      return r.slice(0,12);
    },

    /* ========= sidebar nav (collapsible sections) ========= */
    viewToSection(v){
      const map = {
        total:'overview', insights:'overview',
        dashboard:'detailing', bookings:'detailing', intake:'detailing', board:'detailing', vehicles:'detailing', dealerships:'detailing', billing:'detailing',
        lane:'washretail', wash:'washretail', customers:'washretail', 'customer-app':'washretail', retail:'washretail',
        notifications:'other', reports:'other', settings:'other'
      };
      return map[v];
    },
    toggleNavSection(name){
      this.navOpen[name] = !this.navOpen[name];
      try { localStorage.setItem('washdepot_nav', JSON.stringify(this.navOpen)); } catch {}
    },
    loadNavState(){
      try {
        const raw = localStorage.getItem('washdepot_nav');
        if (raw) this.navOpen = { ...this.navOpen, ...JSON.parse(raw) };
      } catch {}
      const s = this.viewToSection(this.view);
      if (s && !this.navOpen[s]) this.navOpen[s] = true;
    },

    /* ========= actions ========= */
    login(s){
      this.session = s;
      if (s.role==='dealer') this.view = 'd-bookings';
      else if (s.staffRole==='owner') this.view = 'total';
      else this.view = 'dashboard';
      this.settingsTab = (s.role==='staff' && s.staffRole==='fleet') ? 'catalog' : 'pricing';
      this.loadNavState();
      this.resetIntake();
    },
    logout(){ this.session = null; this.view='dashboard'; this.activeVehicleId=null; },

    boardVehicles(code){
      return this.vehicles.filter(v=>v.status===code && (!this.boardFilter || v.dealershipId===this.boardFilter));
    },

    openVehicle(id){ this.activeVehicleId = id; if (this.session.role==='dealer'){ const n = this.notifications.find(x=>x.vehicleId===id && !x.readByDealer); if (n){ n.readByDealer=true; this.persist(); } } },

    /* ========= Real SMS sending (Twilio) ========= */
    async sendSms(to, body){
      if (!to) return { ok:false, reason:'no-phone' };
      try {
        const res = await fetch('/api/notifications/sms', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ to, body })
        });
        if (res.status === 503) {
          const j = await res.json().catch(()=>({}));
          return { ok:false, reason:'not-configured', detail: j };
        }
        if (!res.ok) {
          const txt = await res.text();
          return { ok:false, reason:'twilio-error', detail: txt };
        }
        const data = await res.json();
        return { ok:true, sid: data.sid, status: data.status };
      } catch (e) {
        return { ok:false, reason:'network', detail: e.message };
      }
    },
    async testSms(){
      if (!this.twilioTestForm.to || !this.twilioTestForm.body) { this.toast('Phone and message required','warning'); return; }
      this.twilioTestForm.busy = true;
      const res = await this.sendSms(this.twilioTestForm.to, this.twilioTestForm.body);
      this.twilioTestForm.busy = false;
      if (res.ok) {
        this.toast('SMS sent (sid: ' + res.sid + ')');
        this.twilioTestForm.lastResult = 'Sent: ' + res.sid;
      } else {
        const msg = res.reason === 'not-configured' ? 'Twilio not configured. Add TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM to Vercel env vars.' : ('SMS failed: ' + (res.detail || res.reason));
        this.toast(msg, 'warning');
        this.twilioTestForm.lastResult = msg;
      }
    },
    async checkTwilioStatus(){
      try {
        const res = await fetch('/api/notifications/sms');
        const j = await res.json();
        this.twilioStatus = j;
      } catch { this.twilioStatus = { configured: false }; }
    },

    setStatus(vehicleId, code){
      const v = this.vehicles.find(x=>x.id===vehicleId); if (!v) return;
      if (v.status === code) return;
      v.status = code;
      v.statusHistory.push({ status: code, at: Date.now() });
      // Auto notification
      const dealer = this.dealershipById(v.dealershipId);
      const meta = this.statusMeta(code);
      const channels = [];
      if (dealer.notificationPrefs.email) channels.push('email');
      if (dealer.notificationPrefs.sms && (code==='ready' || code==='completed')) channels.push('sms');
      if (dealer.notificationPrefs.inApp) channels.push('inApp');
      const subject = `Status update: ${v.year} ${v.make} ${v.model} → ${meta.label}`;
      const body = `${dealer.name}: Stock #${v.stockNumber} is now ${meta.label}.${code==='ready' ? ' Ready for ' + (v.deliveryMethod==='delivery'?'delivery':'pickup') + '.':''}`;
      channels.forEach(ch=>{
        const to = ch==='sms'? dealer.contacts[0].phone : ch==='email'? dealer.contacts[0].email : 'In-app';
        const note = {
          id: 'n_'+Math.random().toString(36).slice(2,9),
          dealershipId: dealer.id, vehicleId: v.id, channel: ch,
          to, subject, body,
          sentAt: Date.now(), delivered: ch !== 'sms', readByDealer: false
        };
        this.notifications.push(note);
        // Real SMS dispatch (fire-and-forget)
        if (ch === 'sms' && to) {
          this.sendSms(to, `Wash Depot: ${body}`).then(r =>{
            note.delivered = !!r.ok;
            if (r.ok) note.twilioSid = r.sid; else note.smsError = r.reason;
            this.persist();
          });
        }
      });
      // Auto-invoice on completed
      if (code==='completed' && !v.invoiceId) {
        this.generateInvoiceForVehicle(v.id, true);
      }
      this.persist();
      this.toast(`${v.make} ${v.model} → ${meta.label}`);
    },

    submitIntake(){
      if (!this.intake.dealershipId || !this.intake.make || !this.intake.model) { this.toast('Missing required fields','warning'); return; }
      const now = Date.now();
      const promisedAt = this.intake.promisedTime ? new Date(this.intake.promisedTime).getTime() : now + 4*3600*1000;
      const v = {
        id: 'veh_'+Math.random().toString(36).slice(2,9),
        dealershipId: this.intake.dealershipId,
        year: this.intake.year, make: this.intake.make, model: this.intake.model, color: this.intake.color,
        vin: this.intake.vin?.toUpperCase(), plate: this.intake.plate?.toUpperCase(),
        stockNumber: this.intake.stockNumber || ('WD-'+Math.floor(Math.random()*9000+1000)),
        services: this.intake.services || [],
        status: 'scheduled', priority: this.intake.priority || 'standard',
        deliveryMethod: this.intake.deliveryMethod || 'pickup',
        notes: this.intake.notes || '',
        dropOffTime: promisedAt - 4*3600*1000 < now ? now : promisedAt - 4*3600*1000,
        promisedTime: promisedAt,
        statusHistory: [{ status:'scheduled', at: now, note:'Manually scheduled by ' + (this.session?.name || 'Staff') }]
      };
      this.vehicles.push(v);
      this.persist();
      this.toast('Vehicle scheduled — drop on the Active Jobs board to advance the status');
      this.resetIntake();
      this.view = 'bookings';
      // notify dealer
      const dealer = this.dealershipById(v.dealershipId);
      if (dealer.notificationPrefs.email) {
        this.notifications.push({ id:'n_'+Math.random().toString(36).slice(2,9), dealershipId: dealer.id, vehicleId: v.id, channel:'email', to: dealer.contacts[0].email, subject:`Scheduled: ${v.year} ${v.make} ${v.model}`, body:`Stock #${v.stockNumber} has been scheduled at Wash Depot. We'll notify you when it's checked in.`, sentAt: Date.now(), delivered:true, readByDealer:false });
      }
      this.persist();
    },

    submitDropoffRequest(){
      if (!this.intake.make || !this.intake.model) { this.toast('Missing fields','warning'); return; }
      const v = {
        id: 'veh_'+Math.random().toString(36).slice(2,9),
        dealershipId: this.currentDealership.id,
        year: this.intake.year, make: this.intake.make, model: this.intake.model, color: this.intake.color,
        vin: this.intake.vin?.toUpperCase(),
        stockNumber: this.intake.stockNumber || ('WD-'+Math.floor(Math.random()*9000+1000)),
        services: this.intake.services || [],
        status: 'scheduled', priority: 'standard',
        deliveryMethod: this.intake.deliveryMethod || 'pickup',
        notes: this.intake.notes || '',
        dropOffTime: this.intake.dropOffTime ? new Date(this.intake.dropOffTime).getTime() : Date.now()+2*3600*1000,
        promisedTime: Date.now()+8*3600*1000,
        statusHistory: [{ status:'scheduled', at: Date.now(), note:'Drop-off scheduled by dealer' }]
      };
      this.vehicles.push(v);
      this.persist();
      this.toast('Drop-off scheduled — Wash Depot has been notified.');
      this.resetIntake();
      this.view='d-tracker';
    },

    resetIntake(){
      this.intake = {
        dealershipId: this.currentDealership?.id || '', stockNumber:'', year:'', make:'', model:'', color:'', vin:'', plate:'',
        services: [], promisedTime:'', deliveryMethod:'pickup', priority:'standard', notes:''
      };
    },

    openDealership(id){
      if (id==='new') {
        this.dealershipDrawer = {
          id:null, name:'', address:'', brandColor:'#0f766e', paymentTerms:'Net 15',
          contacts:[{name:'',email:'',phone:''}], rateSheet: this.services.map(s=>({serviceId:s.id, price: s.price ?? 50})),
          notificationPrefs:{email:true,sms:false,inApp:true}
        };
      } else {
        const d = this.dealershipById(id);
        this.dealershipDrawer = JSON.parse(JSON.stringify(d));
      }
    },
    saveDealership(){
      const d = this.dealershipDrawer;
      if (!d.name) { this.toast('Name required','warning'); return; }
      if (d.id) {
        const idx = this.dealerships.findIndex(x=>x.id===d.id);
        this.dealerships[idx] = d;
      } else {
        d.id = 'd_'+Math.random().toString(36).slice(2,9);
        this.dealerships.push(d);
      }
      this.persist();
      this.dealershipDrawer = null;
      this.toast('Dealership saved');
    },
    addRateToDrawer(e){
      const sid = e.target.value; if (!sid) return;
      const catalogPrice = this.serviceById(sid)?.price ?? 50;
      this.dealershipDrawer.rateSheet.push({ serviceId: sid, price: catalogPrice });
      e.target.value = '';
    },

    dealerOpenBalance(dId){
      return this.invoices.filter(i=>i.dealershipId===dId && i.status!=='paid').reduce((s,i)=>s+i.total,0);
    },

    /* ========= invoices ========= */
    buildInvoice(dealer, vehicleList, issuedAt){
      const lineItems = [];
      let total = 0;
      vehicleList.forEach(v=>{
        this.vehicleServices(v).forEach(svc=>{
          lineItems.push({ vehicleId: v.id, vehicleLabel: `${v.year} ${v.make} ${v.model} (#${v.stockNumber})`, serviceName: svc.name, price: svc.price });
          total += svc.price;
        });
      });
      const termsDays = ({'Due on receipt':0,'Net 7':7,'Net 15':15,'Net 30':30,'Net 45':45})[dealer.paymentTerms] ?? 15;
      const issued = issuedAt || Date.now();
      const due = issued + termsDays*86400000;
      return {
        id: 'inv_'+Math.random().toString(36).slice(2,9),
        number: 'WD-'+Math.floor(Math.random()*9000+1000),
        dealershipId: dealer.id,
        vehicleIds: vehicleList.map(v=>v.id),
        lineItems, total,
        issuedAt: issued, dueAt: due, status:'sent', paidAt:null
      };
    },
    generateInvoiceForVehicle(vehicleId, silent=false){
      const v = this.vehicles.find(x=>x.id===vehicleId); if(!v) return;
      if (v.invoiceId) { this.openInvoice(v.invoiceId); return; }
      const dealer = this.dealershipById(v.dealershipId);
      const inv = this.buildInvoice(dealer, [v]);
      v.invoiceId = inv.id;
      this.invoices.push(inv);
      // Notify
      this.notifications.push({
        id:'n_'+Math.random().toString(36).slice(2,9), dealershipId: dealer.id, vehicleId: v.id, channel:'email',
        to: dealer.contacts[0].email, subject:`Invoice ${inv.number} — ${this.money(inv.total)}`, body:`Invoice for ${v.year} ${v.make} ${v.model} (#${v.stockNumber}) is available. Due ${this.formatDate(inv.dueAt)}.`,
        sentAt: Date.now(), delivered:true, readByDealer:false
      });
      this.persist();
      if (!silent) { this.openInvoice(inv.id); this.toast('Invoice generated'); }
    },
    createInvoice(){
      if (!this.newInvoice.dealershipId || !this.newInvoice.vehicleIds.length) { this.toast('Pick a dealership and vehicles','warning'); return; }
      const dealer = this.dealershipById(this.newInvoice.dealershipId);
      const vs = this.newInvoice.vehicleIds.map(id=>this.vehicles.find(v=>v.id===id)).filter(Boolean);
      const inv = this.buildInvoice(dealer, vs);
      vs.forEach(v=>v.invoiceId = inv.id);
      this.invoices.push(inv);
      this.persist();
      this.newInvoice = { dealershipId:'', vehicleIds:[] };
      this.newInvoiceModal=false;
      this.openInvoice(inv.id);
      this.toast('Invoice created');
    },
    generateStatements(){
      // Group all uninvoiced completed vehicles per dealer
      let count = 0;
      this.dealerships.forEach(d=>{
        const vs = this.uninvoicedVehicles(d.id).filter(v=>v.status==='completed');
        if (vs.length) {
          const inv = this.buildInvoice(d, vs);
          vs.forEach(v=>v.invoiceId = inv.id);
          this.invoices.push(inv);
          count++;
          this.notifications.push({
            id:'n_'+Math.random().toString(36).slice(2,9), dealershipId: d.id, channel:'email', to: d.contacts[0].email,
            subject:`Weekly statement — ${inv.number}`, body:`Your weekly statement covering ${vs.length} vehicles is ready. Total ${this.money(inv.total)}.`,
            sentAt: Date.now(), delivered:true, readByDealer:false
          });
        }
      });
      this.persist();
      this.toast(count?`${count} statements generated`:'No uninvoiced work to bill');
    },
    uninvoicedVehicles(dId){ return this.vehicles.filter(v=>v.dealershipId===dId && !v.invoiceId && v.status==='completed'); },
    openInvoice(id){ this.activeInvoiceId = id; },
    markInvoicePaid(id){
      const i = this.invoices.find(x=>x.id===id); if (!i) return;
      i.status='paid'; i.paidAt = Date.now();
      const d = this.dealershipById(i.dealershipId);
      this.notifications.push({ id:'n_'+Math.random().toString(36).slice(2,9), dealershipId:d.id, channel:'email', to:d.contacts[0].email, subject:`Payment received — ${i.number}`, body:`Thank you! Payment of ${this.money(i.total)} received.`, sentAt:Date.now(), delivered:true, readByDealer:false });
      this.persist();
      this.toast('Marked paid');
    },

    /* ========= dealer-side payments ========= */
    openPayModal(invoiceId){
      this.payModal = { open:true, invoiceId, step:'choose', method:null, note:'' };
    },
    confirmPayment(method){
      const inv = this.payModalInvoice; if (!inv) return;
      const dealer = this.dealershipById(inv.dealershipId);
      const statusMap = { ach:'pending_ach', zelle:'pending_zelle', check:'pending_check' };
      inv.status = statusMap[method];
      inv.paymentMethod = method;
      inv.paymentSubmittedAt = Date.now();
      inv.paymentNote = this.payModal.note || '';
      const labels = { ach:'ACH transfer', zelle:'Zelle', check:'mailed check' };
      // Notify Wash Depot internally
      this.notifications.push({
        id:'n_'+Math.random().toString(36).slice(2,9),
        dealershipId: dealer.id, channel:'inApp', to:'Wash Depot AR',
        subject:`Payment notification — ${inv.number}`,
        body:`${dealer.name} has indicated they sent payment for ${inv.number} via ${labels[method]} (${this.money(inv.total)}).${this.payModal.note ? ' Note: '+this.payModal.note : ''}`,
        sentAt: Date.now(), delivered:true, readByDealer:true, internal:true
      });
      this.persist();
      this.payModal.step = 'done';
    },

    /* ========= notifications ========= */
    sendCustomUpdate(vehicleId){
      const v = this.vehicles.find(x=>x.id===vehicleId); if(!v) return;
      const dealer = this.dealershipById(v.dealershipId);
      this.compose = {
        dealershipId: dealer.id,
        subject: `Update on ${v.year} ${v.make} ${v.model} (#${v.stockNumber})`,
        body: `Hi ${dealer.contacts[0].name.split(' ')[0]} — quick update on your vehicle. `,
        email: !!dealer.notificationPrefs.email,
        sms: !!dealer.notificationPrefs.sms,
        inApp: !!dealer.notificationPrefs.inApp,
        vehicleId: v.id
      };
      this.composeOpen = true;
    },
    sendManual(){
      if (!this.compose.dealershipId || !this.compose.subject) { this.toast('Missing fields','warning'); return; }
      const d = this.dealershipById(this.compose.dealershipId);
      const channels = [];
      if (this.compose.email) channels.push('email');
      if (this.compose.sms) channels.push('sms');
      if (this.compose.inApp) channels.push('inApp');
      if (!channels.length) { this.toast('Pick at least one channel','warning'); return; }
      channels.forEach(ch=>{
        const to = ch==='email'? d.contacts[0].email : ch==='sms'? d.contacts[0].phone : 'In-app';
        const note = {
          id: 'n_'+Math.random().toString(36).slice(2,9), dealershipId: d.id, vehicleId: this.compose.vehicleId, channel: ch,
          to, subject: this.compose.subject, body: this.compose.body,
          sentAt: Date.now(), delivered: ch !== 'sms', readByDealer: false
        };
        this.notifications.push(note);
        if (ch === 'sms' && to) {
          this.sendSms(to, `Wash Depot — ${this.compose.subject}\n\n${this.compose.body}`).then(r =>{
            note.delivered = !!r.ok;
            if (r.ok) note.twilioSid = r.sid; else note.smsError = r.reason;
            this.persist();
          });
        }
      });
      this.persist();
      this.composeOpen = false;
      this.compose = { dealershipId:'', subject:'', body:'', email:true, sms:false, inApp:true };
      this.toast('Update sent');
    },
    markRead(nId){ const n = this.notifications.find(x=>x.id===nId); if(n){ n.readByDealer = true; this.persist(); } },

    /* ========= settings helpers ========= */
    addService(){
      const id = 'svc_'+Math.random().toString(36).slice(2,7);
      this.services.push({ id, name:'New service', description:'', price: 50 });
      // add default price to each dealership using catalog price
      this.dealerships.forEach(d=>d.rateSheet.push({ serviceId:id, price: 50 }));
      this.persist();
    },
    addDetailer(){ this.detailers.push({ id:'det_'+Math.random().toString(36).slice(2,7), name:'New detailer' }); this.persist(); },
    removeServiceEverywhere(serviceId){
      this.services = this.services.filter(s=>s.id!==serviceId);
      this.dealerships.forEach(d=>d.rateSheet = d.rateSheet.filter(r=>r.serviceId!==serviceId));
      this.persist(); this.toast('Service removed');
    },
    addRateFromCatalog(dealershipId, e){
      const sid = e.target.value; if (!sid) return;
      const d = this.dealershipById(dealershipId); if (!d) return;
      if (d.rateSheet.find(r=>r.serviceId===sid)) { e.target.value=''; return; }
      const catalogPrice = this.serviceById(sid)?.price ?? 50;
      d.rateSheet.push({ serviceId: sid, price: catalogPrice });
      e.target.value = '';
      this.persist(); this.toast('Service added at standard price ' + this.money(catalogPrice));
    },
    addCustomRate(dealershipId){
      const d = this.dealershipById(dealershipId); if (!d) return;
      const customId = 'custom_'+Math.random().toString(36).slice(2,9);
      d.rateSheet.push({ serviceId: customId, custom: true, name:'Custom service', description:'', price: 0 });
      this.pricingExpanded[dealershipId] = true;
      this.persist(); this.toast('Custom line item added — set name and price');
    },
    removeRate(dealershipId, idx){
      const d = this.dealershipById(dealershipId); if (!d) return;
      d.rateSheet.splice(idx, 1);
      this.persist();
    },

    /* ========= User invitations (Clerk-backed) ========= */
    roleLabel(r){ return ({ owner:'Owner', fleet:'Fleet Manager', dealer:'Dealer', guest:'Guest' })[r] || r || '—'; },
    async loadUsers(){
      try {
        const [u, i] = await Promise.all([
          fetch('/api/users', { credentials:'include' }).then(r =>r.ok ? r.json() : { users: [] }),
          fetch('/api/invitations', { credentials:'include' }).then(r =>r.ok ? r.json() : { invitations: [] })
        ]);
        this.activeUsers = u.users || [];
        this.pendingInvites = i.invitations || [];
      } catch (e) {
        console.warn('loadUsers failed', e);
        this.toast('Could not load users (Clerk API)', 'warning');
      }
    },
    async sendInvite(){
      if (!this.inviteForm.email) { this.toast('Email required','warning'); return; }
      if (this.inviteForm.role === 'dealer' && !this.inviteForm.dealershipId) { this.toast('Pick a dealership','warning'); return; }
      this.inviteSending = true;
      try {
        const res = await fetch('/api/invitations', {
          method:'POST', credentials:'include',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(this.inviteForm)
        });
        if (!res.ok) throw new Error(await res.text());
        this.toast('Invitation sent to ' + this.inviteForm.email);
        this.inviteForm = { email:'', role:'fleet', dealershipId:'' };
        await this.loadUsers();
      } catch (e) {
        this.toast('Invite failed: ' + e.message, 'warning');
      } finally {
        this.inviteSending = false;
      }
    },
    async revokeInvite(id){
      if (!confirm('Revoke this invitation?')) return;
      try {
        const res = await fetch('/api/invitations?id=' + encodeURIComponent(id), { method:'DELETE', credentials:'include' });
        if (!res.ok) throw new Error(await res.text());
        this.toast('Invitation revoked');
        await this.loadUsers();
      } catch (e) { this.toast('Failed: ' + e.message, 'warning'); }
    },
    async updateUserRole(userId, role, dealershipId){
      try {
        const res = await fetch('/api/users', {
          method:'PATCH', credentials:'include',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ userId, role, dealershipId: dealershipId || '' })
        });
        if (!res.ok) throw new Error(await res.text());
        this.toast('User role updated');
        await this.loadUsers();
      } catch (e) { this.toast('Update failed: ' + e.message, 'warning'); }
    },
    async deleteUser(userId){
      try {
        const res = await fetch('/api/users?id=' + encodeURIComponent(userId), { method:'DELETE', credentials:'include' });
        if (!res.ok) throw new Error(await res.text());
        this.toast('User removed');
        await this.loadUsers();
      } catch (e) { this.toast('Remove failed: ' + e.message, 'warning'); }
    },

    /* ========= Square integration (prototype) ========= */
    connectSquare(){
      if (!this.squareForm.accessToken || !this.squareForm.locationName) { this.toast('Both fields required','warning'); return; }
      const token = this.squareForm.accessToken;
      const masked = token.length >8 ? token.slice(0,4) + '…' + token.slice(-4) : '••••';
      this.squareConfig = {
        connected: true,
        locationName: this.squareForm.locationName,
        lastSyncAt: Date.now(),
        accessTokenMasked: masked
      };
      this.squareForm = { accessToken:'', locationName:'' };
      this.squareModal = false;
      this.persist();
      this.toast('Square connected — syncing data');
    },
    syncSquare(){
      // Prototype: regenerate sales as if synced fresh
      this.seedWashAndRetail();
      this.squareConfig.lastSyncAt = Date.now();
      this.persist();
      this.toast('Synced ' + this.washSales.length + ' wash + ' + this.retailSales.length + ' retail transactions');
    },

    /* ========= toasts ========= */
    toast(msg, type='success'){
      const t = { id: Math.random(), message: msg, type };
      this.toasts.push(t);
      setTimeout(()=>{ this.toasts = this.toasts.filter(x=>x.id!==t.id); }, 2800);
    }
  };
}
</script>
