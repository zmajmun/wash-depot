<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wash Depot — Dealership Operations</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"></script>
<style>
  :root {
    --brand: #0f766e;
    --brand-dark: #115e59;
    --brand-light: #ccfbf1;
  }
  html, body { height: 100%; }
  [x-cloak] { display: none !important; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
  .brand-grad { background: #000; }
  .brand-grad-login { background: radial-gradient(ellipse at top, #1a1a1a 0%, #000 70%); }
  /* Logo: img loads if wash-depot-logo.png exists next to file, otherwise SVG fallback shows */
  .wd-logo-wrap { position: relative; }
  .wd-logo-img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .wd-logo-img.failed { display: none; }
  .wd-logo-img.failed + .wd-logo-svg { display: block; }
  .wd-logo-img:not(.failed) + .wd-logo-svg { display: none; }
  .wd-logo-svg { width: 100%; height: 100%; }
  .scroll-shadow { background:
    linear-gradient(white 30%, rgba(255,255,255,0)) 0 0 / 100% 14px no-repeat,
    linear-gradient(rgba(255,255,255,0), white 70%) 0 100% / 100% 14px no-repeat,
    radial-gradient(farthest-side at 50% 0, rgba(0,0,0,.08), transparent) 0 0 / 100% 8px no-repeat,
    radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,.08), transparent) 0 100% / 100% 8px no-repeat;
    background-attachment: local, local, scroll, scroll;
  }
  .status-chip { display: inline-flex; align-items: center; gap: .35rem; padding: .15rem .55rem; border-radius: 9999px; font-size: .72rem; font-weight: 600; line-height: 1.2; }
  .dot { width: .45rem; height: .45rem; border-radius: 9999px; display: inline-block; }
  .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7rem; padding: .1rem .35rem; border:1px solid #e2e8f0; border-radius: .35rem; background: #f8fafc; }
  .nav-item { color: rgba(255,255,255,.78); }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,.06); }
  .nav-item.active { background: linear-gradient(90deg, rgba(20,184,166,.22), rgba(20,184,166,.06)); color: #fff; box-shadow: inset 3px 0 0 #14b8a6; }
  /* Airbnb-style minimal slide drawer */
  .ab-drawer-backdrop { animation: fadein .2s ease-out; }
  .ab-drawer { animation: slidein-right .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slidein-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .ab-input { width: 100%; padding: 14px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; background: #fff; transition: border-color .15s, box-shadow .15s; }
  .ab-input:focus { outline: none; border-color: #111827; box-shadow: 0 0 0 1px #111827; }
  .ab-label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .ab-section { padding: 28px 32px; border-bottom: 1px solid #f3f4f6; }
  .ab-section:last-child { border-bottom: none; }
  .ab-section h3 { font-size: 13px; font-weight: 700; color: #111827; margin-bottom: 18px; text-transform: uppercase; letter-spacing: .05em; }
  .ab-btn { padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: all .12s; }
  .ab-btn-primary { background: #111827; color: #fff; }
  .ab-btn-primary:hover { background: #000; }
  .ab-btn-ghost { background: transparent; color: #4b5563; }
  .ab-btn-ghost:hover { color: #111827; }
  .ab-btn-danger { background: transparent; color: #dc2626; font-weight: 500; }
  .ab-btn-danger:hover { text-decoration: underline; }
  .ab-toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f3f4f6; }
  .ab-toggle:last-child { border-bottom: none; }
  .ab-toggle-title { font-size: 15px; font-weight: 500; color: #111827; }
  .ab-toggle-sub { font-size: 13px; color: #6b7280; margin-top: 2px; }
  .ab-switch { position: relative; width: 40px; height: 24px; background: #e5e7eb; border-radius: 12px; cursor: pointer; transition: background .15s; flex-shrink: 0; }
  .ab-switch.on { background: #111827; }
  .ab-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .ab-switch.on::after { transform: translateX(16px); }
  .ab-color-swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color .12s; }
  .ab-color-swatch.selected { border-color: #111827; }

  /* ===== Live Lane: white cards, glow only for first-time ===== */
  .lane-card { position: relative; background: #ffffff; color: #0f172a; border-radius: 16px; padding: 20px; border: 1.5px solid #e5e7eb; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .lane-card.clickable { cursor: pointer; }
  .lane-card.clickable:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -8px rgba(15,23,42,.18); border-color: #cbd5e1; }
  .lane-card .plate { font-family: 'Courier New', ui-monospace, monospace; font-weight: 900; font-size: 24px; letter-spacing: 2px; background: #fff; color: #000; display: inline-block; padding: 4px 10px; border-radius: 4px; border: 2px solid #1a1a1a; }
  @keyframes pulse-new { 0%,100% { box-shadow: 0 0 10px #06b6d4, 0 0 22px #06b6d4, 0 0 0 rgba(6,182,212,.0); } 50% { box-shadow: 0 0 26px #22d3ee, 0 0 56px #06b6d4, 0 0 0 8px rgba(6,182,212,.18); } }
  .tier-new { border-color: #06b6d4; border-width: 2px; animation: pulse-new 2.0s ease-in-out infinite; }
  .tier-regular { border-color: #e5e7eb; }
  .tier-loyal { border-color: #a855f7; border-left: 4px solid #a855f7; }
  .tier-vip { border-color: #ec4899; border-left: 4px solid #ec4899; }
  .tier-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; }
  .tier-badge.new { background: #06b6d4; color: #fff; }
  .tier-badge.regular { background: #e2e8f0; color: #334155; }
  .tier-badge.loyal { background: #a855f7; color: #fff; }
  .tier-badge.vip { background: #db2777; color: #fff; }
  .scan-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; animation: pulse-scan 1.2s ease-in-out infinite; display: inline-block; }
  @keyframes pulse-scan { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.7); } 70% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
  .sparkle::before { content: ""; }
  .timeline-line::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: #e2e8f0; }
  details >summary { list-style: none; cursor: pointer; }
  details >summary::-webkit-details-marker { display: none; }
  .toast-enter { animation: slidein .25s ease-out; }
  @keyframes slidein { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  /* LPR intake capture (customer drawer vehicle section) */
  .lpr-capture { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 100% at 50% 0%, #1b2433 0%, #0b0f1a 72%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
  .lpr-illus { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .lpr-car { width: 76%; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.45)); transform: perspective(620px) rotateY(-16deg); }
  .lpr-photo { width: 100%; height: 100%; object-fit: cover; }
  .lpr-top { position: absolute; top: 8px; left: 11px; font-size: 10px; letter-spacing: 0.12em; font-weight: 700; color: rgba(255,255,255,0.85); display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
  .lpr-time { color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 0.03em; text-transform: none; }
  .lpr-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; animation: lprpulse 1.4s ease-in-out infinite; }
  @keyframes lprpulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .lpr-plate { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); background: #f8fafc; color: #0f172a; font-family: ui-monospace, Menlo, monospace; font-weight: 800; font-size: 13px; letter-spacing: 0.16em; padding: 3px 12px; border-radius: 5px; box-shadow: 0 2px 7px rgba(0,0,0,0.45); border: 2px solid #1f2937; }
  .vf { position: absolute; width: 15px; height: 15px; border: 0 solid rgba(255,255,255,0.5); }
  .vf-tl { top: 8px; left: 8px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 4px; }
  .vf-tr { top: 8px; right: 8px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 4px; }
  .vf-bl { bottom: 8px; left: 8px; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 4px; }
  .vf-br { bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 4px; }
  /* Print friendly invoice */
  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area { position: absolute; left: 0; top: 0; width: 100%; }
    .no-print { display: none !important; }
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .85rem; border-radius: .5rem; font-weight: 600; font-size: .875rem; transition: all .12s; }
  .btn-primary { background: var(--brand); color: white; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-outline { background: white; color: #0f172a; border: 1px solid #e2e8f0; }
  .btn-outline:hover { background: #f8fafc; }
  .btn-danger { background: #b91c1c; color: white; }
  .btn-ghost:hover { background: #f1f5f9; }
  .card { background: white; border: 1px solid #e2e8f0; border-radius: .75rem; }
  .input, .select, .textarea {
    width: 100%; padding: .5rem .65rem; border: 1px solid #cbd5e1; border-radius: .5rem; background: white; font-size: .9rem;
  }
  .label { display: block; font-size: .78rem; font-weight: 600; color: #334155; margin-bottom: .25rem; }
</style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

<!-- Reusable Wash Depot logo SVG (used as fallback if wash-depot-logo.png isn't provided) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="wd-water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fc3ee"/>
      <stop offset="60%" stop-color="#1f8fd1"/>
      <stop offset="100%" stop-color="#0d4d7a"/>
    </linearGradient>
    <linearGradient id="wd-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="wd-ring" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <symbol id="wd-logo" viewBox="0 0 200 200">
      <!-- Outer black badge -->
      <circle cx="100" cy="100" r="98" fill="url(#wd-ring)" stroke="#262626" stroke-width="2"/>
      <circle cx="100" cy="100" r="92" fill="none" stroke="#0f0f0f" stroke-width="1"/>

      <!-- Top water/wave with car silhouette -->
      <g transform="translate(100,68)">
        <!-- splash droplets -->
        <circle cx="-58" cy="-2" r="3" fill="url(#wd-water)" opacity="0.85"/>
        <circle cx="-50" cy="-12" r="2" fill="url(#wd-water)" opacity="0.7"/>
        <circle cx="55" cy="-4" r="3" fill="url(#wd-water)" opacity="0.85"/>
        <circle cx="48" cy="-14" r="2" fill="url(#wd-water)" opacity="0.7"/>
        <!-- wave body -->
        <path d="M-52,8 C-40,-12 -22,-10 -8,-2 C6,-12 22,-10 38,0 C44,5 50,8 52,10 C50,18 30,18 10,15 C-10,18 -30,20 -52,8 Z"
              fill="url(#wd-water)"/>
        <!-- car silhouette (sleek profile) -->
        <g fill="#0a1729">
          <path d="M-22,2 Q-18,-12 -6,-14 L10,-14 Q22,-12 26,2 L28,8 L-24,8 Z"/>
          <path d="M-18,4 Q-15,-8 -5,-10 L8,-10 Q18,-8 22,4 Z" fill="#1e3a5f" opacity="0.9"/>
        </g>
        <!-- wheels -->
        <circle cx="-14" cy="8" r="3.5" fill="#000"/>
        <circle cx="14" cy="8" r="3.5" fill="#000"/>
        <circle cx="-14" cy="8" r="1.4" fill="#404040"/>
        <circle cx="14" cy="8" r="1.4" fill="#404040"/>
      </g>

      <!-- "Wash" italic script -->
      <text x="100" y="118" text-anchor="middle" fill="#ffffff" stroke="#5fc3ee" stroke-width="0.4"
            font-size="30" font-weight="900" font-style="italic"
            font-family="Georgia, 'Times New Roman', serif" letter-spacing="-0.5">Wash</text>

      <!-- "DEPOT" red block -->
      <text x="100" y="148" text-anchor="middle" fill="url(#wd-red)" stroke="#7f1d1d" stroke-width="0.6"
            font-size="26" font-weight="900"
            font-family="Impact, 'Arial Black', sans-serif" letter-spacing="3">DEPOT</text>

      <!-- Bottom curve with HAND CAR WASH -->
      <path id="wd-arc" d="M 30,165 Q 100,195 170,165" fill="none"/>
      <text font-size="9" font-weight="800" letter-spacing="3.5" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif">
        <textPath href="#wd-arc" startOffset="50%" text-anchor="middle">HAND CAR WASH</textPath>
      </text>
    </symbol>
  </defs>
</svg>

<!-- LOGIN -->
<template x-if="!session">
  <div class="min-h-screen flex items-center justify-center brand-grad-login p-6">
    <div class="card w-full max-w-md p-8 shadow-xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="wd-logo-wrap w-14 h-14 rounded-xl overflow-hidden bg-black flex-shrink-0">
          <img class="wd-logo-img" src="/wash-depot-logo.png?v=2" onerror="this.classList.add('failed')" alt="Wash Depot logo" />
          <svg class="wd-logo-svg" viewBox="0 0 200 200"><use href="#wd-logo"/></svg>
        </div>
        <div>
          <div class="text-xl font-black tracking-tight">Wash Depot</div>
          <div class="text-xs text-slate-500">Dealership Operations Platform</div>
        </div>
      </div>

      <!-- Clerk-authenticated user without an assigned role: show pending access message -->
      <div x-show="clerkPendingAccess">
        <h1 class="text-lg font-bold mb-1">Account pending access</h1>
        <p class="text-sm text-slate-500 mb-4">
          Hi <span x-text="window.__CLERK_USER__?.name || 'there'"></span>— you're signed in, but your account hasn't been granted a role yet.
          The Wash Depot administrator needs to invite you with the correct role and (for dealers) the right dealership.
        </p>
        <div class="bg-slate-50 rounded-lg p-3 text-xs text-slate-600 mb-4">
          <div class="font-semibold mb-1">Email on file</div>
          <div class="font-mono" x-text="window.__CLERK_USER__?.email"></div>
        </div>
        <p class="text-xs text-slate-400">Forward this email to your administrator if you need access.</p>
      </div>

      <!-- Standalone (no Clerk): show demo persona picker -->
      <div x-show="!clerkPendingAccess">
        <h1 class="text-lg font-bold mb-1">Sign in</h1>
        <p class="text-sm text-slate-500 mb-5">Choose a demo account to enter the platform.</p>

        <div class="space-y-2">
        <button @click="login({ role: 'staff', name: 'Marco — Owner', staffRole: 'owner' })" class="w-full text-left p-3 rounded-lg border border-slate-200 hover:bg-slate-50 flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-bold">M</div>
          <div class="flex-1">
            <div class="font-semibold text-sm">Marco — Owner / Super Admin</div>
            <div class="text-xs text-slate-500">Full access: ops, billing, AI insights, settings</div>
          </div>
          <span class="text-xs text-slate-400">Owner →</span>
        </button>
        <button @click="login({ role: 'staff', name: 'Janelle — Fleet Manager', staffRole: 'fleet' })" class="w-full text-left p-3 rounded-lg border border-slate-200 hover:bg-slate-50 flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold">J</div>
          <div class="flex-1">
            <div class="font-semibold text-sm">Janelle — Fleet Manager</div>
            <div class="text-xs text-slate-500">Manages vehicles, detailers, dealer comms (no billing)</div>
          </div>
          <span class="text-xs text-slate-400">Fleet →</span>
        </button>
        <div class="text-xs uppercase tracking-wider text-slate-400 pt-3 pb-1">Dealership portal</div>
        <template x-for="d in dealerships" :key="d.id">
          <button @click="login({ role: 'dealer', name: d.contacts[0].name + ' — ' + d.name, dealershipId: d.id })" class="w-full text-left p-3 rounded-lg border border-slate-200 hover:bg-slate-50 flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-white" :style="`background:${d.brandColor}`" x-text="d.name.split(' ').map(w=>w[0]).slice(0,2).join('')"></div>
            <div class="flex-1">
              <div class="font-semibold text-sm" x-text="d.contacts[0].name"></div>
              <div class="text-xs text-slate-500" x-text="d.name"></div>
            </div>
            <span class="text-xs text-slate-400">Dealer →</span>
          </button>
        </template>
      </div>

        <p class="text-[11px] text-slate-400 mt-5 leading-relaxed">
          Demo data is stored locally in your browser. Use <span class="kbd">⌘/Ctrl</span>+ <span class="kbd">K</span>to search anywhere in the app.
          Reset everything from Settings.
        </p>
      </div>
    </div>
  </div>
</template>

<!-- APP SHELL -->
<template x-if="session">
<div class="flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-60 flex-shrink-0 flex flex-col" style="background:#000; color:#fff;">
    <div class="px-4 pt-5 pb-4 flex flex-col items-center text-center" style="background:#000;">
      <div class="wd-logo-wrap w-24 h-24 rounded-full overflow-hidden flex-shrink-0" style="background:#000;">
        <img class="wd-logo-img w-full h-full object-contain" src="/wash-depot-logo.png?v=2" onerror="this.classList.add('failed')" alt="Wash Depot" />
        <svg class="wd-logo-svg w-full h-full" viewBox="0 0 200 200"><use href="#wd-logo"/></svg>
      </div>
      <div class="text-[10px] uppercase tracking-[0.18em] text-white/60 mt-2 font-bold" x-text="session.role === 'staff' ? 'Operations' : 'Dealer Portal'"></div>
    </div>

    <nav class="flex-1 overflow-y-auto p-2 text-sm space-y-0.5">
      <!-- Staff nav -->
      <template x-if="session.role === 'staff'">
        <div class="space-y-1">
          <!-- OVERVIEW (Owner only) -->
          <div x-show="isOwner">
            <button @click="toggleNavSection('overview')" class="w-full flex items-center justify-between px-3 pt-2 pb-1 hover:bg-white/5 rounded-md group">
              <span class="text-[10px] uppercase tracking-wider text-white/40 font-bold">Overview</span>
              <span class="text-white/30 text-[10px] transition-transform" :class="navOpen.overview ? '' : '-rotate-90'">▾</span>
            </button>
            <div x-show="navOpen.overview" class="space-y-0.5">
              <a @click.prevent="view='total'" :class="{'active': view==='total'}" class="nav-item flex items-center gap-2 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer">Business Overview</a>
              <a @click.prevent="view='insights'" :class="{'active': view==='insights'}" class="nav-item flex items-center gap-2 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer">AI Insights</a>
            </div>
          </div>

          <!-- DETAILING -->
          <div>
            <button @click="toggleNavSection('detailing')" class="w-full flex items-center justify-between px-3 pt-3 pb-1 hover:bg-white/5 rounded-md group">
              <span class="text-[10px] uppercase tracking-wider text-white/40 font-bold">Detailing</span>
              <span class="text-white/30 text-[10px] transition-transform" :class="navOpen.detailing ? '' : '-rotate-90'">▾</span>
            </button>
            <div x-show="navOpen.detailing" class="space-y-0.5">
              <a @click.prevent="view='dashboard'" :class="{'active': view==='dashboard'}" class="nav-item flex items-center gap-2 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer">Dashboard</a>
              <a @click.prevent="view='bookings'" :class="{'active': view==='bookings'}" class="nav-item flex items-center gap-2 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer">Bookings <span x-show="upcomingBookings.length>0" class="ml-auto bg-cyan-400 text-slate-900 text-[10px] px-1.5 rounded-full" x-text="upcomingBookings.length"></span></a>
              <a @click.prevent="view='intake'" :class="{'active': view==='intake'}" class="nav-item flex items-center gap-2 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer">New Intake</a>
              <a @click.prevent="view='board'" :class="{'active': view==='board'}" class="nav-item flex items-center gap-2 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer">Active Jobs</a>
              <a @click.prevent="view='vehicles'" :class="{'active': view==='vehicles'}" class="nav-item flex items-center gap-2 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer">All Vehicles</a>
              <a @click.prevent="view='dealerships'" :class="{'active': view==='dealerships'}" class="nav-item flex items-center gap-2 px-3 py-2 rounded-md hover:bg-white/10 cursor-pointer">Dealerships</a>

      </div>

  <!-- MAIN -->

        <div class="text-xs text-slate-500" x-text="formatDate(now, 'long')"></div>
      </div>

    <div class="p-6">

      <!-- ============================================ STAFF: DASHBOARD ============================================ -->

              <div class="text-xs text-slate-500 mt-1">vehicles being detailed</div>
            </div>
            <div class="card p-4">
              <div class="text-xs uppercase font-bold tracking-wider text-slate-500">Ready Today</div>

              <div class="text-xs text-slate-500 mt-1" x-text="kpis.completedToday + ' completed'"></div>
            </div>
            <div class="card p-4" x-show="!canSeePrices">
              <div class="text-xs uppercase font-bold tracking-wider text-slate-500">Completed Today</div>
              <div class="text-3xl font-black mt-1 text-teal-700" x-text="kpis.completedToday"></div>
              <div class="text-xs text-slate-500 mt-1">vehicles delivered</div>
            </div>
          </div>

          <div class="grid lg:grid-cols-3 gap-4 mb-6">
            <div class="card p-4 lg:col-span-2">

                    <div class="font-black text-xl" x-text="vehiclesByStatus(s.code).length"></div>
                    <div class="font-semibold mt-0.5" x-text="s.label"></div>
                  </div>
                </template>
              </div>
            </div>

            <div class="card p-4">
              <h3 class="font-bold mb-3">Alerts</h3>
              <div class="space-y-2 text-sm">

                  <div class="flex items-start gap-2 p-2 rounded-md" :class="a.level==='danger'?'bg-rose-50':'bg-amber-50'">
                    <div class="flex-1">
                      <div class="font-semibold text-xs" x-text="a.title"></div>
                      <div class="text-xs text-slate-600" x-text="a.body"></div>
                    </div>
                  </div>
                </template>
                <div x-show="alerts.length===0" class="text-xs text-slate-400 p-2">All good — no alerts. </div>
              </div>
            </div>
          </div>

          <div class="grid lg:grid-cols-2 gap-4">
            <div class="card p-4">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold">Today's intake</h3>
                <span class="text-xs text-slate-500" x-text="todaysIntake.length + ' vehicles'"></span>
              </div>
              <div class="text-xs space-y-2 max-h-72 overflow-y-auto">
                <template x-for="v in todaysIntake" :key="v.id">
                  <button @click="openVehicle(v.id)" class="w-full text-left flex items-center gap-3 p-2 rounded-md hover:bg-slate-50">
                    <div class="w-1 h-10 rounded-full" :style="`background:${dealershipById(v.dealershipId)?.brandColor}`"></div>
                    <div class="flex-1">
                      <div class="font-semibold" x-text="v.year + ' ' + v.make + ' ' + v.model"></div>
                      <div class="text-slate-500" x-text="dealershipById(v.dealershipId)?.name + ' · Stock #' + v.stockNumber"></div>
                    </div>
                    <span class="status-chip" :style="`background:${statusMeta(v.status).bg};color:${statusMeta(v.status).fg}`">
                      <span class="dot" :style="`background:${statusMeta(v.status).fg}`"></span>
                      <span x-text="statusMeta(v.status).label"></span>
                    </span>
                  </button>
                </template>
                <div x-show="todaysIntake.length===0" class="text-slate-400 p-4 text-center">No drop-offs yet today.</div>
              </div>

              </div>

                <template x-for="row in dealerActivity" :key="row.dealershipId">
                  <div class="flex items-center gap-3">
                    <div class="w-7 h-7 rounded-md flex items-center justify-center text-white font-bold text-[11px]" :style="`background:${row.brandColor}`" x-text="row.initials"></div>
                    <div class="flex-1">
                      <div class="flex justify-between">
                        <span class="font-semibold" x-text="row.name"></span>
                        <span x-text="row.count + ' active' + (canSeePrices ? ' · ' + money(row.openBalance) + ' open' : '')"></span>
                      </div>
                      <div class="h-1.5 bg-slate-100 rounded-full mt-1 overflow-hidden">
                        <div class="h-full" :style="`width:${row.pct}%; background:${row.brandColor}`"></div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ============================================ STAFF: BOOKINGS (calendar) ============================================ -->
      <template x-if="session.role==='staff' && view==='bookings'">
        <div>
          <div class="flex items-end justify-between mb-4">
            <div>
              <h1 class="text-2xl font-black tracking-tight">Bookings</h1>
              <p class="text-sm text-slate-500">
                <span x-text="filteredBookings.length"></span>of <span x-text="upcomingBookings.length"></span>upcoming
                <span x-show="bookingsFilterActive">· <button @click="resetBookingsFilter()" class="text-teal-700 hover:underline">Clear filters</button></span>
              </p>
            </div>
            <button @click="view='intake'" class="btn btn-primary">+ Manual Intake</button>
          </div>

          <!-- Filter bar -->
          <div class="card p-3 mb-5">
            <div class="grid grid-cols-1 md:grid-cols-6 gap-2 items-end">
              <div class="md:col-span-2">
                <label class="label text-[10px]">Search</label>
                <input class="input text-sm" x-model="bookingsFilter.search" placeholder="Stock #, plate, make/model, dealer…" />
              </div>
              <div>
                <label class="label text-[10px]">Dealership</label>
                <select class="select text-sm" x-model="bookingsFilter.dealershipId">
                  <option value="">All dealerships</option>
                  <template x-for="d in dealerships" :key="d.id"><option :value="d.id" x-text="d.name"></option></template>
                </select>
              </div>
              <div>
                <label class="label text-[10px]">Date</label>
                <select class="select text-sm" x-model="bookingsFilter.date">
                  <option value="all">Any date</option>
                  <option value="today">Today</option>
                  <option value="tomorrow">Tomorrow</option>
                  <option value="week">Next 7 days</option>
                  <option value="month">Next 30 days</option>
                </select>
              </div>
              <div>
                <label class="label text-[10px]">Status</label>
                <select class="select text-sm" x-model="bookingsFilter.confirm">
                  <option value="all">All</option>
                  <option value="confirmed">Confirmed</option>
                  <option value="pending">Pending</option>
                </select>
              </div>
              <div>
                <label class="label text-[10px]">Logistics</label>
                <select class="select text-sm" x-model="bookingsFilter.logistics">
                  <option value="all">All</option>
                  <option value="pickup">Dealer drops off</option>
                  <option value="delivery">WD picks up</option>
                </select>
              </div>
              <div>
                <label class="label text-[10px]">Time slot</label>
                <select class="select text-sm" x-model="bookingsFilter.timeSlot">
                  <option value="all">All slots</option>
                  <option value="morning">Morning</option>
                  <option value="afternoon">Afternoon</option>
                  <option value="anytime">Anytime</option>
                </select>
              </div>
              <div>
                <label class="label text-[10px]">Priority</label>
                <select class="select text-sm" x-model="bookingsFilter.priority">
                  <option value="all">All</option>
                  <option value="standard">Standard</option>
                  <option value="rush">Rush</option>
                  <option value="vip">VIP</option>
                </select>
              </div>
            </div>

          <div class="space-y-5">
            <template x-for="day in bookingsByDay" :key="day.date">
              <div>
                <div class="flex items-center gap-3 mb-3">
                  <h3 class="font-bold text-base" x-text="day.label"></h3>
                  <div class="flex-1 h-px bg-slate-200"></div>
                  <span class="text-xs text-slate-500" x-text="day.bookings.length + ' booking' + (day.bookings.length===1 ? '' : 's')"></span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  <template x-for="v in day.bookings" :key="v.id">

                      <div class="flex items-start gap-3 mb-2">
                        <div class="w-10 h-10 rounded-md flex items-center justify-center text-white text-xs font-bold flex-shrink-0" :style="`background:${dealershipById(v.dealershipId)?.brandColor || '#0f766e'}`" x-text="dealershipById(v.dealershipId)?.name?.split(' ').map(w=>w[0]).slice(0,2).join('') || '?'"></div>
                        <div class="flex-1 min-w-0">
                          <div class="text-xs font-semibold text-slate-500" x-text="dealershipById(v.dealershipId)?.name"></div>
                          <div class="font-bold text-sm" x-text="v.year + ' ' + v.make + ' ' + v.model"></div>
                          <div class="text-xs text-slate-500" x-text="'#' + v.stockNumber + ' · ' + v.color"></div>
                        </div>
                      </div>
                      <div class="bg-slate-50 rounded-md p-2 text-xs space-y-0.5 mb-3">

                        <div class="flex justify-between"><span class="text-slate-500">Logistics</span><span class="font-semibold" x-text="v.deliveryMethod==='pickup' ? 'Dealer drops off' : 'WD picks up'"></span></div>

                      <div x-show="v.notes" class="text-[11px] text-slate-600 italic mb-2 line-clamp-2" x-text="v.notes"></div>
                      <div class="flex gap-2">
                        <button x-show="!v.confirmed" @click="confirmBooking(v.id)" class="btn btn-primary text-xs flex-1">Confirm</button>
                        <button x-show="v.confirmed" disabled class="btn btn-outline text-xs flex-1 opacity-50 cursor-default">Confirmed</button>
                        <button @click="setStatus(v.id, 'dropped')" class="btn btn-outline text-xs">Check in</button>
                        <button @click="openVehicle(v.id)" class="btn btn-outline text-xs">⋯</button>
                      </div>

                </div>

          <form @submit.prevent="submitIntake()" class="card p-5 space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="label">Dealership *</label>
                <select class="select" x-model="intake.dealershipId" required @change="intake.services=[]">
                  <option value="">— Select —</option>
                  <template x-for="d in dealerships" :key="d.id">
                    <option :value="d.id" x-text="d.name"></option>
                  </template>
                </select>
              </div>
              <div>

                <input class="input" x-model="intake.stockNumber" placeholder="e.g. 24-A1023" />

            <div class="grid grid-cols-4 gap-3">
              <div>
                <label class="label">Year</label>
                <input class="input" x-model="intake.year" placeholder="2024" />
              </div>
              <div>
                <label class="label">Make *</label>
                <input class="input" x-model="intake.make" required placeholder="Toyota" />
              </div>
              <div>
                <label class="label">Model *</label>
                <input class="input" x-model="intake.model" required placeholder="Camry" />
              </div>
              <div>
                <label class="label">Color</label>
                <input class="input" x-model="intake.color" placeholder="Pearl White" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="label">VIN</label>
                <input class="input font-mono uppercase" x-model="intake.vin" maxlength="17" placeholder="1HGCM82633A123456" />
              </div>
              <div>
                <label class="label">License plate</label>
                <input class="input uppercase" x-model="intake.plate" />
              </div>
            </div>

            <div>
              <label class="label">Services *</label>
              <div x-show="!intake.dealershipId" class="text-xs text-slate-400 italic">Pick a dealership above to load their negotiated rates.</div>
              <div x-show="intake.dealershipId" class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <template x-for="rate in rateSheetFor(intake.dealershipId)" :key="rate.serviceId">
                  <label class="flex items-center justify-between gap-2 border border-slate-200 rounded-lg px-3 py-2 cursor-pointer hover:bg-slate-50" :class="{'bg-teal-50 border-teal-300': intake.services.includes(rate.serviceId)}">
                    <div class="flex items-center gap-2">
                      <input type="checkbox" :value="rate.serviceId" x-model="intake.services" />
                      <div>
                        <div class="text-sm font-semibold" x-text="rateLabel(rate)"></div>
                        <div class="text-[11px] text-slate-500" x-text="rateDescription(rate)"></div>
                      </div>
                    </div>
                    <span class="text-sm font-bold" x-show="canSeePrices" x-text="money(rate.price)"></span>
                  </label>
                </template>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="label">Promised by</label>
                <input type="datetime-local" class="input" x-model="intake.promisedTime" />
              </div>
              <div>
                <label class="label">Pickup or delivery</label>
                <select class="select" x-model="intake.deliveryMethod">
                  <option value="pickup">Customer picks up</option>
                  <option value="delivery">We deliver to dealer</option>
                </select>
              </div>
              <div>
                <label class="label">Priority</label>
                <select class="select" x-model="intake.priority">
                  <option value="standard">Standard</option>
                  <option value="rush">Rush</option>
                  <option value="vip">VIP</option>
                </select>
              </div>
            </div>

            <div>
              <label class="label">Notes / special instructions</label>
              <textarea class="textarea" rows="2" x-model="intake.notes" placeholder="Pet hair in trunk, customer requested odor treatment, leather seats need conditioning…"></textarea>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-100">

                <span class="text-slate-500">Estimated total: </span>

              <div class="flex gap-2">
                <button type="button" @click="resetIntake()" class="btn btn-outline">Reset</button>
                <button type="submit" class="btn btn-primary">Check in vehicle</button>
              </div>
            </div>
          </form>

          <div class="flex items-end justify-between mb-5">
            <div>
              <h1 class="text-2xl font-black tracking-tight">Active jobs</h1>
              <p class="text-sm text-slate-500">Drag-free workflow — click a card to open. Use the buttons to advance status.</p>
            </div>
            <div class="flex gap-2 items-center">
              <select class="select max-w-xs text-sm" x-model="boardFilter">
                <option value="">All dealerships</option>
                <template x-for="d in dealerships" :key="d.id"><option :value="d.id" x-text="d.name"></option></template>
              </select>
              <button @click="view='intake'" class="btn btn-primary">+ Intake</button>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 overflow-x-auto">
            <template x-for="s in STATUSES" :key="s.code">
              <div class="bg-slate-100 rounded-lg p-2 min-w-[180px]">
                <div class="flex items-center justify-between px-1 py-1">
                  <div class="flex items-center gap-1.5">
                    <span class="dot" :style="`background:${s.fg}`"></span>
                    <span class="font-bold text-xs uppercase tracking-wide" x-text="s.label"></span>
                  </div>
                  <span class="text-xs font-bold text-slate-500" x-text="boardVehicles(s.code).length"></span>
                </div>
                <div class="space-y-2 max-h-[68vh] overflow-y-auto pr-1">
                  <template x-for="v in boardVehicles(s.code)" :key="v.id">
                    <button @click="openVehicle(v.id)" class="w-full text-left bg-white border border-slate-200 rounded-md p-2 hover:shadow-sm">
                      <div class="flex items-center justify-between text-[10px] mb-1">
                        <span class="font-bold text-slate-600" x-text="dealershipById(v.dealershipId)?.name"></span>
                        <span x-show="v.priority!=='standard'" class="px-1.5 py-0.5 rounded uppercase font-bold" :class="v.priority==='rush'?'bg-amber-100 text-amber-800':'bg-rose-100 text-rose-800'" x-text="v.priority"></span>
                      </div>
                      <div class="text-sm font-bold" x-text="v.year + ' ' + v.make + ' ' + v.model"></div>
                      <div class="text-[11px] text-slate-500" x-text="'#' + v.stockNumber + ' · ' + v.color"></div>
                      <div class="flex items-center gap-1 mt-1">
                        <span class="text-[10px] text-slate-400" x-text="'Promised ' + relativeTime(v.promisedTime)"></span>
                        <span x-show="v.arrivalMethod==='dropoff'" class="ml-auto text-[10px]" title="Dealer dropped off"></span>
                        <span x-show="v.arrivalMethod==='pickup'" class="ml-auto text-[10px]" title="WD picked up"></span>
                      </div>
                    </button>
                  </template>
                  <div x-show="boardVehicles(s.code).length===0" class="text-[11px] text-slate-400 italic text-center py-3">empty</div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ============================================ STAFF: VEHICLES ============================================ -->
      <template x-if="session.role==='staff' && view==='vehicles'">
        <div>
          <div class="flex items-end justify-between mb-5">
            <div>
              <h1 class="text-2xl font-black tracking-tight">All Vehicles</h1>
              <p class="text-sm text-slate-500" x-text="vehicles.length + ' total · click any status box to drill in'"></p>
            </div>
            <div class="flex gap-2 items-center">
              <input class="input max-w-xs" x-model="vehicleSearch" placeholder="Search VIN, make, stock…" />
              <select class="select" x-show="vehicleStatusFilter" x-model="vehicleStatusFilter">
                <option value="">All statuses</option>
                <template x-for="s in STATUSES" :key="s.code"><option :value="s.code" x-text="s.label"></option></template>
              </select>
              <button x-show="vehicleStatusFilter" @click="vehicleStatusFilter=''" class="btn btn-outline text-sm">← All</button>
            </div>
          </div>

          <!-- Status overview boxes — only when no specific status is filtered -->
          <div x-show="!vehicleStatusFilter" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mb-5">
            <template x-for="s in STATUSES" :key="s.code">
              <button @click="vehicleStatusFilter = s.code" class="card p-4 text-left hover:shadow-lg hover:scale-[1.02] transition-all cursor-pointer relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-1" :style="`background:${s.fg}`"></div>
                <div class="flex items-center gap-2 mt-1 mb-2">
                  <span class="dot" :style="`background:${s.fg}; width:.5rem; height:.5rem`"></span>
                  <span class="text-xs uppercase font-bold tracking-wider text-slate-500" x-text="s.label"></span>
                </div>
                <div class="text-3xl font-black mt-1" x-text="vehiclesByStatus(s.code).length"></div>
                <div class="text-[11px] text-slate-500 mt-1" x-show="canSeePrices && s.code !== 'completed'" x-text="money(vehiclesByStatus(s.code).reduce((sum, v) =>sum + vehicleTotal(v), 0)) + ' value'"></div>
                <div class="text-[11px] mt-2 space-y-0.5">
                  <template x-if="s.code === 'scheduled'">
                    <div class="text-slate-500">
                      <span x-text="vehiclesByStatus(s.code).filter(v =>{ const d = new Date(v.dropOffTime); const today = new Date(); today.setHours(0,0,0,0); return d.getTime() >= today.getTime() && d.getTime() < today.getTime() + 86400000 }).length"></span>today
                      · <span x-text="vehiclesByStatus(s.code).filter(v =>{ const d = new Date(v.dropOffTime); const today = new Date(); today.setHours(0,0,0,0); return d.getTime() >= today.getTime() + 86400000 && d.getTime() < today.getTime() + 7*86400000 }).length"></span>this week
                    </div>
                  </template>
                  <template x-if="s.code === 'dropped' || s.code === 'queue' || s.code === 'service' || s.code === 'qc'">
                    <div class="text-slate-500" x-show="vehiclesByStatus(s.code).length">
                      <span x-text="vehiclesByStatus(s.code).filter(v=>isOverdue(v)).length"></span>overdue
                      <span x-show="vehiclesByStatus(s.code).filter(v=>v.priority==='rush' || v.priority==='vip').length">
                        · <span x-text="vehiclesByStatus(s.code).filter(v=>v.priority==='rush' || v.priority==='vip').length"></span>rush/VIP
                      </span>
                    </div>
                  </template>
                  <template x-if="s.code === 'ready'">
                    <div class="text-slate-500" x-show="vehiclesByStatus(s.code).length">
                      <span x-text="vehiclesByStatus(s.code).filter(v =>v.deliveryMethod === 'delivery').length"></span>to deliver
                      · <span x-text="vehiclesByStatus(s.code).filter(v =>v.deliveryMethod === 'pickup').length"></span>pickup
                    </div>
                  </template>
                  <template x-if="s.code === 'completed'">
                    <div class="text-slate-500" x-show="vehiclesByStatus(s.code).length">
                      <span x-text="vehiclesByStatus(s.code).filter(v=>{ const today = new Date(); today.setHours(0,0,0,0); return v.statusHistory?.some(h=>h.status==='completed' && new Date(h.at).getTime() >= today.getTime()) }).length"></span>today
                      · <span x-text="vehiclesByStatus(s.code).filter(v=>{ const week = Date.now()-7*86400000; return v.statusHistory?.some(h=>h.status==='completed' && new Date(h.at).getTime() >= week) }).length"></span>this week
                    </div>
                  </template>
                </div>
                <div class="text-[10px] text-slate-400 uppercase tracking-wider mt-3 group-hover:text-teal-700">View list →</div>
              </button>
            </template>
          </div>

          <!-- Filtered list — shown when a status is selected, OR all when search active -->
          <div x-show="vehicleStatusFilter || vehicleSearch">
            <div x-show="vehicleStatusFilter" class="flex items-center gap-2 mb-3">
              <span class="text-xs uppercase font-bold tracking-wider text-slate-500">Showing</span>
              <span class="status-chip" :style="`background:${statusMeta(vehicleStatusFilter).bg};color:${statusMeta(vehicleStatusFilter).fg}`">
                <span class="dot" :style="`background:${statusMeta(vehicleStatusFilter).fg}`"></span>
                <span x-text="statusMeta(vehicleStatusFilter).label"></span>
              </span>
              <span class="text-sm text-slate-500" x-text="'· ' + filteredVehicles.length + ' vehicles'"></span>
            </div>

          <div class="card overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 text-xs uppercase tracking-wider text-slate-500">
                <tr>
                  <th class="text-left p-3">Vehicle</th>
                  <th class="text-left p-3">Dealership</th>
                  <th class="text-left p-3">Stock #</th>
                  <th class="text-left p-3">Status</th>
                  <th class="text-left p-3">Arrival</th>
                  <th class="text-left p-3">Promised</th>
                  <th class="text-right p-3" x-show="canSeePrices">Total</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <template x-for="v in filteredVehicles" :key="v.id">
                  <tr class="hover:bg-slate-50 cursor-pointer" @click="openVehicle(v.id)">
                    <td class="p-3 font-semibold" x-text="v.year + ' ' + v.make + ' ' + v.model"></td>
                    <td class="p-3" x-text="dealershipById(v.dealershipId)?.name"></td>
                    <td class="p-3 font-mono text-xs" x-text="v.stockNumber"></td>
                    <td class="p-3">
                      <span class="status-chip" :style="`background:${statusMeta(v.status).bg};color:${statusMeta(v.status).fg}`">
                        <span class="dot" :style="`background:${statusMeta(v.status).fg}`"></span>
                        <span x-text="statusMeta(v.status).label"></span>
                      </span>
                    </td>
                    <td class="p-3 text-xs text-slate-500">
                      <span x-show="v.arrivalMethod==='dropoff'">Dropped off</span>
                      <span x-show="v.arrivalMethod==='pickup'">We picked up</span>
                      <span x-show="!v.arrivalMethod" x-text="formatDate(v.dropOffTime)"></span>
                    </td>
                    <td class="p-3 text-xs" :class="isOverdue(v) ? 'text-rose-600 font-semibold' : 'text-slate-500'" x-text="formatDate(v.promisedTime)"></td>
                    <td class="p-3 text-right font-semibold" x-show="canSeePrices" x-text="money(vehicleTotal(v))"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div x-show="filteredVehicles.length===0" class="p-8 text-center text-sm text-slate-400">No vehicles match.</div>
          </div>
          </div>
        </div>
      </template>

      <!-- ============================================ STAFF: DEALERSHIPS ============================================ -->
      <template x-if="session.role==='staff' && view==='dealerships'">
        <div>
          <div class="flex items-end justify-between mb-5">
            <h1 class="text-2xl font-black tracking-tight">Dealerships</h1>
            <button @click="openDealership('new')" class="btn btn-primary">+ Add Dealership</button>
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <template x-for="d in dealerships" :key="d.id">
              <div class="card p-4">
                <div class="flex items-start gap-3">
                  <div class="w-12 h-12 rounded-lg flex items-center justify-center text-white font-bold" :style="`background:${d.brandColor}`" x-text="d.name.split(' ').map(w=>w[0]).slice(0,2).join('')"></div>
                  <div class="flex-1">
                    <div class="font-bold" x-text="d.name"></div>
                    <div class="text-xs text-slate-500" x-text="d.address"></div>
                    <div class="flex flex-wrap gap-3 text-xs mt-2">
                      <span><b x-text="vehiclesForDealer(d.id).filter(v=>v.status!=='completed').length"></b>active</span>
                      <span><b x-text="vehiclesForDealer(d.id).length"></b>all-time</span>
                      <span class="text-rose-600" x-show="canSeePrices && dealerOpenBalance(d.id)>0"><b x-text="money(dealerOpenBalance(d.id))"></b>open</span>
                    </div>
                  </div>
                  <button @click="openDealership(d.id)" class="btn btn-outline text-xs">Open</button>
                </div>
                <div x-show="canSeePrices" class="mt-3 pt-3 border-t border-slate-100 text-xs">
                  <div class="font-semibold text-slate-600 mb-1 flex justify-between">
                    <span>Rate sheet (top 4 of <span x-text="d.rateSheet.length"></span>)</span>
                    <button @click.stop="view='settings'; settingsTab='pricing'; pricingExpanded[d.id]=true" class="text-teal-700 hover:underline">Edit prices →</button>
                  </div>
                  <div class="grid grid-cols-2 gap-1">
                    <template x-for="rate in d.rateSheet.slice(0,4)" :key="rate.serviceId">
                      <div class="flex justify-between">
                        <span class="text-slate-500" x-text="rateLabel(rate)"></span>
                        <span class="font-semibold" x-text="money(rate.price)"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ============================================ STAFF: BILLING ============================================ -->
      <template x-if="session.role==='staff' && view==='billing'">
        <div>
          <div class="flex items-end justify-between mb-5">
            <h1 class="text-2xl font-black tracking-tight">Billing</h1>
            <div class="flex gap-2">
              <button @click="generateStatements()" class="btn btn-outline">Generate weekly statements</button>
              <button @click="newInvoiceModal=true" class="btn btn-primary">+ New invoice</button>
            </div>
          </div>

          <div class="grid grid-cols-4 gap-3 mb-4">
            <div class="card p-4"><div class="text-xs uppercase font-bold text-slate-500">Outstanding</div><div class="text-2xl font-black mt-1 text-rose-600" x-text="money(billingTotals.outstanding)"></div></div>
            <div class="card p-4"><div class="text-xs uppercase font-bold text-slate-500">Overdue</div><div class="text-2xl font-black mt-1 text-amber-600" x-text="money(billingTotals.overdue)"></div></div>
            <div class="card p-4"><div class="text-xs uppercase font-bold text-slate-500">Paid (30d)</div><div class="text-2xl font-black mt-1 text-teal-700" x-text="money(billingTotals.paid30)"></div></div>
            <div class="card p-4"><div class="text-xs uppercase font-bold text-slate-500">Avg DSO</div><div class="text-2xl font-black mt-1" x-text="billingTotals.avgDso + 'd'"></div></div>
          </div>

          <div class="card overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 text-xs uppercase tracking-wider text-slate-500">
                <tr>
                  <th class="text-left p-3">Invoice #</th>
                  <th class="text-left p-3">Dealership</th>
                  <th class="text-left p-3">Issued</th>
                  <th class="text-left p-3">Due</th>
                  <th class="text-left p-3">Status</th>
                  <th class="text-right p-3">Total</th>
                  <th></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <template x-for="inv in sortedInvoices" :key="inv.id">
                  <tr class="hover:bg-slate-50">
                    <td class="p-3 font-mono text-xs" x-text="inv.number"></td>
                    <td class="p-3 font-semibold" x-text="dealershipById(inv.dealershipId)?.name"></td>
                    <td class="p-3 text-xs text-slate-500" x-text="formatDate(inv.issuedAt)"></td>
                    <td class="p-3 text-xs" :class="isInvoiceOverdue(inv)?'text-rose-600 font-semibold':''" x-text="formatDate(inv.dueAt)"></td>
                    <td class="p-3"><span class="status-chip" :style="invoiceChipStyle(inv)" x-text="invoiceStatusLabel(inv)"></span></td>
                    <td class="p-3 text-right font-bold" x-text="money(inv.total)"></td>
                    <td class="p-3 text-right">
                      <button @click="openInvoice(inv.id)" class="btn btn-outline text-xs">Open</button>
                      <button x-show="['pending_ach','pending_zelle','pending_check'].includes(inv.status)" @click="markInvoicePaid(inv.id)" class="btn btn-primary text-xs ml-1">Confirm receipt</button>
                      <button x-show="inv.status!=='paid' && !['pending_ach','pending_zelle','pending_check'].includes(inv.status)" @click="markInvoicePaid(inv.id)" class="btn btn-outline text-xs ml-1">Mark paid</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- ============================================ STAFF: NOTIFICATIONS ============================================ -->
      <template x-if="session.role==='staff' && view==='notifications'">
        <div>
          <div class="flex items-end justify-between mb-5">
            <div>
              <h1 class="text-2xl font-black tracking-tight">Notifications</h1>
              <p class="text-sm text-slate-500">Outbound communications log — email, SMS, in-app.</p>
            </div>
            <button @click="composeOpen=true" class="btn btn-primary">+ Send manual update</button>
          </div>
          <div class="card divide-y divide-slate-100">
            <template x-for="n in [...notifications].reverse()" :key="n.id">
              <div class="p-4 flex items-start gap-3">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-lg" :class="channelStyle(n.channel)" x-text="channelIcon(n.channel)"></div>
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <span class="font-semibold text-sm" x-text="dealershipById(n.dealershipId)?.name + ' — ' + n.subject"></span>
                    <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded" :class="channelTextStyle(n.channel)" x-text="n.channel"></span>
                    <span x-show="!n.delivered" class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">queued</span>
                  </div>
                  <p class="text-xs text-slate-600 mt-1" x-text="n.body"></p>
                  <div class="text-[10px] text-slate-400 mt-1" x-text="'to ' + n.to + ' · ' + relativeTime(n.sentAt)"></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ============================================ STAFF: REPORTS ============================================ -->
      <template x-if="session.role==='staff' && view==='reports'">
        <div x-data="{ get range(){ return $root.periodRange($root.reportPeriod); }, get curr(){ return $root.summarize($root.reportStream, this.range.start, this.range.end); }, get prev(){ return $root.summarize($root.reportStream, this.range.prevStart, this.range.prevEnd); } }">
          <div class="flex items-end justify-between mb-4">
            <div>
              <h1 class="text-2xl font-black tracking-tight">Reports</h1>
              <p class="text-sm text-slate-500" x-text="range.label + (reportCompare ? ' · vs ' + range.prevLabel : '')"></p>
            </div>
          </div>

          <!-- Period selector -->
          <div class="card p-3 mb-4 flex items-center gap-2 flex-wrap">
            <span class="text-xs uppercase tracking-wider font-bold text-slate-500 mr-2">Period</span>
            <template x-for="p in [
              { id:'today', l:'Today' },
              { id:'yesterday', l:'Yesterday' },
              { id:'thisWeek', l:'This week' },
              { id:'lastWeek', l:'Last week' },
              { id:'thisMonth', l:'This month' },
              { id:'lastMonth', l:'Last month' },
              { id:'thisQuarter', l:'This quarter' },
              { id:'lastQuarter', l:'Last quarter' },
              { id:'thisYear', l:'YTD' },
              { id:'lastYear', l:'Last year' },
              { id:'custom', l:'Custom' }
            ]" :key="p.id">
              <button @click="reportPeriod = p.id" :class="reportPeriod === p.id ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'" class="px-3 py-1.5 rounded-md text-xs font-semibold" x-text="p.l"></button>
            </template>
            <div class="ml-auto flex items-center gap-2">
              <label class="text-xs flex items-center gap-1 cursor-pointer">
                <input type="checkbox" x-model="reportCompare" />
                <span>Compare to previous period</span>
              </label>
            </div>
          </div>

          <!-- Custom range pickers -->
          <div x-show="reportPeriod==='custom'" class="card p-3 mb-4 flex gap-2 items-center">
            <label class="text-xs font-bold text-slate-500">From</label>
            <input type="date" class="input max-w-xs" x-model="reportCustomStart" />
            <label class="text-xs font-bold text-slate-500 ml-3">To</label>
            <input type="date" class="input max-w-xs" x-model="reportCustomEnd" />
          </div>

          <!-- Stream tabs -->
          <div class="card p-2 mb-4 flex gap-1">
            <button @click="reportStream='all'" :class="reportStream==='all' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'" class="px-3 py-1.5 rounded text-xs font-semibold flex-1">All Streams</button>
            <button @click="reportStream='detailing'" :class="reportStream==='detailing' ? 'bg-teal-600 text-white' : 'text-slate-600 hover:bg-slate-100'" class="px-3 py-1.5 rounded text-xs font-semibold flex-1">Detailing</button>
            <button @click="reportStream='wash'" :class="reportStream==='wash' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'" class="px-3 py-1.5 rounded text-xs font-semibold flex-1">Wash Line</button>
            <button @click="reportStream='retail'" :class="reportStream==='retail' ? 'bg-amber-600 text-white' : 'text-slate-600 hover:bg-slate-100'" class="px-3 py-1.5 rounded text-xs font-semibold flex-1">Retail</button>
          </div>

          <!-- KPI cards with delta -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            <div class="card p-4" x-show="canSeePrices">
              <div class="text-xs uppercase font-bold tracking-wider text-slate-500">Revenue</div>
              <div class="text-2xl font-black mt-1" x-text="money(curr.revenue)"></div>
              <div x-show="reportCompare" class="text-xs mt-1 flex items-center gap-1">
                <span :class="delta(curr.revenue, prev.revenue).dir==='up' ? 'text-emerald-600' : delta(curr.revenue, prev.revenue).dir==='down' ? 'text-rose-600' : 'text-slate-500'" class="font-semibold">
                  <span x-text="delta(curr.revenue, prev.revenue).dir==='up' ? '▲' : delta(curr.revenue, prev.revenue).dir==='down' ? '▼' : '–'"></span>
                  <span x-text="(delta(curr.revenue, prev.revenue).pct >= 0 ? '+' : '') + delta(curr.revenue, prev.revenue).pct + '%'"></span>
                </span>
                <span class="text-slate-400" x-text="'vs ' + money(prev.revenue)"></span>
              </div>
            </div>
            <div class="card p-4">
              <div class="text-xs uppercase font-bold tracking-wider text-slate-500">Transactions</div>
              <div class="text-2xl font-black mt-1" x-text="curr.count.toLocaleString()"></div>
              <div x-show="reportCompare" class="text-xs mt-1 flex items-center gap-1">
                <span :class="delta(curr.count, prev.count).dir==='up' ? 'text-emerald-600' : delta(curr.count, prev.count).dir==='down' ? 'text-rose-600' : 'text-slate-500'" class="font-semibold">
                  <span x-text="delta(curr.count, prev.count).dir==='up' ? '▲' : delta(curr.count, prev.count).dir==='down' ? '▼' : '–'"></span>
                  <span x-text="(delta(curr.count, prev.count).pct >= 0 ? '+' : '') + delta(curr.count, prev.count).pct + '%'"></span>
                </span>
                <span class="text-slate-400" x-text="'vs ' + prev.count.toLocaleString()"></span>
              </div>
            </div>
            <div class="card p-4" x-show="canSeePrices">
              <div class="text-xs uppercase font-bold tracking-wider text-slate-500">Avg ticket</div>

                    <input type="number" step="0.01" min="0" class="ab-input" x-model.number="productDrawer.cost" />

                    <div class="flex-1 min-w-0">
                      <div class="flex justify-between text-sm">
                        <span class="font-semibold" x-text="row.name"></span>
                        <span class="text-xs"><b x-text="row.count"></b>cars</span>
                      </div>

                      <div class="font-bold" x-text="d.name"></div>
                      <div class="text-xs text-slate-500" x-text="d.rateSheet.length + ' line items · Avg ' + money(d.rateSheet.reduce((s,r)=>s+r.price,0)/Math.max(1,d.rateSheet.length)) + ' · ' + d.paymentTerms"></div>

                                <span x-show="!rate.custom" x-text="money(serviceById(rate.serviceId)?.price || 0)"></span>
