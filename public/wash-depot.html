        if (profile === 'member') { visitCount = 12 + Math.floor(Math.random()*20); membership = { type:'unlimited', startedAt: now - (60+Math.random()*180)*86400000, expiresAt: now + (15+Math.random()*30)*86400000 }; tags.push('membership'); }
        else if (profile === 'vip') { visitCount = 20 + Math.floor(Math.random()*30); tags.push('vip','high-spender'); }
        else if (profile === 'gold') visitCount = 10 + Math.floor(Math.random()*15);
        else if (profile === 'silver') visitCount = 4 + Math.floor(Math.random()*5);
        else visitCount = 1 + Math.floor(Math.random()*3);

        // Generate visits historically
        const firstSeenAt = now - (Math.random()*180 + 30)*86400000;
        const customerVisits = [];
        for (let v = 0; v < visitCount; v++) {
          // Spread evenly over their tenure
          const at = firstSeenAt + (now - firstSeenAt) * (v / Math.max(1, visitCount));
          // Package distribution influenced by profile
          let pkgId;
          const r = Math.random();
          if (profile === 'vip') pkgId = r < 0.6 ? 'wp_ult' : 'wp_pre';
          else if (profile === 'member') pkgId = 'wp_unl'; // member uses subscription, no per-wash charge
          else if (profile === 'gold') pkgId = r < 0.5 ? 'wp_pre' : (r < 0.85 ? 'wp_ult' : 'wp_exp');
          else if (profile === 'silver') pkgId = r < 0.55 ? 'wp_exp' : 'wp_pre';

            packageId: pkgId, amount, source:'camera'
          });
        }
        totalSpend = customerVisits.reduce((s,v)=>s+v.amount,0) + (profile==='member' ? 35*Math.ceil(visitCount/8) : 0);
        if (Math.random() < 0.25) tags.push('tipper');
        if (veh[0] === 'Tesla') tags.push('tesla-owner');
        const lastSeenAt = customerVisits.length ? customerVisits[customerVisits.length-1].at : firstSeenAt;
        const favoritePackageId = customerVisits.length ? this._mostCommon(customerVisits.map(v=>v.packageId)) : null;

          email: Math.random()<0.4 ? '' : `${fn.toLowerCase()}.${ln.toLowerCase()}@example.com`,

          membership, tags,
          notes: profile === 'vip' ? [{ at: lastSeenAt, by:'Marco', text:'High tipper — always asks for Carlos. Prefers ceramic.' }] : (profile==='member' ? [{ at: lastSeenAt, by:'Janelle', text:'Member since renewal — push retail.' }] : []),
          favoritePackageId

        visits.push(...customerVisits);
      });
      this.customers = customers;
      this.visits = visits.sort((a,b)=>b.at-a.at);
      // Build live lane: 4 cars (mix tiers + 1 first-timer)
      const sample = this.customers.slice(0, 3); // 3 known customers
      const lane = sample.map((c,i)=>({
        id:'ll_'+Math.random().toString(36).slice(2,9), customerId: c.id, plate: c.plate,
        detectedAt: now - (i+1)*180000, status: ['detected','in-bay','finishing'][i] || 'detected'
      }));
      // Plus a brand-new customer (no record)
      const newPlate = plate();
      lane.push({ id:'ll_'+Math.random().toString(36).slice(2,9), customerId: null, plate: newPlate, detectedAt: now - 30000, status:'detected', isNew: true });
      this.liveLane = lane;
    },

    _mostCommon(arr){ const m={}; arr.forEach(x=>m[x]=(m[x]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]; },

    // Map a paint-color name (e.g. "Velocity Blue", "Pearl White") to a hex for
    // the LPR capture illustration + color swatch. Specific names checked first.

        ['onyx','#23272e'],['jet','#22262d'],['ebony','#22262d'],['solid black','#22262e'],['mythos','#23272e'],['black','#262a31'],
        ['silver','#c4c9cf'],['atomic','#c7ccd1'],['iridium','#c8cdd2'],['steel','#7c8794'],['modern steel','#7c8794'],['magnetic','#6b7280'],['graphite','#4b5563'],['gun','#5b6470'],['brooklyn','#6b7280'],['sting','#5b6470'],['sonic','#6b7280'],['grey','#9aa1a9'],['gray','#9aa1a9'],
        ['velocity','#2563eb'],['blue','#2563eb'],
        ['ruby','#b91c1c'],['diamond red','#c0231f'],['soul red','#c0231f'],['red','#dc2626'],

      this.washPackages = [
        { id:'wp_exp', name:'Express Wash', price: 12, description:'Quick exterior wash + spot-free rinse' },
        { id:'wp_pre', name:'Premium Wash', price: 18, description:'Express + tire shine + underbody' },

      ];
      this.retailProducts = [
        { id:'rp_coke', sku:'049000028911', name:'Coke 20oz', price: 2.50, cost: 1.10, category:'Drinks', stock: 48, reorderPoint: 24, description:'Coca-Cola 20oz bottle', supplier:'Coca-Cola Distrib.' },
        { id:'rp_water', sku:'012000001031', name:'Bottled Water 16oz', price: 1.50, cost: 0.45, category:'Drinks', stock: 96, reorderPoint: 48, description:'Spring water 16oz', supplier:'Niagara' },

        { id:'rp_gatorade', sku:'052000338829', name:'Gatorade 20oz', price: 3.00, cost: 1.35, category:'Drinks', stock: 36, reorderPoint: 24, description:'Gatorade Thirst Quencher 20oz', supplier:'PepsiCo' },

        { id:'rp_wipes', sku:'810081501122', name:'Microfiber Wipes', price: 4.00, cost: 1.40, category:'Essentials', stock: 22, reorderPoint: 12, description:'3-pack microfiber detail wipes', supplier:'Chemical Guys' },
        { id:'rp_fluid', sku:'041335404062', name:'Windshield Fluid 1gal', price: 8.00, cost: 3.20, category:'Auto Care', stock: 18, reorderPoint: 10, description:'-20°F bug-wash windshield fluid', supplier:'Prestone' },
        { id:'rp_tylenol', sku:'300450449108', name:'Tylenol Travel Pack', price: 4.00, cost: 1.55, category:'OTC', stock: 16, reorderPoint: 8, description:'Tylenol Extra Strength 2-pk', supplier:'McNeil' }
      ];
      // Generate 14 days of sales (today + 13 prior)
      const washSales = [], retailSales = [];
      const now = new Date();
      for (let dayOffset = 13; dayOffset >= 0; dayOffset--) {
        const day = new Date(now); day.setDate(day.getDate()-dayOffset); day.setHours(0,0,0,0);
        const dow = day.getDay();
        const isWeekend = dow === 0 || dow === 6;
        const isToday = dayOffset === 0;
        // Wash count: 50-110 weekday, 80-160 weekend
        const washCount = isWeekend ? 80 + Math.floor(Math.random()*80) : 50 + Math.floor(Math.random()*60);
        // If today, only count up to current hour
        const hourCutoff = isToday ? now.getHours() : 19;
        for (let i = 0; i < washCount; i++) {
          const hour = 7 + Math.floor(Math.random()*Math.max(1, hourCutoff-7+1));
          if (isToday && hour >now.getHours()) continue;
          const minute = Math.floor(Math.random()*60);
          const ts = new Date(day); ts.setHours(hour, minute, 0, 0);
          // Package distribution: 50% Express, 28% Premium, 14% Ultimate, 8% Unlimited
          const r = Math.random();
          let pkgId;
          if (r < 0.5) pkgId = 'wp_exp';
          else if (r < 0.78) pkgId = 'wp_pre';
          else if (r < 0.92) pkgId = 'wp_ult';
          else pkgId = 'wp_unl';
          const pkg = this.washPackages.find(p=>p.id===pkgId);
          washSales.push({ id:'ws_'+Math.random().toString(36).slice(2,9), at: ts.getTime(), packageId: pkgId, amount: pkg.price, source:'square' });
        }
        // Retail: 20-55 transactions per day
        const retailCount = 20 + Math.floor(Math.random()*35);
        for (let i = 0; i < retailCount; i++) {
          const hour = 8 + Math.floor(Math.random()*Math.max(1, hourCutoff-8+1));
          if (isToday && hour >now.getHours()) continue;
          const minute = Math.floor(Math.random()*60);

          retailSales.push({ id:'rs_'+Math.random().toString(36).slice(2,9), at: ts.getTime(), items, total, source:'square' });
        }
      }
      this.washSales = washSales.sort((a,b)=>b.at-a.at);
      this.retailSales = retailSales.sort((a,b)=>b.at-a.at);
    },

    /* ========= helpers ========= */
    money(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Math.round((n||0)*100)/100); },
    formatDate(t, mode='short'){
      if (!t) return '—';
      const d = new Date(t);
      if (mode==='long') return d.toLocaleString('en-US',{ weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
      return d.toLocaleString('en-US',{ month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    },
    relativeTime(t){
      if(!t) return '—';
      const diff = (new Date(t) - this.now)/1000;
      const abs = Math.abs(diff);
      const past = diff < 0;
      let val, unit;
      if (abs<60){ val=Math.round(abs); unit='s'; }
      else if (abs<3600){ val=Math.round(abs/60); unit='m'; }
      else if (abs<86400){ val=Math.round(abs/3600); unit='h'; }
      else { val=Math.round(abs/86400); unit='d'; }
      return past ? `${val}${unit} ago` : `in ${val}${unit}`;
    },
    statusMeta(code){ return this.STATUSES.find(s=>s.code===code) || this.STATUSES[0]; },
    statusOrder(code){ return this.STATUSES.findIndex(s=>s.code===code); },
    serviceById(id){ return this.services.find(s=>s.id===id); },
    dealershipById(id){ return this.dealerships.find(d=>d.id===id); },
    rateSheetFor(dId){ return this.dealershipById(dId)?.rateSheet || []; },
    rateLabel(rate){ return rate.custom ? rate.name : (this.serviceById(rate.serviceId)?.name || '(removed)'); },
    rateDescription(rate){ return rate.custom ? rate.description : (this.serviceById(rate.serviceId)?.description || ''); },
    vehiclesForDealer(dId){ return this.vehicles.filter(v=>v.dealershipId===dId); },
    vehiclesByStatus(code){ return this.vehicles.filter(v=>v.status===code); },
    vehicleServices(v){
      const sheet = this.rateSheetFor(v.dealershipId);
      return v.services.map(sid=>{
        const r = sheet.find(x=>x.serviceId===sid) || { price: 0 };
        const name = r.custom ? r.name : (this.serviceById(sid)?.name || '(removed)');
        return { serviceId: sid, name, price: r.price };
      });
    },
    vehicleTotal(v){ return this.vehicleServices(v).reduce((s,r)=>s+(r.price||0),0); },
    isOverdue(v){ return v.status!=='completed' && v.status!=='ready' && v.promisedTime && new Date(v.promisedTime) < this.now; },
    isInvoiceOverdue(inv){
      if (inv.status==='paid') return false;
      if (['pending_ach','pending_zelle','pending_check'].includes(inv.status)) return false;
      return new Date(inv.dueAt) < this.now;
    },
    invoiceStatusLabel(inv){
      if (inv.status==='paid') return 'Paid';
      if (inv.status==='pending_ach') return 'ACH Pending';
      if (inv.status==='pending_zelle') return 'Zelle Pending';
      if (inv.status==='pending_check') return 'Check Mailed';
      if (this.isInvoiceOverdue(inv)) return 'Overdue';
      return inv.status==='draft' ? 'Draft' : 'Outstanding';
    },
    invoiceChipStyle(inv){
      if (inv.status==='paid') return 'background:#dcfce7;color:#166534';
      if (['pending_ach','pending_zelle','pending_check'].includes(inv.status)) return 'background:#dbeafe;color:#1e40af';
      if (this.isInvoiceOverdue(inv)) return 'background:#fee2e2;color:#991b1b';
      return 'background:#fef3c7;color:#92400e';
    },
    channelIcon(c){ return ''; },
    channelStyle(c){ return c==='email'?'bg-blue-50 text-blue-700': c==='sms'?'bg-green-50 text-green-700' : 'bg-purple-50 text-purple-700'; },
    channelTextStyle(c){ return c==='email'?'bg-blue-100 text-blue-700': c==='sms'?'bg-green-100 text-green-700' : 'bg-purple-100 text-purple-700'; },

    /* ========= computed-ish ========= */
    get currentDealership(){ return this.session?.role==='dealer' ? this.dealershipById(this.session.dealershipId) : null; },
    get isOwner(){ return this.session?.role==='staff' && this.session?.staffRole==='owner'; },
    get isFleet(){ return this.session?.role==='staff' && this.session?.staffRole==='fleet'; },
    get canSeePrices(){
      if (!this.session) return false;
      if (this.session.role==='dealer') return true;
      return this.isOwner;
    },
    get unreadStaffCount(){
      // unread = status changes in last 24h that haven't been "acknowledged" — proxy: notifications not delivered
      return this.notifications.filter(n=>!n.delivered).length;
    },
    get unreadDealerCount(){
      if (!this.currentDealership) return 0;
      return this.notifications.filter(n=>n.dealershipId===this.currentDealership.id && !n.readByDealer).length;
    },
    get kpis(){
      const today = new Date(); today.setHours(0,0,0,0);
      const inHouse = this.vehicles.filter(v=>['dropped','queue','service','qc'].includes(v.status)).length;
      const ready = this.vehicles.filter(v=>v.status==='ready').length;
      const overdue = this.vehicles.filter(v=>this.isOverdue(v)).length;
      const completedToday = this.vehicles.filter(v=>v.status==='completed' && v.statusHistory.some(h=>h.status==='completed' && new Date(h.at)>=today));
      const revenueToday = completedToday.reduce((s,v)=>s+this.vehicleTotal(v),0);
      return { inHouse, ready, overdue, completedToday: completedToday.length, revenueToday };
    },
    get alerts(){
      const a = [];
      this.vehicles.filter(v=>this.isOverdue(v)).forEach(v=>{
        a.push({ id:'od_'+v.id, level:'danger', title:`Overdue: ${v.year} ${v.make} ${v.model}`, body:`${this.dealershipById(v.dealershipId)?.name} · promised ${this.relativeTime(v.promisedTime)}` });
      });
      if (this.canSeePrices) {
        this.invoices.filter(i=>this.isInvoiceOverdue(i)).forEach(i=>{
          a.push({ id:'inv_'+i.id, level:'warning', title:`Invoice overdue: ${i.number}`, body:`${this.dealershipById(i.dealershipId)?.name} · ${this.money(i.total)}` });
        });
      }
      return a.slice(0,8);
    },
    get todaysIntake(){
      const today = new Date(); today.setHours(0,0,0,0);
      return this.vehicles.filter(v=>new Date(v.dropOffTime) >= today && v.status!=='completed').sort((a,b)=>new Date(b.dropOffTime)-new Date(a.dropOffTime));
    },
    get dealerActivity(){
      const max = Math.max(1, ...this.dealerships.map(d=>this.vehiclesForDealer(d.id).filter(v=>v.status!=='completed').length));
      return this.dealerships.map(d=>{
        const count = this.vehiclesForDealer(d.id).filter(v=>v.status!=='completed').length;
        return {
          dealershipId: d.id, name: d.name, brandColor: d.brandColor,
          initials: d.name.split(' ').map(w=>w[0]).slice(0,2).join(''),
          count, openBalance: this.dealerOpenBalance(d.id), pct: (count/max)*100
        };
      });
    },
    get filteredVehicles(){
      const q = this.vehicleSearch.toLowerCase();
      return this.vehicles.filter(v=>{
        if (this.vehicleStatusFilter && v.status!==this.vehicleStatusFilter) return false;
        if (!q) return true;
        return [v.make, v.model, v.vin, v.stockNumber, v.color, v.year].join(' ').toLowerCase().includes(q);
      }).sort((a,b)=>new Date(b.dropOffTime)-new Date(a.dropOffTime));
    },
    get dealerActiveVehicles(){
      if (!this.currentDealership) return [];
      return this.vehicles.filter(v=>v.dealershipId===this.currentDealership.id && v.status!=='completed').sort((a,b)=>this.statusOrder(b.status)-this.statusOrder(a.status));
    },
    get dealerFilteredVehicles(){
      if (!this.currentDealership) return [];
      const q = this.vehicleSearch.toLowerCase();
      return this.vehicles.filter(v=>{
        if (v.dealershipId!==this.currentDealership.id) return false;
        if (this.vehicleStatusFilter && v.status!==this.vehicleStatusFilter) return false;
        if (!q) return true;
        return [v.make, v.model, v.vin, v.stockNumber, v.color, v.year].join(' ').toLowerCase().includes(q);
      }).sort((a,b)=>new Date(b.dropOffTime)-new Date(a.dropOffTime));
    },
    get dealerKpis(){
      if (!this.currentDealership) return {};
      const mine = this.vehiclesForDealer(this.currentDealership.id);
      const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
      return {
        inService: mine.filter(v=>['dropped','queue','service','qc'].includes(v.status)).length,
        ready: mine.filter(v=>v.status==='ready').length,
        monthCount: mine.filter(v=>new Date(v.dropOffTime) >= monthStart).length,
        openBalance: this.dealerOpenBalance(this.currentDealership.id)
      };
    },
    get dealerNotifications(){
      if (!this.currentDealership) return [];
      return this.notifications.filter(n=>n.dealershipId===this.currentDealership.id).sort((a,b)=>new Date(b.sentAt)-new Date(a.sentAt));
    },
    get dealerInvoices(){
      if (!this.currentDealership) return [];
      return this.invoices.filter(i=>i.dealershipId===this.currentDealership.id).sort((a,b)=>new Date(b.issuedAt)-new Date(a.issuedAt));
    },
    get sortedInvoices(){ return [...this.invoices].sort((a,b)=>new Date(b.issuedAt)-new Date(a.issuedAt)); },
    get billingTotals(){
      const outstanding = this.invoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+i.total,0);
      const overdue = this.invoices.filter(i=>this.isInvoiceOverdue(i)).reduce((s,i)=>s+i.total,0);
      const paid30 = this.invoices.filter(i=>i.status==='paid' && i.paidAt && (this.now - new Date(i.paidAt)) < 30*86400*1000).reduce((s,i)=>s+i.total,0);
      const paid = this.invoices.filter(i=>i.status==='paid' && i.paidAt);
      const avgDso = paid.length ? Math.round(paid.reduce((s,i)=>s + (new Date(i.paidAt) - new Date(i.issuedAt))/86400000, 0) / paid.length) : 0;
      return { outstanding, overdue, paid30, avgDso };
    },
    get last7Days(){
      const days = [];
      for (let i=6;i>=0;i--){
        const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
        const next = new Date(d); next.setDate(next.getDate()+1);
        const completed = this.vehicles.filter(v=>v.status==='completed' && v.statusHistory.some(h=>h.status==='completed' && new Date(h.at)>=d && new Date(h.at)<next));
        const revenue = completed.reduce((s,v)=>s+this.vehicleTotal(v),0);
        days.push({ date: d.getTime(), label: d.toLocaleDateString('en-US',{weekday:'short'}), revenue, count: completed.length });
      }
      const maxRev = Math.max(1, ...days.map(d=>d.revenue));
      const maxCnt = Math.max(1, ...days.map(d=>d.count));
      return days.map(d=>({ ...d, pct: (d.revenue/maxRev)*100, countPct: (d.count/maxCnt)*100 }));
    },
    get topDealers(){
      const cutoff = this.now - 90*86400*1000;
      const rows = this.dealerships.map(d=>{
        const vs = this.vehiclesForDealer(d.id).filter(v=>v.status==='completed' && new Date(v.dropOffTime)>=cutoff);
        const revenue = vs.reduce((s,v)=>s+this.vehicleTotal(v),0);
        return { id:d.id, name:d.name, brandColor:d.brandColor, count: vs.length, revenue };
      }).sort((a,b)=>this.canSeePrices ? (b.revenue-a.revenue) : (b.count-a.count));
      const maxRev = Math.max(1, ...rows.map(r=>r.revenue));
      const maxCnt = Math.max(1, ...rows.map(r=>r.count));
      return rows.map(r=>({ ...r, pct: (r.revenue/maxRev)*100, countPct: (r.count/maxCnt)*100 }));
    },
    get avgTurnaround(){
      const completed = this.vehicles.filter(v=>v.status==='completed');
      if (!completed.length) return { hours:0, mins:0, count:0 };
      const totalMs = completed.reduce((s,v)=>{
        const start = new Date(v.dropOffTime);
        const end = new Date(v.statusHistory.find(h=>h.status==='completed')?.at || v.dropOffTime);
        return s + (end - start);
      },0);
      const avg = totalMs / completed.length;
      return { hours: Math.floor(avg/3600000), mins: Math.floor((avg%3600000)/60000), count: completed.length };
    },
    get topServices(){
      const map = {};
      this.vehicles.filter(v=>v.status==='completed').forEach(v=>{
        const sheet = this.rateSheetFor(v.dealershipId);
        v.services.forEach(sid=>{
          const r = sheet.find(x=>x.serviceId===sid);
          map[sid] = map[sid] || { id:sid, name: this.serviceById(sid)?.name, count:0, revenue:0 };
          map[sid].count++; map[sid].revenue += (r?.price||0);
        });
      });
      return Object.values(map).sort((a,b)=>b.count-a.count).slice(0,6);
    },

    /* ========= Product management ========= */
    productBySku(sku){ if(!sku) return null; const s = String(sku).trim(); return this.retailProducts.find(p =>p.sku === s); },
    margin(p){ if (!p || !p.price) return 0; return ((p.price - (p.cost||0)) / p.price) * 100; },
    inventoryValue(p){ return (p.stock || 0) * (p.cost || 0); },
    get totalInventoryValue(){ return this.retailProducts.reduce((s,p)=>s+this.inventoryValue(p),0); },
    get lowStockProducts(){ return this.retailProducts.filter(p =>p.stock <= (p.reorderPoint || 0)); },

    openProductDrawer(idOrNew){
      if (idOrNew === 'new') {
        this.productDrawer = { id:null, sku:'', name:'', category:'Drinks', price:0, cost:0, stock:0, reorderPoint:10, description:'', supplier:'' };
      } else {
        const p = this.retailProducts.find(x=>x.id===idOrNew);
        if (p) this.productDrawer = JSON.parse(JSON.stringify(p));
      }
    },
    saveProduct(){
      const d = this.productDrawer;
      if (!d.name || !d.sku) { this.toast('Name and SKU required','warning'); return; }
      // SKU uniqueness
      if (this.retailProducts.some(p =>p.sku === d.sku && p.id !== d.id)) {
        this.toast('SKU already exists','warning'); return;
      }
      d.price = +d.price || 0;
      d.cost = +d.cost || 0;
      d.stock = +d.stock || 0;
      d.reorderPoint = +d.reorderPoint || 0;
      if (d.id) {
        const idx = this.retailProducts.findIndex(p=>p.id===d.id);
        this.retailProducts[idx] = d;
      } else {
        d.id = 'rp_'+Math.random().toString(36).slice(2,9);
        this.retailProducts.push(d);
      }
      this.persist();
      this.productDrawer = null;
      this.toast('Product saved');
    },
    deleteProduct(id){
      if (!confirm('Delete this product? Sales history is preserved.')) return;
      this.retailProducts = this.retailProducts.filter(p=>p.id!==id);
      this.persist();
      this.productDrawer = null;
      this.toast('Product removed');
    },
    adjustStock(id, delta){
      const p = this.retailProducts.find(x=>x.id===id); if(!p) return;
      p.stock = Math.max(0, (p.stock||0) + delta);
      this.persist();
    },
    setStock(id, value){
      const p = this.retailProducts.find(x=>x.id===id); if(!p) return;
      p.stock = Math.max(0, +value || 0);
      this.persist();
    },

    /* ========= SKU scan / receive inventory ========= */
    handleSkuScan(){
      const sku = (this.receiveSkuInput || '').trim();
      if (!sku) return;
      const p = this.productBySku(sku);
      if (!p) {
        if (confirm(`SKU "${sku}" not found in catalog. Add it as a new product?`)) {
          this.openProductDrawer('new');
          this.productDrawer.sku = sku;
        } else {
          this.toast('SKU not found','warning');
        }
        this.receiveSkuInput = '';
        return;
      }
      // Add to receive batch
      const existing = this.receiveBatch.find(b =>b.productId === p.id);
      const incrementBy = this.receiveQuickMode ? 1 : (parseInt(prompt(`Quantity received for ${p.name}?`, '1')) || 0);
      if (incrementBy <= 0) { this.receiveSkuInput=''; return; }
      if (existing) existing.qty += incrementBy;
      else this.receiveBatch.unshift({ productId: p.id, qty: incrementBy, sku: p.sku, name: p.name });
      this.receiveSkuInput = '';
    },
    addManualToBatch(productId){
      const p = this.retailProducts.find(x=>x.id===productId); if(!p) return;
      const existing = this.receiveBatch.find(b =>b.productId === p.id);
      if (existing) existing.qty += 1;
      else this.receiveBatch.unshift({ productId: p.id, qty: 1, sku: p.sku, name: p.name });
    },
    updateBatchQty(productId, qty){
      const b = this.receiveBatch.find(x=>x.productId===productId);
      if (b) b.qty = Math.max(0, +qty || 0);
    },
    removeFromBatch(productId){
      this.receiveBatch = this.receiveBatch.filter(b =>b.productId !== productId);
    },
    confirmReceipt(){
      if (!this.receiveBatch.length) { this.toast('Nothing to receive','warning'); return; }
      let totalUnits = 0, totalCost = 0;
      this.receiveBatch.forEach(b =>{
        const p = this.retailProducts.find(x=>x.id===b.productId);
        if (p) {
          p.stock = (p.stock||0) + b.qty;
          totalUnits += b.qty;
          totalCost += b.qty * (p.cost || 0);
        }
      });
      this.retailReceivings.unshift({
        id: 'rcv_'+Math.random().toString(36).slice(2,9),
        at: Date.now(),
        receivedBy: this.session?.name || 'Staff',
        items: this.receiveBatch.map(b =>({ productId:b.productId, sku:b.sku, name:b.name, qty:b.qty })),
        totalUnits, totalCost
      });
      this.receiveBatch = [];
      this.persist();
      this.toast(` Received ${totalUnits} unit${totalUnits===1?'':'s'} (${this.money(totalCost)} at cost)`);
    },

    /* ========= Reporting helpers ========= */
    periodRange(period){
      const now = new Date();
      const startOfDay = (d) =>{ const x = new Date(d); x.setHours(0,0,0,0); return x; };
      const endOfDay = (d) =>{ const x = new Date(d); x.setHours(23,59,59,999); return x; };
      const addDays = (d, n) =>{ const x = new Date(d); x.setDate(x.getDate()+n); return x; };
      const startOfWeek= (d) =>{ const x = startOfDay(d); x.setDate(x.getDate() - x.getDay()); return x; }; // Sun start
      const startOfMonth=(d) =>{ const x = startOfDay(d); x.setDate(1); return x; };
      const startOfQuarter=(d)=>{ const x = startOfMonth(d); x.setMonth(Math.floor(x.getMonth()/3)*3); return x; };
      const startOfYear= (d) =>{ const x = startOfMonth(d); x.setMonth(0); return x; };

      let start, end, label, prevStart, prevEnd, prevLabel, granularity;
      switch(period){
        case 'today': {
          start = startOfDay(now); end = endOfDay(now);
          prevStart = addDays(start,-1); prevEnd = addDays(end,-1);
          label = 'Today'; prevLabel = 'Yesterday'; granularity = 'hour';
          break;
        }
        case 'yesterday': {
          end = endOfDay(addDays(now,-1)); start = startOfDay(addDays(now,-1));
          prevStart = addDays(start,-1); prevEnd = addDays(end,-1);
          label = 'Yesterday'; prevLabel = '2 days ago'; granularity = 'hour';
          break;
        }
        case 'thisWeek': {
          start = startOfWeek(now); end = endOfDay(now);
          prevStart = addDays(start,-7); prevEnd = addDays(start,-1); prevEnd = endOfDay(prevEnd);
          label = 'This week'; prevLabel = 'Last week'; granularity = 'day';
          break;
        }
        case 'lastWeek': {
          end = endOfDay(addDays(startOfWeek(now), -1));
          start = addDays(end, -6); start = startOfDay(start);
          prevStart = addDays(start,-7); prevEnd = addDays(end,-7);
          label = 'Last week'; prevLabel = '2 weeks ago'; granularity = 'day';
          break;
        }
        case 'thisMonth': {
          start = startOfMonth(now); end = endOfDay(now);
          prevStart = startOfMonth(addDays(start,-1)); prevEnd = endOfDay(addDays(start,-1));
          label = now.toLocaleString('en-US',{month:'long', year:'numeric'}); prevLabel = 'Previous month'; granularity = 'day';
          break;
        }
        case 'lastMonth': {
          const lastMonthEnd = addDays(startOfMonth(now), -1);
          start = startOfMonth(lastMonthEnd); end = endOfDay(lastMonthEnd);
          prevStart = startOfMonth(addDays(start,-1)); prevEnd = endOfDay(addDays(start,-1));
          label = start.toLocaleString('en-US',{month:'long', year:'numeric'}); prevLabel = '2 months ago'; granularity = 'day';
          break;
        }
        case 'thisQuarter': {
          start = startOfQuarter(now); end = endOfDay(now);
          const prevQEnd = addDays(start,-1); prevStart = startOfQuarter(prevQEnd); prevEnd = endOfDay(prevQEnd);
          const q = Math.floor(now.getMonth()/3)+1;
          label = `Q${q} ${now.getFullYear()}`; prevLabel = 'Previous quarter'; granularity = 'week';
          break;
        }
        case 'lastQuarter': {
          end = endOfDay(addDays(startOfQuarter(now),-1)); start = startOfQuarter(end);
          prevStart = startOfQuarter(addDays(start,-1)); prevEnd = endOfDay(addDays(start,-1));
          const q = Math.floor(start.getMonth()/3)+1;
          label = `Q${q} ${start.getFullYear()}`; prevLabel = '2 quarters ago'; granularity = 'week';
          break;
        }
        case 'thisYear': {
          start = startOfYear(now); end = endOfDay(now);
          prevStart = startOfYear(addDays(start,-1)); prevEnd = endOfDay(addDays(start,-1));
          label = `${now.getFullYear()}`; prevLabel = `${now.getFullYear()-1}`; granularity = 'month';
          break;
        }
        case 'lastYear': {
          end = endOfDay(addDays(startOfYear(now),-1)); start = startOfYear(end);
          prevStart = startOfYear(addDays(start,-1)); prevEnd = endOfDay(addDays(start,-1));
          label = `${start.getFullYear()}`; prevLabel = `${start.getFullYear()-1}`; granularity = 'month';
          break;
        }
        case 'custom': {
          start = this.reportCustomStart ? startOfDay(new Date(this.reportCustomStart)) : addDays(now, -29);
          end = this.reportCustomEnd ? endOfDay(new Date(this.reportCustomEnd)) : endOfDay(now);
          if (start >end) { const tmp = start; start = end; end = tmp; }
          const days = Math.ceil((end-start)/86400000);
          prevEnd = addDays(start,-1); prevEnd = endOfDay(prevEnd);
          prevStart = addDays(prevEnd,-(days-1)); prevStart = startOfDay(prevStart);
          label = `${start.toLocaleDateString()} – ${end.toLocaleDateString()}`; prevLabel = 'Previous period';
          granularity = days <= 2 ? 'hour' : days <= 45 ? 'day' : days <= 120 ? 'week' : 'month';
          break;
        }
        default: { start = startOfMonth(now); end = endOfDay(now); prevStart = startOfMonth(addDays(start,-1)); prevEnd = endOfDay(addDays(start,-1)); label='This month'; prevLabel='Last month'; granularity='day'; }
      }
      return { start: start.getTime(), end: end.getTime(), label, prevStart: prevStart.getTime(), prevEnd: prevEnd.getTime(), prevLabel, granularity };
    },

    streamSales(stream, start, end){
      const out = [];
      if (stream === 'all' || stream === 'wash') {
        this.washSales.forEach(s =>{ if (s.at >= start && s.at <= end) out.push({ stream:'wash', at: s.at, amount: s.amount, count: 1, packageId: s.packageId }); });
      }
      if (stream === 'all' || stream === 'retail') {
        this.retailSales.forEach(s =>{ if (s.at >= start && s.at <= end) out.push({ stream:'retail', at: s.at, amount: s.total, count: 1, items: s.items }); });
      }
      if (stream === 'all' || stream === 'detailing') {
        this.vehicles.forEach(v =>{
          if (v.status !== 'completed') return;
          const completedEvent = v.statusHistory?.find(h=>h.status==='completed');
          const at = completedEvent ? new Date(completedEvent.at).getTime() : new Date(v.dropOffTime).getTime();
          if (at >= start && at <= end) out.push({ stream:'detailing', at, amount: this.vehicleTotal(v), count: 1, dealershipId: v.dealershipId, services: v.services });
        });
      }
      return out;
    },

    bucketKey(at, granularity){
      const d = new Date(at);
      if (granularity === 'hour') { d.setMinutes(0,0,0); return d.getTime(); }
      if (granularity === 'day') { d.setHours(0,0,0,0); return d.getTime(); }
      if (granularity === 'week') { d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); }
      if (granularity === 'month'){ d.setHours(0,0,0,0); d.setDate(1); return d.getTime(); }
      return d.getTime();
    },
    bucketLabel(ts, granularity){
      const d = new Date(ts);
      if (granularity === 'hour') return d.getHours() + ':00';
      if (granularity === 'day') return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
      if (granularity === 'week') return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
      if (granularity === 'month')return d.toLocaleString('en-US',{month:'short', year:'2-digit'});
      return '';
    },
    bucketsBetween(start, end, granularity){
      const out = [];
      let cursor = this.bucketKey(start, granularity);
      const last = this.bucketKey(end, granularity);
      while (cursor <= last) {
        out.push(cursor);
        const d = new Date(cursor);
        if (granularity === 'hour') d.setHours(d.getHours()+1);
        else if (granularity === 'day') d.setDate(d.getDate()+1);
        else if (granularity === 'week') d.setDate(d.getDate()+7);
        else if (granularity === 'month') d.setMonth(d.getMonth()+1);
        cursor = d.getTime();
        if (out.length >366) break; // safety
      }
      return out;
    },
    bucketed(stream, start, end, granularity){
      const sales = this.streamSales(stream, start, end);
      const buckets = {};
      this.bucketsBetween(start, end, granularity).forEach(b =>{
        buckets[b] = { ts:b, label: this.bucketLabel(b, granularity), count:0, revenue:0, byStream: { detailing:0, wash:0, retail:0 } };
      });
      sales.forEach(s =>{
        const k = this.bucketKey(s.at, granularity);
        if (!buckets[k]) buckets[k] = { ts:k, label:this.bucketLabel(k,granularity), count:0, revenue:0, byStream:{detailing:0,wash:0,retail:0} };
        buckets[k].count += s.count;
        buckets[k].revenue += s.amount;
        buckets[k].byStream[s.stream] += s.amount;
      });
      return Object.values(buckets).sort((a,b)=>a.ts-b.ts);
    },
    summarize(stream, start, end){
      const sales = this.streamSales(stream, start, end);
      const revenue = sales.reduce((s,x)=>s+x.amount,0);
      const count = sales.length;
      const byStream = { detailing:0, wash:0, retail:0 };
      sales.forEach(s =>byStream[s.stream] += s.amount);
      return { revenue, count, avg: count ? revenue/count : 0, byStream };
    },
    delta(curr, prev){
      if (!prev) return { pct: curr ? 100 : 0, dir: curr >0 ? 'up' : 'flat', diff: curr - prev };
      const pct = ((curr - prev) / prev) * 100;
      return { pct: Math.round(pct*10)/10, dir: pct >0.5 ? 'up' : pct < -0.5 ? 'down' : 'flat', diff: curr - prev };
    },

    breakdownByDealership(start, end){
      const map = {};
      this.vehicles.filter(v=>{
        if (v.status !== 'completed') return false;
        const ev = v.statusHistory?.find(h=>h.status==='completed');
        const at = ev ? new Date(ev.at).getTime() : new Date(v.dropOffTime).getTime();
        return at >= start && at <= end;
      }).forEach(v=>{
        const d = this.dealershipById(v.dealershipId);
        if (!d) return;
        map[d.id] = map[d.id] || { id:d.id, name:d.name, brandColor:d.brandColor, count:0, revenue:0 };
        map[d.id].count++;
        map[d.id].revenue += this.vehicleTotal(v);
      });
      return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
    },
    breakdownByWashPackage(start, end){
      const map = {};
      this.washPackages.forEach(p=>{ map[p.id] = { id:p.id, name:p.name, count:0, revenue:0 }; });
      this.washSales.filter(s=>s.at>=start && s.at<=end).forEach(s=>{
        if (!map[s.packageId]) map[s.packageId] = { id:s.packageId, name:s.packageId, count:0, revenue:0 };
        map[s.packageId].count++; map[s.packageId].revenue += s.amount;
      });
      return Object.values(map).filter(r=>r.count>0).sort((a,b)=>b.revenue-a.revenue);
    },
    breakdownByRetailCategory(start, end){
      const map = {};
      this.retailSales.filter(s=>s.at>=start && s.at<=end).forEach(s=>{
        s.items.forEach(it=>{
          const p = this.retailProductById(it.productId);
          if (!p) return;
          map[p.category] = map[p.category] || { name:p.category, count:0, revenue:0 };
          map[p.category].count += it.qty;
          map[p.category].revenue += it.lineTotal;
        });
      });
      return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
    },
    breakdownByService(start, end){
      const map = {};
      this.vehicles.filter(v=>{
        if (v.status !== 'completed') return false;
        const ev = v.statusHistory?.find(h=>h.status==='completed');
        const at = ev ? new Date(ev.at).getTime() : new Date(v.dropOffTime).getTime();
        return at >= start && at <= end;
      }).forEach(v=>{
        const sheet = this.rateSheetFor(v.dealershipId);
        v.services.forEach(sid=>{
          const r = sheet.find(x=>x.serviceId===sid);
          const name = r?.custom ? r.name : (this.serviceById(sid)?.name || sid);
          map[sid] = map[sid] || { id:sid, name, count:0, revenue:0 };
          map[sid].count++;
          map[sid].revenue += (r?.price||0);
        });
      });
      return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
    },

    /* ========= Bookings ========= */
    get upcomingBookings(){
      const now = Date.now();
      return this.vehicles
        .filter(v =>v.status === 'scheduled' && v.dropOffTime && v.dropOffTime >= now - 24*3600000)
        .sort((a,b)=>a.dropOffTime - b.dropOffTime);
    },
    get filteredBookings(){
      const f = this.bookingsFilter;
      const q = (f.search || '').toLowerCase().trim();
      const now = new Date(); now.setHours(0,0,0,0);
      const todayStart = now.getTime();
      const tomorrowStart = todayStart + 86400000;
      const weekEnd = todayStart + 7*86400000;
      const monthEnd = todayStart + 30*86400000;
      return this.upcomingBookings.filter(v =>{
        if (f.dealershipId && v.dealershipId !== f.dealershipId) return false;
        if (f.confirm === 'confirmed' && !v.confirmed) return false;
        if (f.confirm === 'pending' && v.confirmed) return false;
        if (f.logistics !== 'all' && (v.deliveryMethod || 'pickup') !== f.logistics) return false;
        if (f.timeSlot !== 'all' && v.timeSlot !== f.timeSlot) return false;
        if (f.priority !== 'all' && (v.priority || 'standard') !== f.priority) return false;
        if (f.date === 'today' && (v.dropOffTime < todayStart || v.dropOffTime >= tomorrowStart)) return false;
        if (f.date === 'tomorrow' && (v.dropOffTime < tomorrowStart || v.dropOffTime >= tomorrowStart + 86400000)) return false;
        if (f.date === 'week' && (v.dropOffTime < todayStart || v.dropOffTime >= weekEnd)) return false;
        if (f.date === 'month' && (v.dropOffTime < todayStart || v.dropOffTime >= monthEnd)) return false;
        if (q) {
          const blob = [
            v.year, v.make, v.model, v.color, v.stockNumber, v.vin, v.notes,
            this.dealershipById(v.dealershipId)?.name
          ].filter(Boolean).join(' ').toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    },
    resetBookingsFilter(){ this.bookingsFilter = { dealershipId:'', confirm:'all', logistics:'all', timeSlot:'all', priority:'all', date:'all', search:'' }; },
    get bookingsFilterActive(){
      const f = this.bookingsFilter;
      return !!(f.dealershipId || f.confirm!=='all' || f.logistics!=='all' || f.timeSlot!=='all' || f.priority!=='all' || f.date!=='all' || f.search);
    },
    get bookingsByDay(){
      const map = {};
      this.filteredBookings.forEach(v=>{
        const d = new Date(v.dropOffTime); d.setHours(0,0,0,0);
        const key = d.getTime();
        if (!map[key]) map[key] = { date: key, label: d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'}), bookings: [] };
        map[key].bookings.push(v);
      });
      return Object.values(map).sort((a,b)=>a.date-b.date);
    },
    get dealerBookings(){
      if (!this.currentDealership) return [];
      return this.vehicles
        .filter(v =>v.dealershipId === this.currentDealership.id)
        .sort((a,b)=>(b.dropOffTime||0) - (a.dropOffTime||0));
    },
    timeSlotLabel(slot){ return ({ morning:'Morning (8am-12pm)', afternoon:'Afternoon (12-5pm)', anytime:'Anytime' })[slot] || slot; },
    resetBooking(){
      this.booking = {
        dealershipId: this.currentDealership?.id || '',
        year:'', make:'', model:'', color:'',
        stockNumber:'', vin:'',
        services:[],
        date: new Date(Date.now()+86400000).toISOString().split('T')[0], // tomorrow default
        timeSlot:'morning',
        deliveryMethod:'pickup',
        notes:''
      };
    },
    submitBooking(){
      if (!this.booking.make || !this.booking.model || !this.booking.date) {
        this.toast('Vehicle and date are required','warning'); return;
      }
      const dealershipId = this.booking.dealershipId || this.currentDealership?.id;
      if (!dealershipId) { this.toast('No dealership','warning'); return; }
      // Build a vehicle record with status='scheduled'
      const dropOffMs = new Date(this.booking.date + 'T' + (this.booking.timeSlot==='morning' ? '09:00' : this.booking.timeSlot==='afternoon' ? '13:00' : '11:00')).getTime();
      const v = {
        id: 'veh_'+Math.random().toString(36).slice(2,9),
        dealershipId,
        year: this.booking.year, make: this.booking.make, model: this.booking.model, color: this.booking.color,
        vin: (this.booking.vin||'').toUpperCase(),
        stockNumber: this.booking.stockNumber || ('WD-'+Math.floor(Math.random()*9000+1000)),
        services: this.booking.services || [],
        status: 'scheduled',
        priority: 'standard',
        deliveryMethod: this.booking.deliveryMethod || 'pickup',
        timeSlot: this.booking.timeSlot,
        notes: this.booking.notes || '',
        dropOffTime: dropOffMs,
        promisedTime: dropOffMs + 6*3600000,
        statusHistory: [{ status:'scheduled', at: Date.now(), note: `Booked by ${this.session.name} for ${this.timeSlotLabel(this.booking.timeSlot)}` }]
      };
      this.vehicles.push(v);
      // Notify staff via in-app + email
      const dealer = this.dealershipById(dealershipId);
      this.notifications.push({
        id:'n_'+Math.random().toString(36).slice(2,9),
        dealershipId, channel:'inApp', to:'Wash Depot Ops',
        subject: `New booking — ${v.year} ${v.make} ${v.model} on ${new Date(dropOffMs).toLocaleDateString()}`,
        body: `${dealer?.name} booked a ${v.year} ${v.make} ${v.model} (#${v.stockNumber}) for ${this.timeSlotLabel(v.timeSlot)} on ${new Date(dropOffMs).toLocaleDateString()}. ${v.deliveryMethod==='pickup' ? 'They will drop off.' : 'Wash Depot to pick up.'}${v.notes ? ' Notes: '+v.notes : ''}`,
        sentAt: Date.now(), delivered:true, internal:true
      });
      // Confirmation back to dealer
      this.notifications.push({
        id:'n_'+Math.random().toString(36).slice(2,9),
        dealershipId, vehicleId: v.id, channel:'email',
        to: dealer?.contacts[0]?.email || '',
        subject: `Booking confirmed — ${v.year} ${v.make} ${v.model}`,
        body: `Your service has been booked for ${new Date(dropOffMs).toLocaleString()}. Stock #${v.stockNumber}. We'll send a reminder the morning of.`,
        sentAt: Date.now(), delivered:true, readByDealer:false
      });
      this.persist();
      this.toast('Booking confirmed for ' + new Date(dropOffMs).toLocaleDateString());
      this.view = (this.session.role === 'dealer') ? 'd-bookings' : 'bookings';
    },
    cancelBooking(vehicleId){
      if (!confirm('Cancel this booking?')) return;
      const v = this.vehicles.find(x=>x.id===vehicleId); if (!v) return;
      this.vehicles = this.vehicles.filter(x=>x.id!==vehicleId);
      this.persist();
      this.toast('Booking cancelled');
    },
    confirmBooking(vehicleId){
      const v = this.vehicles.find(x=>x.id===vehicleId); if (!v) return;
      v.statusHistory = v.statusHistory || [];
      v.statusHistory.push({ status:'scheduled', at: Date.now(), note: 'Confirmed by ' + this.session.name });
      v.confirmed = true;
      const dealer = this.dealershipById(v.dealershipId);
      this.notifications.push({
        id:'n_'+Math.random().toString(36).slice(2,9),
        dealershipId: v.dealershipId, vehicleId: v.id, channel:'email',
        to: dealer?.contacts[0]?.email || '',
        subject: `Booking confirmed — ${v.year} ${v.make} ${v.model}`,
        body: `Wash Depot has confirmed your booking for ${new Date(v.dropOffTime).toLocaleString()}.`,
        sentAt: Date.now(), delivered:true, readByDealer:false
      });
      this.persist();
      this.toast('Booking confirmed — dealer notified');
    },

    /* ========= CRM helpers ========= */
    customerById(id){ return this.customers.find(c=>c.id===id); },
    customerByPlate(plate){ if(!plate) return null; const p = plate.replace(/[\s-]/g,'').toUpperCase(); return this.customers.find(c=>c.plate.replace(/[\s-]/g,'').toUpperCase()===p); },
    customerName(c){ return c ? `${c.firstName||''} ${c.lastName||''}`.trim() || c.plate : 'Unknown'; },
    customerTier(c){
      if (!c) return 'new';
      if (c.tags?.includes('vip') || (c.totalSpend||0) >500) return 'vip';
      const v = c.visitCount || 0;
      if (v === 0) return 'new';
      const isMember = c.membership && new Date(c.membership.expiresAt) >Date.now();
      if (v >= 10 || isMember) return 'loyal';
      return 'regular';
    },
    tierLabel(t){ return ({ new:'First Time', regular:'Regular', loyal:'Loyal', vip:'VIP' })[t] || t; },
    customerVisits(customerId){ return this.visits.filter(v=>v.customerId===customerId).sort((a,b)=>b.at-a.at); },
    suggestUpsell(c){
      if (!c) return 'Welcome them with a $5 off Premium offer';
      const tier = this.customerTier(c);
      if (tier === 'member') return 'Push retail attach (drink + air freshener combo)';
      if (tier === 'vip') return 'Offer ceramic coating add-on';
      if (tier === 'gold') return 'Pitch the Unlimited Membership ($35/mo, breaks even at 2 washes)';
      if (tier === 'silver') return 'Upsell from Express to Premium ($6 more, double protection)';
      if (tier === 'bronze') return 'Mention the loyalty perks at 10 washes';
      return 'First visit — recommend Premium Wash to set the bar';
    },
    customerLastVisit(c){ const last = this.customerVisits(c.id)[0]; return last ? `${this.washPackageById(last.packageId)?.name || ''} · ${this.relativeTime(last.at)}` : '—'; },

    get filteredCustomers(){
      const q = (this.customerSearch||'').toLowerCase();
      return this.customers.filter(c=>{
        if (this.customerTierFilter && this.customerTier(c) !== this.customerTierFilter) return false;
        if (!q) return true;
        return [c.firstName, c.lastName, c.plate, c.vehicleMake, c.vehicleModel, c.email, c.phone].join(' ').toLowerCase().includes(q);
      }).sort((a,b)=>b.lastSeenAt - a.lastSeenAt);
    },
    get crmStats(){
      const total = this.customers.length;
      const tierCount = { new:0, regular:0, loyal:0, vip:0 };
      this.customers.forEach(c=>{ tierCount[this.customerTier(c)]++; });
      const totalSpend = this.customers.reduce((s,c)=>s+(c.totalSpend||0),0);
      const totalVisits = this.customers.reduce((s,c)=>s+(c.visitCount||0),0);
      return { total, tierCount, totalSpend, avgSpend: total ? totalSpend/total : 0, totalVisits, avgVisits: total ? totalVisits/total : 0 };
    },
    get activeCustomer(){ return this.customerById(this.activeCustomerId); },
    get activeCustomerVisits(){ return this.activeCustomer ? this.customerVisits(this.activeCustomer.id) : []; },

    openCustomer(id){ this.activeCustomerId = id; },
    openNewCustomerDrawer(){
      this.newCustomerDrawer = {
        firstName:'', lastName:'',
        email:'', phone:'',
        plate:'', vehicleYear:'', vehicleMake:'', vehicleModel:'', vehicleColor:'',
        tagsCSV:'', initialNote:'',
        membershipActive:false, membershipMonths:1
      };
    },
    saveNewCustomer(){
      const d = this.newCustomerDrawer;
      if (!d.firstName?.trim()) { this.toast('First name is required','warning'); return; }
      if (!d.plate?.trim() && !d.phone?.trim() && !d.email?.trim()) { this.toast('Add a license plate, phone, or email so we can identify them','warning'); return; }
      // Duplicate detection by plate / phone / email
      const np = (d.phone||'').replace(/\D/g,'');
      const ne = (d.email||'').toLowerCase().trim();
      const npl = (d.plate||'').replace(/[\s-]/g,'').toUpperCase();
      const dup = this.customers.find(c =>
        (np && (c.phone||'').replace(/\D/g,'')===np) ||
        (ne && (c.email||'').toLowerCase()===ne) ||
        (npl && (c.plate||'').replace(/[\s-]/g,'').toUpperCase()===npl)
      );
      if (dup) {
        if (!confirm(`A customer with this ${npl && (dup.plate||'').replace(/[\s-]/g,'').toUpperCase()===npl ? 'plate' : ne && (dup.email||'').toLowerCase()===ne ? 'email' : 'phone'} already exists (${this.customerName(dup)}). Open their record instead?`)) return;
        this.newCustomerDrawer = null;
        this.openCustomer(dup.id);
        return;
      }
      const now = Date.now();
      const tags = ['manual', ...(d.tagsCSV||'').split(',').map(t=>t.trim()).filter(Boolean)];
      const customer = {
        id: 'cust_'+Math.random().toString(36).slice(2,11),
        firstName: d.firstName.trim(),
        lastName: (d.lastName||'').trim(),
        email: (d.email||'').trim(),
        phone: (d.phone||'').trim(),
        plate: (d.plate||'').trim().toUpperCase(),
        vehicleYear: (d.vehicleYear||'').trim(),
        vehicleMake: (d.vehicleMake||'').trim(),
        vehicleModel: (d.vehicleModel||'').trim(),
        vehicleColor: (d.vehicleColor||'').trim(),
        visitCount: 0,
        totalSpend: 0,
        firstSeenAt: now,
        lastSeenAt: now,
        membership: d.membershipActive ? { type:'unlimited', startedAt: now, expiresAt: now + (d.membershipMonths||1)*30*86400000 } : null,
        tags,
        notes: [
          { at: now, by: this.session?.name || 'Staff', text: 'Manually added to CRM' },
          ...(d.initialNote?.trim() ? [{ at: now, by: this.session?.name || 'Staff', text: d.initialNote.trim() }] : [])
        ],
        gifts: [],
        favoritePackageId: null,
        notificationPrefs: { sms: !!d.phone, push:false, email: !!d.email },
        signupSource: 'manual'
      };
      this.customers.push(customer);
      this.persist();
      this.newCustomerDrawer = null;
      this.toast('Customer added');
      this.openCustomer(customer.id);
    },
    addCustomerNote(id, text){
      const c = this.customerById(id); if (!c || !text?.trim()) return;
      c.notes = c.notes || [];
      c.notes.unshift({ at: Date.now(), by: this.session.name.split(' ')[0], text: text.trim() });
      this.persist();
      this.toast('Note added');
    },
    toggleTag(id, tag){
      const c = this.customerById(id); if (!c) return;
      c.tags = c.tags || [];
      const i = c.tags.indexOf(tag);
      if (i >= 0) c.tags.splice(i,1); else c.tags.push(tag);
      this.persist();
    },
    updateCustomer(id, patch){
      const c = this.customerById(id); if (!c) return;
      Object.assign(c, patch);
      this.persist();
      this.toast('Customer updated');
    },

    simulatePlateScan(){
      // 70% chance to scan an existing customer, 30% brand new
      const newCustomer = Math.random() < 0.3 || this.customers.length < 5;
      if (newCustomer) {
        const letters = 'ABCDEFGHJKLMNPRSTUVWXYZ';
        const nums = '0123456789';
        const plate = Array.from({length:3},()=>letters[Math.floor(Math.random()*letters.length)]).join('') + '-' +
                      Array.from({length:4},()=>nums[Math.floor(Math.random()*nums.length)]).join('');
        // ensure unique
        if (this.customerByPlate(plate)) return this.simulatePlateScan();
        this.liveLane.unshift({ id:'ll_'+Math.random().toString(36).slice(2,9), customerId:null, plate, detectedAt: Date.now(), status:'detected', isNew:true });
        this.toast(` New customer detected: ${plate}`);
      } else {
        const c = this.customers[Math.floor(Math.random()*this.customers.length)];
        // skip if already in lane
        if (this.liveLane.some(x=>x.customerId===c.id)) return this.simulatePlateScan();
        this.liveLane.unshift({ id:'ll_'+Math.random().toString(36).slice(2,9), customerId:c.id, plate:c.plate, detectedAt: Date.now(), status:'detected' });
        this.toast(` Recognized: ${this.customerName(c)} (${this.tierLabel(this.customerTier(c))})`);
      }
      // Cap lane at 6
      this.liveLane = this.liveLane.slice(0, 6);
      this.cameraConfig.lastDetectionAt = Date.now();
      this.persist();
    },

    advanceLane(laneId){
      const idx = this.liveLane.findIndex(l=>l.id===laneId); if (idx < 0) return;
      const l = this.liveLane[idx];
      const flow = ['detected','in-bay','finishing','done'];
      const next = flow[Math.min(flow.length-1, flow.indexOf(l.status)+1)];
      if (next === 'done') {
        // Record visit and remove from lane
        this.completeLaneVisit(laneId, l.assignedPackageId || 'wp_pre');
      } else {
        l.status = next;
        this.persist();
      }
    },
    completeLaneVisit(laneId, packageId){
      const idx = this.liveLane.findIndex(l=>l.id===laneId); if (idx < 0) return;
      const l = this.liveLane[idx];
      let customer = l.customerId ? this.customerById(l.customerId) : null;
      // Create new customer if needed
      if (!customer) {
        customer = {
          id: 'cust_'+Math.random().toString(36).slice(2,9),
          plate: l.plate,
          vehicleMake:'', vehicleModel:'', vehicleColor:'',
          firstName:'', lastName:'', phone:'', email:'',
          firstSeenAt: l.detectedAt, lastSeenAt: Date.now(), visitCount:0, totalSpend:0,
          membership:null, tags:['first-time'], notes:[], favoritePackageId: packageId
        };
        this.customers.push(customer);
      }
      const pkg = this.washPackageById(packageId) || { id:'wp_pre', price: 18 };
      const isMember = customer.membership && new Date(customer.membership.expiresAt) >Date.now();
      const amount = isMember ? 0 : (pkg.price || 0);
      const visit = {
        id:'v_'+Math.random().toString(36).slice(2,9),
        customerId: customer.id, plate: l.plate, at: Date.now(),
        packageId: pkg.id, amount, source:'camera'
      };
      this.visits.unshift(visit);
      // Also record in washSales for revenue rollup
      this.washSales.unshift({ id:'ws_'+Math.random().toString(36).slice(2,9), at: Date.now(), packageId: pkg.id, amount, source:'camera' });
      customer.visitCount = (customer.visitCount||0) + 1;
      customer.totalSpend = (customer.totalSpend||0) + amount;
      customer.lastSeenAt = Date.now();
      customer.favoritePackageId = pkg.id;
      this.liveLane.splice(idx, 1);
      this.persist();
      this.toast(` Visit logged: ${this.customerName(customer)} — ${pkg.name}`);
    },
    removeFromLane(laneId){
      this.liveLane = this.liveLane.filter(l=>l.id!==laneId);
      this.persist();
    },
    setLanePackage(laneId, packageId){
      const l = this.liveLane.find(x=>x.id===laneId); if (!l) return;
      l.assignedPackageId = packageId;
      this.persist();
    },

    toggleAutoScan(){
      this.autoScan = !this.autoScan;
      if (this.autoScan) {
        this.autoScanTimer = setInterval(()=>{ if (this.liveLane.length < 5) this.simulatePlateScan(); }, 8000);
        this.toast('Auto-scan ON — simulating camera detections every 8s');
      } else {
        clearInterval(this.autoScanTimer);
        this.toast('Auto-scan OFF');
      }
    },

    /* ========= Gift / Promotions ========= */
    promotionById(id){ return this.promotions.find(p=>p.id===id); },
    openGiftModal(customerId, plate){
      const c = customerId ? this.customerById(customerId) : null;
      this.giftModal = {
        open: true,
        customerId,
        plate: plate || c?.plate || '',
        email: c?.email || '',
        phone: c?.phone || '',
        promoId: 'promo_5off',
        channel: c?.email ? 'email' : 'sms',
        message: ''
      };
    },
    sendGift(){
      const g = this.giftModal;
      const promo = this.promotionById(g.promoId);
      if (!promo) { this.toast('Pick a promotion','warning'); return; }
      if (g.channel === 'email' && !g.email) { this.toast('Email required for email channel','warning'); return; }
      if (g.channel === 'sms' && !g.phone) { this.toast('Phone required for SMS channel','warning'); return; }

      // Resolve / create customer
      let customer = g.customerId ? this.customerById(g.customerId) : null;
      if (!customer) {
        customer = {
          id: 'cust_'+Math.random().toString(36).slice(2,9),
          plate: g.plate || '',
          vehicleMake:'', vehicleModel:'', vehicleColor:'',
          firstName:'', lastName:'',
          email: g.email, phone: g.phone,
          firstSeenAt: Date.now(), lastSeenAt: Date.now(), visitCount:0, totalSpend:0,
          membership:null, tags:['first-time','received-gift'], notes:[], favoritePackageId:null,
          gifts:[]
        };
        this.customers.push(customer);
      } else {
        if (g.email) customer.email = g.email;
        if (g.phone) customer.phone = g.phone;
      }
      customer.gifts = customer.gifts || [];
      customer.gifts.unshift({
        id: 'gift_'+Math.random().toString(36).slice(2,9),
        promoId: promo.id,
        code: promo.code,
        sentAt: Date.now(),
        sentVia: g.channel,
        expiresAt: Date.now() + promo.expiresInDays*86400000,
        redeemed: false,
        message: g.message
      });
      // Append a note for the team
      customer.notes = customer.notes || [];
      customer.notes.unshift({ at: Date.now(), by: this.session?.name || 'Staff', text: `Sent gift "${promo.name}" via ${g.channel.toUpperCase()} (code ${promo.code})` });

      // Notification record (audit)
      this.notifications.push({
        id:'n_'+Math.random().toString(36).slice(2,9),
        dealershipId: '',
        channel: g.channel,
        to: g.channel === 'email' ? g.email : g.phone,
        subject: ` ${promo.name} — Wash Depot`,
        body: `Hi${customer.firstName ? ' ' + customer.firstName : ''}, thanks for being part of the Wash Depot family! ${promo.name} — show this code at your next visit: ${promo.code}. ${g.message || ''} Expires ${new Date(Date.now() + promo.expiresInDays*86400000).toLocaleDateString()}.`,
        sentAt: Date.now(), delivered: true, readByDealer: false, internal: false
      });

      this.giftModal = { open:false, customerId:null, plate:'', email:'', phone:'', promoId:'promo_5off', channel:'email', message:'' };
      this.persist();
      this.toast(` Sent "${promo.name}" via ${g.channel}`);
    },
    redeemGift(customerId, giftId){
      const c = this.customerById(customerId); if (!c) return;
      const g = c.gifts?.find(x=>x.id===giftId); if (!g) return;
      g.redeemed = true; g.redeemedAt = Date.now();
      this.persist();
      this.toast('Gift redeemed');
    },

    /* ========= Customer-facing mobile app helpers ========= */
    get appCustomer(){
      if (this.customerApp.selectedCustomerId) return this.customerById(this.customerApp.selectedCustomerId);
      // default to a Loyal-tier customer for demo
      return this.customers.find(c =>this.customerTier(c) === 'loyal') || this.customers[0];
    },
    get appCustomerVisits(){ return this.appCustomer ? this.customerVisits(this.appCustomer.id) : []; },
    get appLoyaltyProgress(){
      const c = this.appCustomer;
      if (!c) return { count:0, target:10, percent:0, remaining:10 };
      const target = 10;
      const count = (c.visitCount||0) % target;
      const completedCycles = Math.floor((c.visitCount||0) / target);
      return { count, target, percent: (count/target)*100, remaining: target - count, completedCycles };
    },
    get appActiveGifts(){
      const c = this.appCustomer;
      if (!c?.gifts) return [];
      return c.gifts.filter(g =>!g.redeemed && g.expiresAt >Date.now());
    },
    get appQueueWait(){
      const cars = this.liveLane.length;
      const avgPerCar = 4; // minutes per car
      return { cars, mins: cars * avgPerCar };
    },
    toggleAppAlert(){
      this.customerApp.alertEnabled = !this.customerApp.alertEnabled;
      if (this.customerApp.alertEnabled) {
        this.toast(` Alert set — we'll ${this.customerApp.alertChannel==='sms' ? 'text' : 'push notify'} you when wait drops to ${this.customerApp.alertThreshold} cars or fewer`);
      } else {
        this.toast('Alert turned off');
      }
    },

    /* ========= Wash & Retail helpers ========= */
    washPackageById(id){ return this.washPackages.find(p=>p.id===id); },
    retailProductById(id){ return this.retailProducts.find(p=>p.id===id); },
    isToday(ts){ const d = new Date(ts); const t = new Date(); return d.toDateString() === t.toDateString(); },
    get washTodayCount(){ return this.washSales.filter(s=>this.isToday(s.at)).length; },
    get washTodayRevenue(){ return this.washSales.filter(s=>this.isToday(s.at)).reduce((s,x)=>s+x.amount,0); },
    get retailTodayCount(){ return this.retailSales.filter(s=>this.isToday(s.at)).length; },
    get retailTodayRevenue(){ return this.retailSales.filter(s=>this.isToday(s.at)).reduce((s,x)=>s+x.total,0); },
    get detailingTodayRevenue(){
      const today = new Date(); today.setHours(0,0,0,0);
      return this.vehicles.filter(v=>v.status==='completed' && v.statusHistory.some(h=>h.status==='completed' && new Date(h.at)>=today)).reduce((s,v)=>s+this.vehicleTotal(v),0);
    },
    get totalTodayRevenue(){ return this.washTodayRevenue + this.retailTodayRevenue + this.detailingTodayRevenue; },

    last14DaysWash(){
      const days = [];
      for (let i=13; i>=0; i--){
        const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
        const next = new Date(d); next.setDate(next.getDate()+1);
        const sales = this.washSales.filter(s=>s.at>=d.getTime() && s.at<next.getTime());
        days.push({ date:d.getTime(), label: d.toLocaleDateString('en-US',{weekday:'short'}), count: sales.length, revenue: sales.reduce((s,x)=>s+x.amount,0) });
      }
      return days;
    },
    last14DaysRetail(){
      const days = [];
      for (let i=13; i>=0; i--){
        const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
        const next = new Date(d); next.setDate(next.getDate()+1);
        const sales = this.retailSales.filter(s=>s.at>=d.getTime() && s.at<next.getTime());
        days.push({ date:d.getTime(), label: d.toLocaleDateString('en-US',{weekday:'short'}), count: sales.length, revenue: sales.reduce((s,x)=>s+x.total,0) });
      }
      return days;
    },
    last14DaysDetailing(){
      const days = [];
      for (let i=13; i>=0; i--){
        const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
        const next = new Date(d); next.setDate(next.getDate()+1);
        const completed = this.vehicles.filter(v=>v.status==='completed' && v.statusHistory.some(h=>h.status==='completed' && new Date(h.at)>=d && new Date(h.at)<next));
        days.push({ date:d.getTime(), label: d.toLocaleDateString('en-US',{weekday:'short'}), count: completed.length, revenue: completed.reduce((s,v)=>s+this.vehicleTotal(v),0) });
      }
      return days;
    },

    get washPackageMix(){
      // Last 14 days
      const cutoff = Date.now() - 14*86400000;
      const recent = this.washSales.filter(s=>s.at>=cutoff);
      const map = {};
      this.washPackages.forEach(p=>{ map[p.id] = { id:p.id, name:p.name, price:p.price, count:0, revenue:0 }; });
      recent.forEach(s=>{ if(map[s.packageId]){ map[s.packageId].count++; map[s.packageId].revenue+=s.amount; } });
      const total = Math.max(1, recent.length);
      return Object.values(map).map(r=>({ ...r, pct: (r.count/total)*100 })).sort((a,b)=>b.count-a.count);
    },
    get topRetailProducts(){
      const cutoff = Date.now() - 14*86400000;
      const recent = this.retailSales.filter(s=>s.at>=cutoff);
      const map = {};
      this.retailProducts.forEach(p=>{ map[p.id] = { id:p.id, name:p.name, category:p.category, stock:p.stock, price:p.price, count:0, revenue:0 }; });
      recent.forEach(s=>{
        s.items.forEach(it=>{
          if(map[it.productId]){ map[it.productId].count += it.qty; map[it.productId].revenue += it.lineTotal; }
        });
      });
      return Object.values(map).sort((a,b)=>b.count-a.count);
    },
    get retailCategoryMix(){
      const cutoff = Date.now() - 14*86400000;
      const recent = this.retailSales.filter(s=>s.at>=cutoff);
      const map = {};
      recent.forEach(s=>{
        s.items.forEach(it=>{
          const p = this.retailProductById(it.productId);
          if (!p) return;
          map[p.category] = map[p.category] || { name:p.category, count:0, revenue:0 };
          map[p.category].count += it.qty;
          map[p.category].revenue += it.lineTotal;
        });
      });
      const total = Math.max(1, Object.values(map).reduce((s,r)=>s+r.revenue,0));
      return Object.values(map).map(r=>({ ...r, pct:(r.revenue/total)*100 })).sort((a,b)=>b.revenue-a.revenue);
    },

    get streamBreakdown(){
      // Last 30 days revenue by stream
      const cutoff = Date.now() - 30*86400000;
      const detailing = this.vehicles.filter(v=>v.status==='completed' && new Date(v.dropOffTime).getTime() >= cutoff).reduce((s,v)=>s+this.vehicleTotal(v),0);
      const wash = this.washSales.filter(s=>s.at>=cutoff).reduce((s,x)=>s+x.amount,0);
      const retail = this.retailSales.filter(s=>s.at>=cutoff).reduce((s,x)=>s+x.total,0);
      const total = detailing + wash + retail;
      return {
        detailing, wash, retail, total,
        detailingPct: total ? (detailing/total)*100 : 0,
        washPct: total ? (wash/total)*100 : 0,
        retailPct: total ? (retail/total)*100 : 0
      };
    },

    /* ========= AI Insights ========= */
    get insights(){
      const cutoff = this.now - 90*86400*1000;
      const completed = this.vehicles.filter(v=>v.status==='completed' && new Date(v.dropOffTime) >= cutoff);
      const all = this.vehicles.filter(v=>v.status==='completed');

      // Helper: turnaround in ms for a vehicle
      const turnaround = v =>{
        const start = new Date(v.dropOffTime);
        const endEvent = v.statusHistory.find(h=>h.status==='completed');
        return endEvent ? (new Date(endEvent.at) - start) : 0;
      };

      // Per-stage avg time (between status entry and exit)
      const stageMs = {};
      const stageCounts = {};
      completed.forEach(v=>{
        const hist = [...v.statusHistory].sort((a,b)=>new Date(a.at)-new Date(b.at));
        for (let i=0; i<hist.length-1; i++){
          const s = hist[i].status;
          const dt = new Date(hist[i+1].at) - new Date(hist[i].at);
          if (dt >0 && dt < 24*3600*1000) { // ignore overnight gaps
            stageMs[s] = (stageMs[s]||0) + dt;
            stageCounts[s] = (stageCounts[s]||0) + 1;
          }
        }
      });
      const stageBottlenecks = ['dropped','queue','service','qc','ready']
        .filter(c =>stageCounts[c])
        .map(c=>{
          const meta = this.statusMeta(c);
          const avgMs = stageMs[c]/stageCounts[c];
          return { code:c, label: meta.label, fg: meta.fg, avgMins: Math.round(avgMs/60000) };
        });
      const maxStage = Math.max(1, ...stageBottlenecks.map(r=>r.avgMins));
      stageBottlenecks.forEach(r=>r.pct = (r.avgMins/maxStage)*100);

      // Dealerships by revenue/volume
      const byDealer = this.dealerships.map(d=>{
        const vs = completed.filter(v=>v.dealershipId===d.id);
        const revenue = vs.reduce((s,v)=>s+this.vehicleTotal(v),0);
        const totalMs = vs.reduce((s,v)=>s+turnaround(v),0);
        const avgHours = vs.length ? Math.round(totalMs/vs.length/3600000*10)/10 : 0;
        return {
          id:d.id, name:d.name, brandColor:d.brandColor,
          initials:d.name.split(' ').map(w=>w[0]).slice(0,2).join(''),
          count: vs.length, revenue, avgTicket: vs.length ? revenue/vs.length : 0, avgHours
        };
      });
      const dealersByRevenue = [...byDealer].sort((a,b)=>b.revenue-a.revenue).slice(0,5);
      const maxR = Math.max(1, ...dealersByRevenue.map(r=>r.revenue));
      dealersByRevenue.forEach(r=>r.pct = (r.revenue/maxR)*100);
      const dealersByVolume = [...byDealer].sort((a,b)=>b.count-a.count).slice(0,5);
      const maxV = Math.max(1, ...dealersByVolume.map(r=>r.count));
      dealersByVolume.forEach(r=>r.pct = (r.count/maxV)*100);

      // Detailer leaderboard
      const detailerMs = {};
      const detailerCounts = {};
      completed.forEach(v=>{
        if (!v.assignedDetailer) return;
        detailerCounts[v.assignedDetailer] = (detailerCounts[v.assignedDetailer]||0) + 1;
        detailerMs[v.assignedDetailer] = (detailerMs[v.assignedDetailer]||0) + turnaround(v);
      });
      const teamAvgMins = Object.values(detailerMs).length
        ? (Object.values(detailerMs).reduce((s,m)=>s+m,0) / Object.values(detailerCounts).reduce((s,c)=>s+c,0)) / 60000
        : 0;
      const detailerStats = this.detailers
        .filter(d=>detailerCounts[d.id])
        .map(d=>{
          const avgMins = Math.round((detailerMs[d.id]/detailerCounts[d.id])/60000);
          // efficiency: lower mins/car = better; positive % means faster than team avg
          const efficiencyVsAvg = teamAvgMins ? Math.round(((teamAvgMins - avgMins)/teamAvgMins)*100) : 0;
          return { id:d.id, name:d.name, count: detailerCounts[d.id], avgMins, efficiencyVsAvg };
        })
        .sort((a,b)=>b.count-a.count);
      const maxDet = Math.max(1, ...detailerStats.map(r=>r.count));
      detailerStats.forEach(r=>r.pct = (r.count/maxDet)*100);

      // Service stats
      const svcMap = {};
      completed.forEach(v=>{
        const sheet = this.rateSheetFor(v.dealershipId);
        v.services.forEach(sid=>{
          const r = sheet.find(x=>x.serviceId===sid);
          const name = r?.custom ? r.name : (this.serviceById(sid)?.name || sid);
          svcMap[sid] = svcMap[sid] || { id:sid, name, count:0, revenue:0 };
          svcMap[sid].count++;
          svcMap[sid].revenue += (r?.price||0);
        });
      });
      const serviceStats = Object.values(svcMap).sort((a,b)=>b.count-a.count).slice(0,8);
      const maxSvc = Math.max(1, ...serviceStats.map(r=>r.count));
      serviceStats.forEach(r=>r.pct = (r.count/maxSvc)*100);

      // Day of week
      const dowCount = [0,0,0,0,0,0,0];
      completed.forEach(v=>{ dowCount[new Date(v.dropOffTime).getDay()]++; });
      const dowLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const maxDow = Math.max(1, ...dowCount);
      const peakIdx = dowCount.indexOf(maxDow);
      const dayOfWeek = dowCount.map((c,i)=>({
        label: dowLabels[i], count: c, pct: (c/maxDow)*100, isPeak: i===peakIdx
      }));

      // Service combos
      const comboMap = {};
      completed.forEach(v=>{
        if (v.services.length < 2) return;
        const key = [...v.services].sort().join('+');
        if (!comboMap[key]) comboMap[key] = { ids: [...v.services].sort(), count:0, totalRevenue:0 };
        comboMap[key].count++;
        comboMap[key].totalRevenue += this.vehicleTotal(v);
      });
      const combos = Object.values(comboMap)
        .filter(c=>c.count>=2)
        .sort((a,b)=>b.count-a.count).slice(0,6)
        .map(c=>{
          const sheet0 = this.rateSheetFor(this.dealerships[0]?.id);
          const labels = c.ids.map(sid=>{
            const s = this.serviceById(sid); return s ? s.name : (sheet0?.find(r=>r.serviceId===sid)?.name || 'Custom');
          });
          return { label: labels.join(' + '), count: c.count, avgTotal: c.totalRevenue/c.count };
        });

      // Headline cards
      const totalRev90 = completed.reduce((s,v)=>s+this.vehicleTotal(v),0);
      const avgTurnMs = completed.length ? completed.reduce((s,v)=>s+turnaround(v),0)/completed.length : 0;
      const avgTurnHrs = avgTurnMs/3600000;
      const avgTurnaroundLabel = `${Math.floor(avgTurnHrs)}h ${Math.floor((avgTurnMs%3600000)/60000)}m`;
      const headline = [];
      if (this.canSeePrices) headline.push({ label:'Revenue (90d)', value: this.money(totalRev90), subtitle: completed.length+' vehicles', color:'#0f766e' });
      headline.push({ label:'Throughput (90d)', value: completed.length, subtitle: `${Math.round(completed.length/Math.max(1,90))} cars/day avg`, color:'#1d4ed8' });
      headline.push({ label:'Avg turnaround', value: avgTurnaroundLabel, subtitle: 'drop-off to completed', color:'#9f1239' });

      // Recommendations
      const rec = [];
      // Slow stage
      if (stageBottlenecks.length){
        const slowest = [...stageBottlenecks].sort((a,b)=>b.avgMins-a.avgMins)[0];
        if (slowest.avgMins >60) rec.push({
          icon:'⏱', severity:'medium',
          title:`${slowest.label} is your biggest time sink (avg ${slowest.avgMins}m)`,
          body:`Consider adding a second person at ${slowest.label.toLowerCase()} during peak times, or breaking the step into a checklist to identify where time is lost.`
        });
      }
      // Detailer outlier
      if (detailerStats.length >= 2){
        const fastest = detailerStats.find(d=>d.efficiencyVsAvg >15);
        const slowest = detailerStats.find(d=>d.efficiencyVsAvg < -15);
        if (fastest) rec.push({
          icon:'', severity:'low',
          title:`${fastest.name} is ${fastest.efficiencyVsAvg}% faster than team avg`,
          body:`Have ${fastest.name.split(' ')[0]} document their workflow and run a 15-minute training. Replicating their process across the team could increase capacity.`
        });
        if (slowest) rec.push({
          icon:'', severity:'medium',
          title:`${slowest.name} is ${Math.abs(slowest.efficiencyVsAvg)}% slower than team avg`,
          body:`Pair them with the top performer for a shift, or check if they're consistently being assigned harder jobs (full details vs express). Could also be equipment/station issue.`
        });
      }
      // Customer concentration risk
      if (this.canSeePrices && dealersByRevenue.length){
        const top = dealersByRevenue[0];
        const share = totalRev90 ? (top.revenue/totalRev90)*100 : 0;
        if (share >40) rec.push({
          icon:'', severity:'high',
          title:`${top.name} is ${Math.round(share)}% of revenue — concentration risk`,
          body:`Losing this account would drop revenue by ${Math.round(share)}%. Prioritize service excellence here AND prospect 1-2 similar-size accounts to diversify.`
        });
      }
      // Bundle opportunity
      if (combos.length){
        const best = combos[0];
        rec.push({
          icon:'', severity:'low',
          title:`"${best.label}" is your most popular service combo (${best.count} jobs)`,
          body: this.canSeePrices
            ? `Avg total ${this.money(best.avgTotal)}. Package this as a named bundle with a small discount — easier to upsell, easier to schedule.`
            : `Package this as a named bundle on the rate sheet. Streamlines intake and makes upselling easier.`
        });
      }
      // Day of week
      const peakDay = dowLabels[peakIdx];
      const slowDays = dowCount.map((c,i)=>({c,i})).filter(x=>x.c < maxDow*0.4).map(x=>dowLabels[x.i]);
      if (peakDay && completed.length >5){
        rec.push({
          icon:'', severity:'low',
          title:`${peakDay} is your busiest day`,
          body: slowDays.length
            ? `${peakDay} runs hot, ${slowDays.join('/')} runs slow. Consider offering dealerships a discount for slow-day drop-offs to smooth the workload.`
            : `Make sure ${peakDay}s are fully staffed and queue order is optimized — that's where bottlenecks compound.`
        });
      }
      // Overdue invoices
      if (this.canSeePrices){
        const overdueInvs = this.invoices.filter(i=>this.isInvoiceOverdue(i));
        if (overdueInvs.length){
          const total = overdueInvs.reduce((s,i)=>s+i.total,0);
          rec.push({
            icon:'', severity:'high',
            title:`${overdueInvs.length} invoice${overdueInvs.length>1?'s':''} overdue (${this.money(total)})`,
            body:`Send a friendly reminder today. Set up auto-reminders at 7 and 14 days past due to keep this from snowballing.`
          });
        }
      }
      // Overdue jobs
      const overdueJobs = this.vehicles.filter(v=>this.isOverdue(v));
      if (overdueJobs.length >= 2){
        rec.push({
          icon:'', severity:'high',
          title:`${overdueJobs.length} jobs are past their promised time`,
          body:`Call those dealerships now with a new ETA — proactive communication beats waiting for them to ask. Then look at why: scheduling, staffing, or scope creep?`
        });
      }
      // Cross-stream insights
      if (this.canSeePrices) {
        const sb = this.streamBreakdown;
        if (sb.total >0) {
          // Concentration in one stream
          if (sb.detailingPct >60) rec.push({
            icon:'', severity:'medium',
            title:`Detailing is ${Math.round(sb.detailingPct)}% of revenue`,
            body:`Heavy detailing concentration. Wash Line and Retail are higher-margin per-labor-hour — push membership signups and retail attach at the wash line to balance.`
          });
          if (sb.washPct >60) rec.push({
            icon:'', severity:'medium',
            title:`Wash Line is ${Math.round(sb.washPct)}% of revenue`,
            body:`The wash line carries the business. Detailing has higher per-vehicle revenue — consider promoting upsell from wash to detail with on-site signage and discount stacking.`
          });
          // Retail attach rate
          const washCount14 = this.last14DaysWash().reduce((s,d)=>s+d.count,0);
          const retailCount14 = this.last14DaysRetail().reduce((s,d)=>s+d.count,0);
          if (washCount14 >0) {
            const attachRate = (retailCount14/washCount14)*100;
            if (attachRate < 30) rec.push({
              icon:'', severity:'medium',
              title:`Retail attach rate is only ${Math.round(attachRate)}%`,
              body:`For every 100 washes, only ${Math.round(attachRate)} retail purchases. Move impulse items (drinks, air fresheners) closer to checkout, or offer a $1 add-on combo with Premium washes.`
            });
            if (attachRate >= 50) rec.push({
              icon:'', severity:'low',
              title:`Strong retail attach: ${Math.round(attachRate)}%`,
              body:`Half your wash customers also buy retail. Test a single bundled "wash + drink + air freshener" SKU at $20 — captures the willingness to pay you've already established.`
            });
          }
          // Membership opportunity
          const unlimited = this.washPackageMix.find(p=>p.id==='wp_unl');
          if (unlimited && washCount14 >50) {
            const memberPct = (unlimited.count/washCount14)*100;
            if (memberPct < 8) rec.push({
              icon:'', severity:'medium',
              title:`Only ${Math.round(memberPct)}% of washes are Memberships`,
              body:`Memberships smooth revenue and lock in repeat visits. Goal range is 15-25%. Train wash-line staff on a 30-second pitch: "Two washes pays for the month."`
            });
          }
          // Inventory low
          const lowStock = this.retailProducts.filter(p=>p.stock < 20);
          if (lowStock.length) rec.push({
            icon:'', severity:'medium',
            title:`${lowStock.length} retail SKU${lowStock.length>1?'s':''} running low`,
            body:`${lowStock.map(p=>p.name).join(', ')}. Reorder before stockout — lost retail sales hurt the highest-margin stream.`
          });
        }
      }

      const peakDayInsight = slowDays.length
        ? `Peak: ${peakDay}. Slowest: ${slowDays.join(', ')}. Smoothing demand could increase weekly capacity ~${Math.round(((maxDow*7)-completed.length)/Math.max(1,completed.length)*10)}%.`
